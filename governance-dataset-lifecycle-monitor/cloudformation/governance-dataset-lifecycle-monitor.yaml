AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Amazon Quick dataset lifecycle monitor. A scheduled collector Lambda scans
  every dataset (no co-ownership required - IAM-authorized read-only APIs) and
  publishes per-dataset sync health (last refresh status + typed failure
  reason), sync duration (last + average, segmented by refresh type), and
  last-observed-use evidence with confidence labels as JSONL snapshots in the
  shared analytics bucket of the Analytics Foundation stack, where the module's
  Amazon Quick dashboard reads them; low-cardinality fleet KPIs drive the
  alarms. Optional SNS alerts fire once per new refresh failure. Deploy via
  scripts/apply-governance-dataset-lifecycle-monitor.sh (sam build + deploy,
  then the Quick dashboard).

# Prerequisites (NOT created by this stack):
#   * Amazon Quick subscription in this same account/Region.
#   * Nothing else: CloudTrail evidence uses the always-on 90-day Event
#     history (no trail required); dashboard-view evidence uses the native
#     AWS/QuickSight vended metrics.

Parameters:
  ResourcePrefix:
    Type: String
    Default: 'quick-governance-dataset-lifecycle'
    Description: >
      Prefix applied to every resource name. Also part of the S3 bucket name,
      so keep it lowercase and DNS-safe.
    AllowedPattern: '^[a-z0-9-]{1,40}$'
    ConstraintDescription: 1-40 chars, lowercase letters, digits, hyphens.

  FastLoopSchedule:
    Type: String
    Default: 'rate(1 hour)'
    Description: >
      Schedule for the sync-health loop (ListIngestions sweep: last status,
      failure reason, durations). rate() or cron() expression.

  SlowLoopSchedule:
    Type: String
    Default: 'cron(15 3 * * ? *)'
    Description: >
      Schedule for the usage/lineage/capacity loop (dashboard lineage,
      DashboardViewCount evidence, CloudTrail evidence, SPICE capacity).
      Default daily at 03:15 UTC.

  AlertEmail:
    Type: String
    Default: ''
    Description: >
      Email address for refresh-failure alerts and alarms. Leave empty to
      deploy without SNS notifications. The subscription must be confirmed
      from the inbox after deployment.

  EnableCloudTrailEvidence:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Merge CloudTrail Event history evidence (QueryDatabase, GetDashboard)
      into last-observed-use. Uses the always-on 90-day Event history via
      cloudtrail:LookupEvents; no trail is required.

  ChatLogGroupName:
    Type: String
    Default: '/aws/vendedlogs/quick/chat-feedback'
    AllowedPattern: '^$|^[\.\-_/#A-Za-z0-9]+$'
    Description: >
      Log group receiving the CHAT_LOGS vended feed (created by the Chat and
      Feedback Monitor module, Pillar 2). When set, the slow loop scans it
      for resources cited by Chat Agents or selected by users in chat and
      turns them into agent-side usage evidence (AGENT_CITED_*). If the log
      group does not exist the scan is skipped with a warning. Leave empty
      to disable.

  AgentScopeMediumMax:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 10000
    Description: >
      AGENT_CONVERSATION_SCOPE evidence (a conversation ran on an agent that
      can reach the dataset) is MEDIUM confidence when the agent's reachable
      dataset count is at or below this threshold, LOW above it. Smaller
      values demand tighter agent scoping before the signal is trusted.

  SpiceRatePerGBMonth:
    Type: String
    Default: '0.38'
    AllowedPattern: '^[0-9]+(\.[0-9]+)?$'
    Description: >
      USD per SPICE GB-month used for the ESTIMATED_PURCHASED cost signal
      (example us-east-1 rate; adjust to your Region/agreement). The output
      is a managerial estimate, never an AWS invoice amount.

  UnusedThresholdDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 455
    Description: >
      Days without observed use before a referenced dataset is counted in the
      NO_OBSERVED_USE finding and the NoObservedUseDatasets KPI.

  IngestionLookbackRuns:
    Type: Number
    Default: 50
    MinValue: 5
    MaxValue: 200
    Description: Newest ingestions per dataset used to compute averages.

  CloudTrailLookbackDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 90
    Description: >
      CloudTrail Event history lookback for the first scan (Event history
      retains at most 90 days). Later scans are incremental.

  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: Retention (days) for the data log group and the Lambda log group.

  FunctionTimeoutSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    MaxValue: 900

  FunctionMemoryMb:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240

  ExcludeAssetIdPrefixes:
    Type: String
    Default: 'quick-governance-'
    AllowedPattern: '^[A-Za-z0-9_,. -]*$'
    Description: >
      Comma-separated asset-ID prefixes to leave out of the scan. The default
      skips the Quick assets created by the governance stacks themselves (IDs
      quick-governance-*), so the monitor does not report on its own dashboards
      and datasets. Empty scans everything.

  AnalyticsBucketName:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: An existing S3 bucket name (3-63 chars).
    Description: >
      Shared analytics bucket created by the Analytics Foundation stack (its
      AnalyticsBucketName output; the apply script resolves it). Snapshots land
      under dataset-lifecycle/ (the Quick dashboard's Glue table locations) and the
      collector's working state under dataset-lifecycle/state/.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  HasChatLogGroup: !Not [!Equals [!Ref ChatLogGroupName, '']]
Resources:

  # ----- Alerts ----------------------------------------------------------------

  AlertTopicKey:
    Type: AWS::KMS::Key
    Condition: HasAlertEmail
    Properties:
      Description: !Sub 'Encrypts the ${ResourcePrefix} alert topic (SNS SSE)'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          # Root delegation enables identity-based grants (the collector
          # role gets kms:Decrypt/GenerateDataKey via its own policy).
          - Sid: AccountRootAdmin
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: !Sub '${ResourcePrefix}-alerts'
      KmsMasterKeyId: !Ref AlertTopicKey
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ----- Collector Lambda -----------------------------------------------------

  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: !Sub '${ResourcePrefix}-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: QuickSightListInventory
                Effect: Allow
                Action:
                  - quicksight:ListDataSets
                  - quicksight:ListDashboards
                  - quicksight:ListTopics
                  - quicksight:ListTopicsV2
                  - quicksight:ListSpaces
                  - quicksight:ListAgents
                Resource: '*'
              - Sid: QuickSightDatasetRead
                Effect: Allow
                Action:
                  - quicksight:DescribeDataSet
                  - quicksight:ListIngestions
                Resource: !Sub 'arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:dataset/*'
              - Sid: QuickSightDashboardRead
                Effect: Allow
                Action:
                  - quicksight:DescribeDashboard
                Resource: !Sub 'arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:dashboard/*'
              - Sid: QuickSightTopicRead
                Effect: Allow
                Action:
                  - quicksight:DescribeTopic
                  - quicksight:DescribeTopicV2
                Resource: !Sub 'arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:topic/*'
              - Sid: QuickSightSpaceRead
                Effect: Allow
                Action:
                  - quicksight:ListSpaceResources
                Resource: !Sub 'arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:space/*'
              - Sid: QuickSightAgentRead
                Effect: Allow
                Action:
                  - quicksight:DescribeAgent
                Resource: !Sub 'arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:agent/*'
              - Sid: CloudWatchReadViewMetrics
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                Resource: '*'
              - Sid: CloudWatchWriteKpis
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: 'QuickGovernance/DatasetLifecycle'
              - Sid: SharedBucketSnapshotAndStateWrite
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AnalyticsBucketName}/dataset-lifecycle/*'
              - Sid: SharedBucketStateRead
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AnalyticsBucketName}/dataset-lifecycle/state/*'
              # ListBucket is what turns a missing state file into NoSuchKey
              # (first run) instead of AccessDenied; key names only.
              - Sid: SharedBucketList
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AnalyticsBucketName}'
              - Sid: CloudTrailEventHistoryRead
                Effect: Allow
                Action:
                  - cloudtrail:LookupEvents
                Resource: '*'
              - !If
                - HasChatLogGroup
                - Sid: ChatLogsInsightsQuery
                  Effect: Allow
                  Action:
                    - logs:StartQuery
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ChatLogGroupName}'
                    - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ChatLogGroupName}:*'
                - !Ref AWS::NoValue
              - !If
                - HasChatLogGroup
                - Sid: ChatLogsInsightsResults
                  Effect: Allow
                  Action:
                    - logs:GetQueryResults
                    - logs:StopQuery
                  Resource: '*'
                - !Ref AWS::NoValue
              - !If
                - HasAlertEmail
                - Sid: SnsPublishAlerts
                  Effect: Allow
                  Action:
                    - sns:Publish
                  Resource: !Ref AlertTopic
                - !Ref AWS::NoValue
              - !If
                - HasAlertEmail
                - Sid: KmsForEncryptedAlerts
                  Effect: Allow
                  Action:
                    - kms:Decrypt
                    - kms:GenerateDataKey*
                  Resource: !GetAtt AlertTopicKey.Arn
                - !Ref AWS::NoValue
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix
        - Key: ManagedBy
          Value: CloudFormation

  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ResourcePrefix}-fn'
      RetentionInDays: !Ref LogRetentionDays

  CollectorFunction:
    Type: AWS::Serverless::Function
    DependsOn: CollectorLogGroup
    Properties:
      FunctionName: !Sub '${ResourcePrefix}-fn'
      Description: >
        Scans Amazon Quick datasets: sync health, durations, usage evidence.
      Runtime: python3.14
      Architectures:
        - arm64
      Handler: collector.lambda_handler
      CodeUri: ../lambda/
      Role: !GetAtt CollectorRole.Arn
      Timeout: !Ref FunctionTimeoutSeconds
      MemorySize: !Ref FunctionMemoryMb
      # Serializes the two loops so combined QuickSight API pressure stays
      # under the per-user TPS quotas. A colliding run is throttled and
      # retried by EventBridge.
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          QS_ACCOUNT_ID: !Ref AWS::AccountId
          STATE_BUCKET: !Ref AnalyticsBucketName
          STATE_PREFIX: 'dataset-lifecycle/'
          SNAPSHOT_BUCKET: !Ref AnalyticsBucketName
          SNAPSHOT_PREFIX: 'dataset-lifecycle/'
          EXCLUDE_ASSET_ID_PREFIXES: !Ref ExcludeAssetIdPrefixes
          SNS_TOPIC_ARN: !If [HasAlertEmail, !Ref AlertTopic, '']
          ENABLE_CLOUDTRAIL: !Ref EnableCloudTrailEvidence
          SPICE_RATE_PER_GB_MONTH: !Ref SpiceRatePerGBMonth
          UNUSED_THRESHOLD_DAYS: !Ref UnusedThresholdDays
          INGESTION_LOOKBACK_RUNS: !Ref IngestionLookbackRuns
          CT_LOOKBACK_DAYS: !Ref CloudTrailLookbackDays
          CHAT_LOG_GROUP: !Ref ChatLogGroupName
          AGENT_SCOPE_MEDIUM_MAX: !Ref AgentScopeMediumMax
          LOG_RETENTION_DAYS: !Ref LogRetentionDays
      Events:
        FastLoop:
          Type: Schedule
          Properties:
            Name: !Sub '${ResourcePrefix}-fast'
            Description: Sync-health sweep (status, failure reason, durations).
            Schedule: !Ref FastLoopSchedule
            Input: '{"mode": "fast"}'
        SlowLoop:
          Type: Schedule
          Properties:
            Name: !Sub '${ResourcePrefix}-slow'
            Description: Usage, lineage, and capacity sweep.
            Schedule: !Ref SlowLoopSchedule
            Input: '{"mode": "slow"}'
      Tags:
        Purpose: !Ref ResourcePrefix
        ManagedBy: CloudFormation

  # ----- Alarms ---------------------------------------------------------------

  IngestionFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ResourcePrefix}-ingestion-failures'
      AlarmDescription: >
        At least one Amazon Quick SPICE ingestion failed in the last 5 minutes
        (native account-aggregate metric; minutes-level MTTD between collector
        runs). The dashboard and SNS alert carry the per-dataset reason.
      Namespace: AWS/QuickSight
      MetricName: IngestionErrorCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], []]

  CollectorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ResourcePrefix}-collector-errors'
      AlarmDescription: >
        The dataset-lifecycle collector Lambda reported at least one error in
        15 minutes. Scan data may be stale or partial.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CollectorFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], []]

Outputs:
  ResourcePrefix:
    Description: Prefix shared by every AWS resource created by this stack.
    Value: !Ref ResourcePrefix
    Export:
      Name: !Sub '${AWS::StackName}-ResourcePrefix'

  FunctionName:
    Description: Name of the collector Lambda function.
    Value: !Ref CollectorFunction
    Export:
      Name: !Sub '${AWS::StackName}-FunctionName'

  StateLocation:
    Description: Where the collector keeps its working state (state/*.json).
    Value: !Sub 's3://${AnalyticsBucketName}/dataset-lifecycle/state/'

  AlertTopicArn:
    Condition: HasAlertEmail
    Description: SNS topic receiving refresh-failure alerts and alarms.
    Value: !Ref AlertTopic

  RunFastLoopNowCommand:
    Description: Convenience command to trigger a sync-health scan immediately.
    Value: !Sub >-
      aws lambda invoke --function-name ${CollectorFunction}
      --payload '{"mode": "fast"}' --cli-binary-format raw-in-base64-out
      --region ${AWS::Region} /dev/stdout

  RunSlowLoopNowCommand:
    Description: Convenience command to trigger a usage/capacity scan immediately.
    Value: !Sub >-
      aws lambda invoke --function-name ${CollectorFunction}
      --payload '{"mode": "slow"}' --cli-binary-format raw-in-base64-out
      --region ${AWS::Region} /dev/stdout

  SnapshotLocation:
    Description: S3 prefix that receives the JSONL snapshots (fast/ and slow/ below it; Glue table locations for the Quick dashboard).
    Value: !Sub 's3://${AnalyticsBucketName}/dataset-lifecycle/'

                      RowSort:
                        - FieldSort: {FieldId: db-tbl-delete-m0, Direction: DESC}
                    FieldOptions:
                      SelectedFieldOptions:
                        - {FieldId: db-tbl-delete-g0, CustomLabel: 'Dashboard'}
                        - {FieldId: db-tbl-delete-g1, CustomLabel: 'Datasets used'}
                        - {FieldId: db-tbl-delete-m0, CustomLabel: 'Order', Visibility: HIDDEN}
                        - {FieldId: db-tbl-delete-m1, CustomLabel: 'Days since the last view'}
                        - {FieldId: db-tbl-delete-m2, CustomLabel: 'Last published (UTC)'}
              - BarChartVisual:
                  VisualId: db-bar-viewed

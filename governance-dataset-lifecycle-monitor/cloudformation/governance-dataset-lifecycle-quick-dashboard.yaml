                    TitleOptions: {Visibility: VISIBLE}
            SheetControlLayouts:
              - Configuration:
                  GridLayout:
                    Elements:
                      - {ElementId: pc-cp-start, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: pc-cp-end, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: pc-cp-pIdleDays, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-cp-mode, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-cp-dataset, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-cp-state, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
            Visuals:
              - TableVisual:
                  VisualId: cp-tbl-largest

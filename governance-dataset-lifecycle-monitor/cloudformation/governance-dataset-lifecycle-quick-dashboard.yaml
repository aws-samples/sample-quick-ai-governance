            Expression: 'ifelse({usage_state} <> ''UNKNOWN'', NULL, ifelse(isNull({created_at}), ''created date is missing'', ifelse(dateDiff({created_at}, now(), ''DD'') <= parseInt(${pIdleDays}), concat(''created '', toString(dateDiff({created_at}, now(), ''DD'')), '' days ago''), concat(''coverage is '', toString(ifelse(isNull({coverage_start}), 0, dateDiff({coverage_start}, now(), ''DD''))), '' days''))))'
          - DataSetIdentifier: dashes
            Name: recheck_after
            Expression: 'ifelse({usage_state} <> ''UNKNOWN'', NULL, ifelse(isNull({created_at}), addDateTime(parseInt(${pIdleDays}), ''DD'', {coverage_start}), ifelse(isNull({coverage_start}), addDateTime(parseInt(${pIdleDays}), ''DD'', {created_at}), ifelse(addDateTime(parseInt(${pIdleDays}), ''DD'', {created_at}) > addDateTime(parseInt(${pIdleDays}), ''DD'', {coverage_start}), addDateTime(parseInt(${pIdleDays}), ''DD'', {created_at}), addDateTime(parseInt(${pIdleDays}), ''DD'', {coverage_start})))))'

                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-unref-v, Column: {DataSetIdentifier: usage, ColumnName: unreferenced_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-nouse
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Referenced, no observed use'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-nouse-v, Column: {DataSetIdentifier: usage, ColumnName: no_observed_use_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-gb
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'SPICE consumed (GB, estimated)'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-gb-v, Column: {DataSetIdentifier: usage, ColumnName: spice_gb}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 2}}}}}
              - KPIVisual:

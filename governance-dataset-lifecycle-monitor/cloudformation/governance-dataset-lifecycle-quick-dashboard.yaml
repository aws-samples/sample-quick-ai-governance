                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-spice-v, Column: {DataSetIdentifier: health, ColumnName: spice_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-dq
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Direct query datasets'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-dq-v, Column: {DataSetIdentifier: health, ColumnName: direct_query_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-failed
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'FAILED last refresh'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-failed-v, Column: {DataSetIdentifier: health, ColumnName: failed_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-unref

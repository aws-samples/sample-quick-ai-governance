                          - NumericalMeasureField: {FieldId: us-tbl-noevidence-m1, Column: {DataSetIdentifier: usage, ColumnName: topics}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}
                          - NumericalMeasureField: {FieldId: us-tbl-noevidence-m2, Column: {DataSetIdentifier: usage, ColumnName: spaces}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}
                          - NumericalMeasureField: {FieldId: us-tbl-noevidence-m3, Column: {DataSetIdentifier: usage, ColumnName: agents}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}
                          - NumericalMeasureField: {FieldId: us-tbl-noevidence-m4, Column: {DataSetIdentifier: usage, ColumnName: spice_gb}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 3}}}}}

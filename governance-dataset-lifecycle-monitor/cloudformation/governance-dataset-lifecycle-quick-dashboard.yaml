        Sheets:
          - SheetId: sh-overview
            Name: 'Overview'
            Title: 'Dataset lifecycle - overview'
            Description: 'Which datasets and dashboards need a decision, from the latest scans.'
            ParameterControls:
              - DateTimePicker:
                  ParameterControlId: pc-ov-start
                  Title: 'From'
                  SourceParameterName: pStart
                  DisplayOptions: {DateTimeFormat: 'YYYY-MM-DD'}
              - DateTimePicker:
                  ParameterControlId: pc-ov-end
                  Title: 'To (exclusive)'
                  SourceParameterName: pEnd
                  DisplayOptions: {DateTimeFormat: 'YYYY-MM-DD'}
              - Dropdown:
                  ParameterControlId: pc-ov-pIdleDays
                  Title: 'Idle after (days)'
                  SourceParameterName: pIdleDays
                  Type: SINGLE_SELECT
                  SelectableValues:
                    Values: ['30', '60', '90', '180']
                  DisplayOptions:
                    SelectAllOptions: {Visibility: HIDDEN}
                    TitleOptions: {Visibility: VISIBLE}
            FilterControls:
              - Dropdown:
                  FilterControlId: fc-ov-mode
                  Title: 'Import mode'
                  SourceFilterId: f-mode-ov
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
              - Dropdown:
                  FilterControlId: fc-ov-dataset
                  Title: 'Dataset'
                  SourceFilterId: f-dataset-ov
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
            SheetControlLayouts:
              - Configuration:
                  GridLayout:
                    Elements:
                      - {ElementId: pc-ov-start, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: pc-ov-end, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: pc-ov-pIdleDays, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-ov-mode, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-ov-dataset, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
            Visuals:
              - KPIVisual:
                  VisualId: ov-kpi-datasets
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Datasets'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-datasets-v, Column: {DataSetIdentifier: health, ColumnName: dataset_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-spice
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'SPICE datasets'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-spice-v, Column: {DataSetIdentifier: health, ColumnName: spice_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-dq
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Direct query datasets'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-dq-v, Column: {DataSetIdentifier: health, ColumnName: direct_query_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-failed
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'FAILED last refresh'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-failed-v, Column: {DataSetIdentifier: health, ColumnName: failed_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-gb
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'SPICE consumed (GB, estimated)'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-gb-v, Column: {DataSetIdentifier: usage, ColumnName: spice_gb}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 2}}}}}
              - KPIVisual:
                  VisualId: ov-kpi-cost
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Est. SPICE cost (USD / month)'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-cost-v, Column: {DataSetIdentifier: usage, ColumnName: est_monthly_cost_usd}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 2}}}}}
              - KPIVisual:
                  VisualId: ov-kpi-idle
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Idle datasets'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-idle-v, Column: {DataSetIdentifier: usage, ColumnName: idle_flag}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-unknown
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Unknown datasets'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-unknown-v, Column: {DataSetIdentifier: usage, ColumnName: unknown_flag}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-didle
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Idle dashboards'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - CategoricalMeasureField: {FieldId: ov-kpi-didle-v, Column: {DataSetIdentifier: dashes, ColumnName: idle_id}, AggregationFunction: DISTINCT_COUNT}
              - KPIVisual:
                  VisualId: ov-kpi-next
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Refreshes in the next 24 h'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-next-v, Column: {DataSetIdentifier: sched, ColumnName: runs_next_24h}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-nosched
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'SPICE datasets without a schedule'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-nosched-v, Column: {DataSetIdentifier: usage, ColumnName: no_schedule_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - TableVisual:
                  VisualId: ov-tbl-scan
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Last scan (UTC)'}}
                  ChartConfiguration:
                    FieldWells:
                      TableAggregatedFieldWells:
                        GroupBy:
                          - CategoricalDimensionField: {FieldId: ov-tbl-scan-g0, Column: {DataSetIdentifier: usage, ColumnName: scan_label}}
                        Values:
                          - DateMeasureField: {FieldId: ov-tbl-scan-m0, Column: {DataSetIdentifier: usage, ColumnName: scan_time}, AggregationFunction: MAX, FormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm'}}
                    SortConfiguration:
                      RowSort:
                        - FieldSort: {FieldId: ov-tbl-scan-m0, Direction: DESC}
                    FieldOptions:
                      SelectedFieldOptions:
                        - {FieldId: ov-tbl-scan-g0, CustomLabel: 'Scan'}
                        - {FieldId: ov-tbl-scan-m0, CustomLabel: 'Last scan (UTC)'}
              - BarChartVisual:
                  VisualId: ov-bar-status
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Datasets by last refresh status and import mode'}}
                  ChartConfiguration:
                    FieldWells:
                      BarChartAggregatedFieldWells:
                        Category:
                          - CategoricalDimensionField: {FieldId: ov-bar-status-cat, Column: {DataSetIdentifier: health, ColumnName: last_status}}
                        Values:
                          - NumericalMeasureField: {FieldId: ov-bar-status-val, Column: {DataSetIdentifier: health, ColumnName: dataset_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                        Colors:
                          - CategoricalDimensionField: {FieldId: ov-bar-status-color, Column: {DataSetIdentifier: health, ColumnName: import_mode}}
                    SortConfiguration:
                      CategorySort:
                        - FieldSort: {FieldId: ov-bar-status-val, Direction: DESC}
                    Orientation: HORIZONTAL
                    BarsArrangement: STACKED
                    Legend: {Visibility: VISIBLE, Position: BOTTOM}
              - BarChartVisual:
                  VisualId: ov-bar-confidence
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Datasets by usage confidence'}}
                  Subtitle: {Visibility: VISIBLE, FormatText: {PlainText: 'HIGH: agent citation or direct query. MEDIUM: dashboard view, SPICE query, or scope-level agent evidence. LOW: referenced only. NO_EVIDENCE: nothing observed.'}}
                  ChartConfiguration:
                    FieldWells:
                      BarChartAggregatedFieldWells:
                        Category:
                          - CategoricalDimensionField: {FieldId: ov-bar-confidence-cat, Column: {DataSetIdentifier: usage, ColumnName: usage_confidence}}
                        Values:
                          - NumericalMeasureField: {FieldId: ov-bar-confidence-val, Column: {DataSetIdentifier: usage, ColumnName: dataset_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                        Colors:
                          - CategoricalDimensionField: {FieldId: ov-bar-confidence-color, Column: {DataSetIdentifier: usage, ColumnName: import_mode}}
                    SortConfiguration:
                      CategorySort:
                        - FieldSort: {FieldId: ov-bar-confidence-val, Direction: DESC}
                    Orientation: HORIZONTAL
                    BarsArrangement: STACKED
                    Legend: {Visibility: VISIBLE, Position: BOTTOM}
              - TableVisual:
                  VisualId: ov-tbl-failed
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Currently FAILED datasets - with reason'}}
                  ChartConfiguration:
                    FieldWells:
                      TableAggregatedFieldWells:
                        GroupBy:
                          - CategoricalDimensionField: {FieldId: ov-tbl-failed-g0, Column: {DataSetIdentifier: health, ColumnName: dataset_name}}
                          - CategoricalDimensionField: {FieldId: ov-tbl-failed-g1, Column: {DataSetIdentifier: health, ColumnName: error_type}}
                          - CategoricalDimensionField: {FieldId: ov-tbl-failed-g2, Column: {DataSetIdentifier: health, ColumnName: error_message}}
                          - CategoricalDimensionField: {FieldId: ov-tbl-failed-g3, Column: {DataSetIdentifier: health, ColumnName: last_request_type}}
                        Values:
                          - DateMeasureField: {FieldId: ov-tbl-failed-m0, Column: {DataSetIdentifier: health, ColumnName: last_failed_at}, AggregationFunction: MAX, FormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm'}}
                          - DateMeasureField: {FieldId: ov-tbl-failed-m1, Column: {DataSetIdentifier: health, ColumnName: last_success_at}, AggregationFunction: MAX, FormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm'}}
                          - NumericalMeasureField: {FieldId: ov-tbl-failed-m2, Column: {DataSetIdentifier: health, ColumnName: window_failed}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}
                    SortConfiguration:
                      RowSort:
                        - FieldSort: {FieldId: ov-tbl-failed-m0, Direction: DESC}
                    FieldOptions:
                      SelectedFieldOptions:
                        - {FieldId: ov-tbl-failed-g0, CustomLabel: 'Dataset'}
                        - {FieldId: ov-tbl-failed-g1, CustomLabel: 'Error type'}
                        - {FieldId: ov-tbl-failed-g2, CustomLabel: 'Error message'}
                        - {FieldId: ov-tbl-failed-g3, CustomLabel: 'Refresh type'}
                        - {FieldId: ov-tbl-failed-m0, CustomLabel: 'Last failed'}
                        - {FieldId: ov-tbl-failed-m1, CustomLabel: 'Last success'}
                        - {FieldId: ov-tbl-failed-m2, CustomLabel: 'Failures in window'}
            TextBoxes:
              - SheetTextBoxId: ov-txt-howto
                Content: '<text-box><block align="left"><inline font-weight="bold">How to read this dashboard.</inline> ACTIVE means evidence of use inside the window. IDLE means no evidence inside the window, the evidence covers the whole window, and the asset is older than the window. UNKNOWN means the evidence covers less than the window, or the asset is newer than it. The Idle after control recalculates the current tabs. Retire dashboards first, then the datasets they leave unused: those appear in the retire candidates at the next daily scan. A row is a candidate for review. Confirm with the owner. Never treat a missing event as proof on its own. Refresh state comes from ListIngestions (hourly). Usage, schedules and dashboard views come from the daily scan.</block></text-box>'
            Layouts:
              - Configuration:
                  GridLayout:
                    CanvasSizeOptions:
                      ScreenCanvasSizeOptions: {ResizeOption: FIXED, OptimizedViewPortWidth: '1600px'}
                    Elements:
                      - {ElementId: ov-kpi-datasets, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 6, RowIndex: 0, RowSpan: 4}
                      - {ElementId: ov-kpi-spice, ElementType: VISUAL, ColumnIndex: 6, ColumnSpan: 6, RowIndex: 0, RowSpan: 4}
                      - {ElementId: ov-kpi-dq, ElementType: VISUAL, ColumnIndex: 12, ColumnSpan: 6, RowIndex: 0, RowSpan: 4}
                      - {ElementId: ov-kpi-failed, ElementType: VISUAL, ColumnIndex: 18, ColumnSpan: 6, RowIndex: 0, RowSpan: 4}
                      - {ElementId: ov-kpi-gb, ElementType: VISUAL, ColumnIndex: 24, ColumnSpan: 6, RowIndex: 0, RowSpan: 4}
                      - {ElementId: ov-kpi-cost, ElementType: VISUAL, ColumnIndex: 30, ColumnSpan: 6, RowIndex: 0, RowSpan: 4}
                      - {ElementId: ov-kpi-idle, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 6, RowIndex: 4, RowSpan: 4}
                      - {ElementId: ov-kpi-unknown, ElementType: VISUAL, ColumnIndex: 6, ColumnSpan: 6, RowIndex: 4, RowSpan: 4}

                          - NumericalDimensionField: {FieldId: db-tbl-all-g9, Column: {DataSetIdentifier: dashes, ColumnName: views_year_ago_90}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}
                          - DateDimensionField: {FieldId: db-tbl-all-g10, Column: {DataSetIdentifier: dashes, ColumnName: last_published_at}, DateGranularity: SECOND, FormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm'}}
                          - CategoricalDimensionField: {FieldId: db-tbl-all-g11, Column: {DataSetIdentifier: dashes, ColumnName: dataset_names}}
                        Values:

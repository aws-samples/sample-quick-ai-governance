                  Subtitle: {Visibility: VISIBLE, FormatText: {PlainText: 'Export a backup (asset bundle) and confirm with the owner first. No idle dashboard also has a year-ago history of zero views when this table is empty.'}}
                  ChartConfiguration:
                    FieldWells:
                      TableAggregatedFieldWells:
                        GroupBy:
                          - CategoricalDimensionField: {FieldId: db-tbl-delete-g0, Column: {DataSetIdentifier: dashes, ColumnName: dashboard_name}}
                          - CategoricalDimensionField: {FieldId: db-tbl-delete-g1, Column: {DataSetIdentifier: dashes, ColumnName: dataset_names}}
                        Values:
                          - NumericalMeasureField: {FieldId: db-tbl-delete-m0, Column: {DataSetIdentifier: dashes, ColumnName: staleness}, AggregationFunction: {SimpleNumericalAggregation: MAX}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}
                          - NumericalMeasureField: {FieldId: db-tbl-delete-m1, Column: {DataSetIdentifier: dashes, ColumnName: days_now}, AggregationFunction: {SimpleNumericalAggregation: MAX}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}
                          - DateMeasureField: {FieldId: db-tbl-delete-m2, Column: {DataSetIdentifier: dashes, ColumnName: last_published_at}, AggregationFunction: MAX, FormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm'}}

                  ChartConfiguration:
                    FieldWells:
                      TableAggregatedFieldWells:
                        GroupBy:
                          - CategoricalDimensionField: {FieldId: cp-tbl-largest-g0, Column: {DataSetIdentifier: usage, ColumnName: dataset_name}}
                          - CategoricalDimensionField: {FieldId: cp-tbl-largest-g1, Column: {DataSetIdentifier: usage, ColumnName: usage_state}}
                          - CategoricalDimensionField: {FieldId: cp-tbl-largest-g2, Column: {DataSetIdentifier: usage, ColumnName: cost_type}}

                        - {FieldId: db-tbl-all-g1, CustomLabel: 'State'}
                        - {FieldId: db-tbl-all-g2, CustomLabel: 'View label'}
                        - {FieldId: db-tbl-all-g3, CustomLabel: 'Source'}
                        - {FieldId: db-tbl-all-g4, CustomLabel: 'Owner status'}
                        - {FieldId: db-tbl-all-g5, CustomLabel: 'Days since the last view'}
                        - {FieldId: db-tbl-all-g6, CustomLabel: 'Last view (UTC)'}

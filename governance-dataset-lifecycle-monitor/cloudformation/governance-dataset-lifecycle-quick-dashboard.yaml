                          - {FieldId: hs-tbl-failures-c2, Column: {DataSetIdentifier: hist, ColumnName: error_type}}
                          - {FieldId: hs-tbl-failures-c3, Column: {DataSetIdentifier: hist, ColumnName: error_message}}

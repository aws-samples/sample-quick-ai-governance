                        Values:
                          - NumericalMeasureField: {FieldId: hs-line-idle-val, Column: {DataSetIdentifier: idlehist, ColumnName: idle_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                        Colors:
                          - CategoricalDimensionField: {FieldId: hs-line-idle-color, Column: {DataSetIdentifier: idlehist, ColumnName: series}}
                    Type: LINE
                    Legend: {Visibility: VISIBLE, Position: BOTTOM}
            Layouts:
              - Configuration:
                  GridLayout:
                    CanvasSizeOptions:
                      ScreenCanvasSizeOptions: {ResizeOption: FIXED, OptimizedViewPortWidth: '1600px'}
                    Elements:
                      - {ElementId: hs-line-failed, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 18, RowIndex: 0, RowSpan: 11}
                      - {ElementId: hs-bar-status, ElementType: VISUAL, ColumnIndex: 18, ColumnSpan: 18, RowIndex: 0, RowSpan: 11}
                      - {ElementId: hs-tbl-failures, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 36, RowIndex: 11, RowSpan: 12}
                      - {ElementId: hs-line-idle, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 36, RowIndex: 23, RowSpan: 8}
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}
        - {Key: ManagedBy, Value: CloudFormation}

Outputs:
  DashboardUrl:
    Description: Open the dashboard in AWS Quick (this Region).
    Value: !Sub 'https://${AWS::Region}.quicksight.aws.amazon.com/sn/dashboards/${ResourcePrefix}-dashboard'

                          - NumericalMeasureField: {FieldId: cp-tbl-largest-m1, Column: {DataSetIdentifier: usage, ColumnName: est_monthly_cost_usd}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 2}}}}}
                          - NumericalMeasureField: {FieldId: cp-tbl-largest-m2, Column: {DataSetIdentifier: usage, ColumnName: dashboards}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}
                          - NumericalMeasureField: {FieldId: cp-tbl-largest-m3, Column: {DataSetIdentifier: usage, ColumnName: topics}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}
                          - NumericalMeasureField: {FieldId: cp-tbl-largest-m4, Column: {DataSetIdentifier: usage, ColumnName: days_now}, AggregationFunction: {SimpleNumericalAggregation: MAX}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}

                          - CategoricalDimensionField: {FieldId: db-tbl-all-g3, Column: {DataSetIdentifier: dashes, ColumnName: last_view_source}}
                          - CategoricalDimensionField: {FieldId: db-tbl-all-g4, Column: {DataSetIdentifier: dashes, ColumnName: owner_status}}
                          - NumericalDimensionField: {FieldId: db-tbl-all-g5, Column: {DataSetIdentifier: dashes, ColumnName: days_now}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}
                          - DateDimensionField: {FieldId: db-tbl-all-g6, Column: {DataSetIdentifier: dashes, ColumnName: last_view_at}, DateGranularity: SECOND, FormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm'}}

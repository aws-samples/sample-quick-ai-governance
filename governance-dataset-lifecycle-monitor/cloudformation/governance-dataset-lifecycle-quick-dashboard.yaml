                      - {ElementId: ov-kpi-dq, ElementType: VISUAL, ColumnIndex: 8, ColumnSpan: 4, RowIndex: 0, RowSpan: 5}
                      - {ElementId: ov-kpi-failed, ElementType: VISUAL, ColumnIndex: 12, ColumnSpan: 4, RowIndex: 0, RowSpan: 5}
                      - {ElementId: ov-kpi-unref, ElementType: VISUAL, ColumnIndex: 16, ColumnSpan: 5, RowIndex: 0, RowSpan: 5}
                      - {ElementId: ov-kpi-nouse, ElementType: VISUAL, ColumnIndex: 21, ColumnSpan: 5, RowIndex: 0, RowSpan: 5}
                      - {ElementId: ov-kpi-gb, ElementType: VISUAL, ColumnIndex: 26, ColumnSpan: 5, RowIndex: 0, RowSpan: 5}
                      - {ElementId: ov-kpi-cost, ElementType: VISUAL, ColumnIndex: 31, ColumnSpan: 5, RowIndex: 0, RowSpan: 5}
                      - {ElementId: ov-bar-status, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 18, RowIndex: 5, RowSpan: 10}
                      - {ElementId: ov-bar-confidence, ElementType: VISUAL, ColumnIndex: 18, ColumnSpan: 18, RowIndex: 5, RowSpan: 10}
                      - {ElementId: ov-tbl-failed, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 36, RowIndex: 15, RowSpan: 10}
                      - {ElementId: ov-txt-howto, ElementType: TEXT_BOX, ColumnIndex: 0, ColumnSpan: 36, RowIndex: 25, RowSpan: 4}
          - SheetId: sh-health
            Name: 'Refresh health'

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Amazon Quick dataset lifecycle monitor - native Amazon Quick dashboard for
  administrators. Glue tables over the fast (refresh health) and slow (usage,
  lineage, capacity) snapshots the module writes to S3, current-state datasets
  (latest run per dataset) plus a refresh history dataset, and a five-tab
  dashboard: Overview, Refresh health, Usage, Capacity and cost, History.
  Requires the governance analytics foundation stack in the same Region.

# Prerequisites: governance-analytics-foundation in this Region; the Dataset
# Lifecycle module writing snapshots (snapshots/fast|slow/dt=.../run-*.jsonl);
# console authorization of DataBucketName for Quick's service role.

Parameters:
  ResourcePrefix:
    Type: String
    Default: 'quick-governance-dataset-lifecycle'
    AllowedPattern: '^[a-z0-9-]{1,40}$'
    Description: Prefix for the Quick dataset and dashboard IDs.
  FoundationStackName:
    Type: String
    Default: 'quick-governance-analytics-foundation'
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]{0,127}$'
    Description: Stack name of the governance analytics foundation (exports are imported).
  DataBucketName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    Description: >
      Bucket holding the module snapshots. Empty (default) reads the shared
      analytics bucket created by the foundation stack; set it to read a
      module-owned bucket (<prefix>-<account-id>) together with FastPrefix=snapshots/fast/ and SlowPrefix=snapshots/slow/.
  FastPrefix:
    Type: String
    Default: 'dataset-lifecycle/fast/'
    AllowedPattern: '^([A-Za-z0-9_=./-]+/)?$'
    Description: Prefix of the fast-loop (refresh health) snapshots.
  SlowPrefix:
    Type: String
    Default: 'dataset-lifecycle/slow/'
    AllowedPattern: '^([A-Za-z0-9_=./-]+/)?$'
    Description: Prefix of the slow-loop (usage, lineage, capacity) snapshots.
  QuickPrincipalArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:quicksight:[a-z0-9-]+:[0-9]{12}:(user|group)/.+$'
    Description: Quick user or group ARN (identity Region) that owns the datasets and dashboard.

Conditions:
  UseSharedBucket: !Equals [!Ref DataBucketName, '']

Resources:

  FastTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseName:
        Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
      TableInput:
        Name: dataset_lifecycle_fast
        Description: Dataset Lifecycle Monitor - refresh health, one record per dataset per hourly run.
        TableType: EXTERNAL_TABLE
        Parameters: {classification: json, EXTERNAL: 'TRUE'}
        StorageDescriptor:
          Location: !If
            - UseSharedBucket
            - !Sub
              - 's3://${Bucket}/${FastPrefix}'
              - Bucket:
                  Fn::ImportValue: !Sub '${FoundationStackName}-AnalyticsBucket'
            - !Sub 's3://${DataBucketName}/${FastPrefix}'
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters: {ignore.malformed.json: 'true', case.insensitive: 'true'}
          Columns:
            - {Name: ts, Type: string}
            - {Name: loop, Type: string}
            - {Name: datasetid, Type: string}
            - {Name: datasetname, Type: string}
            - {Name: importmode, Type: string}
            - {Name: assetstate, Type: string}
            - {Name: laststatus, Type: string}
            - {Name: lastrequesttype, Type: string}
            - {Name: lastrequestsource, Type: string}
            - {Name: lastattemptat, Type: string}
            - {Name: lastsuccessat, Type: string}
            - {Name: lastfailedat, Type: string}
            - {Name: errortype, Type: string}
            - {Name: errormessage, Type: string}
            - {Name: lastdurationsec, Type: double}
            - {Name: avgdurationsec, Type: double}
            - {Name: avgfullrefreshsec, Type: double}
            - {Name: avgincrementalsec, Type: double}
            - {Name: rowsingested, Type: bigint}
            - {Name: rowsdropped, Type: bigint}
            - {Name: windowruns, Type: int}
            - {Name: windowfailed, Type: int}
            - {Name: findingscsv, Type: string}

  SlowTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseName:
        Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
      TableInput:
        Name: dataset_lifecycle_slow
        Description: Dataset Lifecycle Monitor - usage evidence, lineage and SPICE capacity, one record per dataset per daily run.
        TableType: EXTERNAL_TABLE
        Parameters: {classification: json, EXTERNAL: 'TRUE'}
        StorageDescriptor:
          Location: !If
            - UseSharedBucket
            - !Sub
              - 's3://${Bucket}/${SlowPrefix}'
              - Bucket:
                  Fn::ImportValue: !Sub '${FoundationStackName}-AnalyticsBucket'
            - !Sub 's3://${DataBucketName}/${SlowPrefix}'
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters: {ignore.malformed.json: 'true', case.insensitive: 'true'}
          Columns:
            - {Name: ts, Type: string}
            - {Name: loop, Type: string}
            - {Name: datasetid, Type: string}
            - {Name: datasetname, Type: string}
            - {Name: importmode, Type: string}
            - {Name: assetstate, Type: string}
            - {Name: dependentdashboardcount, Type: int}
            - {Name: dependenttopiccount, Type: int}
            - {Name: dependentspacecount, Type: int}
            - {Name: dependentagentcount, Type: int}
            - {Name: lastobserveduseat, Type: string}
            - {Name: dayssinceobserveduse, Type: int}
            - {Name: usageconfidence, Type: string}
            - {Name: usagesource, Type: string}
            - {Name: viewlookbackdays, Type: int}
            - {Name: querylookbackdays, Type: int}
            - {Name: agentlookbackdays, Type: int}
            - {Name: spicegb, Type: double}
            - {Name: estmonthlycostusd, Type: double}
            - {Name: costtype, Type: string}
            - {Name: findingscsv, Type: string}

  # Refresh health: latest fast-loop record per dataset.
  HealthDataSet:
    Type: AWS::QuickSight::DataSet
    DependsOn: FastTable
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DataSetId: !Sub '${ResourcePrefix}-health'
      Name: Quick governance - dataset refresh health (current)
      ImportMode: DIRECT_QUERY
      PhysicalTableMap:
        health:
          CustomSql:
            DataSourceArn:
              Fn::ImportValue: !Sub '${FoundationStackName}-QuickDataSourceArn'
            Name: refresh_health
            SqlQuery: !Sub
              - |
                WITH ranked AS (
                  SELECT f.*, row_number() OVER (PARTITION BY datasetid ORDER BY ts DESC) AS rn
                  FROM "${Db}"."dataset_lifecycle_fast" f WHERE ts IS NOT NULL
                )
                SELECT
                  from_iso8601_timestamp(ts) AS scan_time,
                  datasetid AS dataset_id,
                  COALESCE(datasetname, datasetid) AS dataset_name,
                  COALESCE(importmode, 'UNKNOWN') AS import_mode,
                  COALESCE(assetstate, 'ACTIVE') AS asset_state,
                  COALESCE(laststatus, 'UNKNOWN') AS last_status,
                  lastrequesttype AS last_request_type,
                  lastrequestsource AS last_request_source,
                  TRY(from_iso8601_timestamp(lastattemptat)) AS last_attempt_at,
                  TRY(from_iso8601_timestamp(lastsuccessat)) AS last_success_at,
                  TRY(from_iso8601_timestamp(lastfailedat)) AS last_failed_at,
                  errortype AS error_type,
                  errormessage AS error_message,
                  lastdurationsec AS last_duration_sec,
                  avgdurationsec AS avg_duration_sec,
                  avgfullrefreshsec AS avg_full_refresh_sec,
                  avgincrementalsec AS avg_incremental_sec,
                  CASE WHEN avgdurationsec > 0 THEN lastdurationsec / avgdurationsec END AS duration_ratio,
                  rowsingested AS rows_ingested,
                  rowsdropped AS rows_dropped,
                  windowruns AS window_runs,
                  windowfailed AS window_failed,
                  COALESCE(findingscsv, '') AS findings,
                  CASE WHEN laststatus = 'FAILED' THEN 1 ELSE 0 END AS failed_count,
                  CASE WHEN importmode = 'SPICE' THEN 1 ELSE 0 END AS spice_count,
                  CASE WHEN importmode <> 'SPICE' THEN 1 ELSE 0 END AS direct_query_count,
                  1 AS dataset_count
                FROM ranked WHERE rn = 1 AND COALESCE(assetstate, 'ACTIVE') <> 'DELETED'
              - Db:
                  Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
            Columns:
              - {Name: scan_time, Type: DATETIME}
              - {Name: dataset_id, Type: STRING}
              - {Name: dataset_name, Type: STRING}
              - {Name: import_mode, Type: STRING}
              - {Name: asset_state, Type: STRING}
              - {Name: last_status, Type: STRING}
              - {Name: last_request_type, Type: STRING}
              - {Name: last_request_source, Type: STRING}
              - {Name: last_attempt_at, Type: DATETIME}
              - {Name: last_success_at, Type: DATETIME}
              - {Name: last_failed_at, Type: DATETIME}
              - {Name: error_type, Type: STRING}
              - {Name: error_message, Type: STRING}
              - {Name: last_duration_sec, Type: DECIMAL}
              - {Name: avg_duration_sec, Type: DECIMAL}
              - {Name: avg_full_refresh_sec, Type: DECIMAL}
              - {Name: avg_incremental_sec, Type: DECIMAL}
              - {Name: duration_ratio, Type: DECIMAL}
              - {Name: rows_ingested, Type: INTEGER}
              - {Name: rows_dropped, Type: INTEGER}
              - {Name: window_runs, Type: INTEGER}
              - {Name: window_failed, Type: INTEGER}
              - {Name: findings, Type: STRING}
              - {Name: failed_count, Type: INTEGER}
              - {Name: spice_count, Type: INTEGER}
              - {Name: direct_query_count, Type: INTEGER}
              - {Name: dataset_count, Type: INTEGER}
      LogicalTableMap:
        health:
          Alias: refresh_health
          Source: {PhysicalTableId: health}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDataSet, quicksight:DescribeDataSetPermissions, quicksight:PassDataSet, quicksight:DescribeIngestion, quicksight:ListIngestions, quicksight:UpdateDataSet, quicksight:DeleteDataSet, quicksight:CreateIngestion, quicksight:CancelIngestion, quicksight:UpdateDataSetPermissions]
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}
        - {Key: ManagedBy, Value: CloudFormation}

  # Usage, lineage and capacity: latest slow-loop record per dataset.
  UsageDataSet:
    Type: AWS::QuickSight::DataSet
    DependsOn: SlowTable
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DataSetId: !Sub '${ResourcePrefix}-usage'
      Name: Quick governance - dataset usage and capacity (current)
      ImportMode: DIRECT_QUERY
      PhysicalTableMap:
        usage:
          CustomSql:
            DataSourceArn:
              Fn::ImportValue: !Sub '${FoundationStackName}-QuickDataSourceArn'
            Name: dataset_usage
            SqlQuery: !Sub
              - |
                WITH ranked AS (
                  SELECT s.*, row_number() OVER (PARTITION BY datasetid ORDER BY ts DESC) AS rn
                  FROM "${Db}"."dataset_lifecycle_slow" s WHERE ts IS NOT NULL
                )
                SELECT
                  from_iso8601_timestamp(ts) AS scan_time,
                  datasetid AS dataset_id,
                  COALESCE(datasetname, datasetid) AS dataset_name,
                  COALESCE(importmode, 'UNKNOWN') AS import_mode,
                  dependentdashboardcount AS dashboards,
                  dependenttopiccount AS topics,
                  dependentspacecount AS spaces,
                  dependentagentcount AS agents,
                  dependentdashboardcount + dependenttopiccount + dependentspacecount AS references_total,
                  CASE WHEN dependentdashboardcount + dependenttopiccount + dependentspacecount > 0 THEN 'Referenced' ELSE 'Unreferenced' END AS reference_state,
                  TRY(from_iso8601_timestamp(lastobserveduseat)) AS last_observed_use_at,
                  dayssinceobserveduse AS days_since_observed_use,
                  COALESCE(usageconfidence, 'NO_EVIDENCE') AS usage_confidence,
                  COALESCE(usagesource, '(none)') AS usage_source,
                  spicegb AS spice_gb,
                  estmonthlycostusd AS est_monthly_cost_usd,
                  COALESCE(costtype, '(n/a)') AS cost_type,
                  COALESCE(findingscsv, '') AS findings,
                  CASE WHEN findingscsv LIKE '%SPICE_DATASET_NOT_REFERENCED%' THEN 1 ELSE 0 END AS unreferenced_count,
                  CASE WHEN findingscsv LIKE '%NO_OBSERVED_USE%' THEN 1 ELSE 0 END AS no_observed_use_count,
                  CASE WHEN importmode = 'SPICE' THEN 1 ELSE 0 END AS spice_count,
                  1 AS dataset_count
                FROM ranked WHERE rn = 1 AND COALESCE(assetstate, 'ACTIVE') <> 'DELETED'
              - Db:
                  Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
            Columns:
              - {Name: scan_time, Type: DATETIME}
              - {Name: dataset_id, Type: STRING}
              - {Name: dataset_name, Type: STRING}
              - {Name: import_mode, Type: STRING}
              - {Name: dashboards, Type: INTEGER}
              - {Name: topics, Type: INTEGER}
              - {Name: spaces, Type: INTEGER}
              - {Name: agents, Type: INTEGER}
              - {Name: references_total, Type: INTEGER}
              - {Name: reference_state, Type: STRING}
              - {Name: last_observed_use_at, Type: DATETIME}
              - {Name: days_since_observed_use, Type: INTEGER}
              - {Name: usage_confidence, Type: STRING}
              - {Name: usage_source, Type: STRING}
              - {Name: spice_gb, Type: DECIMAL}
              - {Name: est_monthly_cost_usd, Type: DECIMAL}
              - {Name: cost_type, Type: STRING}
              - {Name: findings, Type: STRING}
              - {Name: unreferenced_count, Type: INTEGER}
              - {Name: no_observed_use_count, Type: INTEGER}
              - {Name: spice_count, Type: INTEGER}
              - {Name: dataset_count, Type: INTEGER}
      LogicalTableMap:
        usage:
          Alias: dataset_usage
          Source: {PhysicalTableId: usage}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDataSet, quicksight:DescribeDataSetPermissions, quicksight:PassDataSet, quicksight:DescribeIngestion, quicksight:ListIngestions, quicksight:UpdateDataSet, quicksight:DeleteDataSet, quicksight:CreateIngestion, quicksight:CancelIngestion, quicksight:UpdateDataSetPermissions]
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}
        - {Key: ManagedBy, Value: CloudFormation}

  # Refresh history: every fast-loop record (hourly), for trends and the failure feed.
  HistoryDataSet:
    Type: AWS::QuickSight::DataSet
    DependsOn: FastTable
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DataSetId: !Sub '${ResourcePrefix}-history'
      Name: Quick governance - dataset refresh history
      ImportMode: DIRECT_QUERY
      PhysicalTableMap:
        history:
          CustomSql:
            DataSourceArn:
              Fn::ImportValue: !Sub '${FoundationStackName}-QuickDataSourceArn'
            Name: refresh_history
            SqlQuery: !Sub
              - |
                SELECT
                  from_iso8601_timestamp(ts) AS scan_time,
                  datasetid AS dataset_id,
                  COALESCE(datasetname, datasetid) AS dataset_name,
                  COALESCE(importmode, 'UNKNOWN') AS import_mode,
                  COALESCE(laststatus, 'UNKNOWN') AS last_status,
                  lastrequesttype AS last_request_type,
                  errortype AS error_type,
                  errormessage AS error_message,
                  TRY(from_iso8601_timestamp(lastfailedat)) AS last_failed_at,
                  lastdurationsec AS last_duration_sec,
                  rowsingested AS rows_ingested,
                  CASE WHEN laststatus = 'FAILED' THEN 1 ELSE 0 END AS failed_count,
                  1 AS record_count
                FROM "${Db}"."dataset_lifecycle_fast"
                WHERE ts IS NOT NULL AND COALESCE(assetstate, 'ACTIVE') <> 'DELETED'
              - Db:
                  Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
            Columns:
              - {Name: scan_time, Type: DATETIME}
              - {Name: dataset_id, Type: STRING}
              - {Name: dataset_name, Type: STRING}
              - {Name: import_mode, Type: STRING}
              - {Name: last_status, Type: STRING}
              - {Name: last_request_type, Type: STRING}
              - {Name: error_type, Type: STRING}
              - {Name: error_message, Type: STRING}
              - {Name: last_failed_at, Type: DATETIME}
              - {Name: last_duration_sec, Type: DECIMAL}
              - {Name: rows_ingested, Type: INTEGER}
              - {Name: failed_count, Type: INTEGER}
              - {Name: record_count, Type: INTEGER}
      LogicalTableMap:
        history:
          Alias: refresh_history
          Source: {PhysicalTableId: history}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDataSet, quicksight:DescribeDataSetPermissions, quicksight:PassDataSet, quicksight:DescribeIngestion, quicksight:ListIngestions, quicksight:UpdateDataSet, quicksight:DeleteDataSet, quicksight:CreateIngestion, quicksight:CancelIngestion, quicksight:UpdateDataSetPermissions]
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}
        - {Key: ManagedBy, Value: CloudFormation}

  Dashboard:
    Type: AWS::QuickSight::Dashboard
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DashboardId: !Sub '${ResourcePrefix}-dashboard'
      Name: Amazon Quick - dataset lifecycle
      VersionDescription: Administrator dashboard - Overview, Refresh health, Usage, Capacity and cost, History.
      DashboardPublishOptions:
        AdHocFilteringOption: {AvailabilityStatus: ENABLED}
        ExportToCSVOption: {AvailabilityStatus: ENABLED}
        SheetControlsOption: {VisibilityState: EXPANDED}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDashboard, quicksight:ListDashboardVersions, quicksight:UpdateDashboardPermissions, quicksight:QueryDashboard, quicksight:UpdateDashboard, quicksight:DeleteDashboard, quicksight:DescribeDashboardPermissions, quicksight:UpdateDashboardPublishedVersion]
      Definition: # GENERATED
        DataSetIdentifierDeclarations:
          - Identifier: health
            DataSetArn: !GetAtt HealthDataSet.Arn
          - Identifier: usage
            DataSetArn: !GetAtt UsageDataSet.Arn
          - Identifier: hist
            DataSetArn: !GetAtt HistoryDataSet.Arn
        ParameterDeclarations:
          - DateTimeParameterDeclaration:
              Name: pStart
              TimeGranularity: DAY
              DefaultValues:
                RollingDate: {Expression: "addDateTime(-1, 'MM', truncDate('MM', now()))"}
          - DateTimeParameterDeclaration:
              Name: pEnd
              TimeGranularity: DAY
              DefaultValues:
                RollingDate: {Expression: "addDateTime(1, 'DD', truncDate('DD', now()))"}
        FilterGroups:
          - FilterGroupId: fg-range
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - TimeRangeFilter:
                  FilterId: f-range
                  Column: {DataSetIdentifier: hist, ColumnName: scan_time}
                  IncludeMinimum: true
                  IncludeMaximum: false
                  RangeMinimumValue: {Parameter: pStart}
                  RangeMaximumValue: {Parameter: pEnd}
                  NullOption: NON_NULLS_ONLY
                  TimeGranularity: DAY
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-history
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-mode-ov
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-mode-ov
                  Column: {DataSetIdentifier: health, ColumnName: import_mode}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-overview
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-dataset-ov
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-dataset-ov
                  Column: {DataSetIdentifier: health, ColumnName: dataset_name}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-overview
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-mode-rh
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-mode-rh
                  Column: {DataSetIdentifier: health, ColumnName: import_mode}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-health
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-dataset-rh
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-dataset-rh
                  Column: {DataSetIdentifier: health, ColumnName: dataset_name}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-health
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-mode-us
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-mode-us
                  Column: {DataSetIdentifier: health, ColumnName: import_mode}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-usage
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-dataset-us
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-dataset-us
                  Column: {DataSetIdentifier: health, ColumnName: dataset_name}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-usage
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-mode-cp
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-mode-cp
                  Column: {DataSetIdentifier: health, ColumnName: import_mode}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-capacity
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-dataset-cp
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-dataset-cp
                  Column: {DataSetIdentifier: health, ColumnName: dataset_name}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-capacity
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-mode-hs
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-mode-hs
                  Column: {DataSetIdentifier: health, ColumnName: import_mode}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-history
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-dataset-hs
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-dataset-hs
                  Column: {DataSetIdentifier: health, ColumnName: dataset_name}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-history
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-failed-only-sh-overview
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-failed-only-sh-overview
                  Column: {DataSetIdentifier: health, ColumnName: last_status}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      CategoryValues: ['FAILED']
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-overview
                    Scope: SELECTED_VISUALS
                    VisualIds: [ov-tbl-failed]
          - FilterGroupId: fg-failed-only-sh-health
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-failed-only-sh-health
                  Column: {DataSetIdentifier: health, ColumnName: last_status}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      CategoryValues: ['FAILED']
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-health
                    Scope: SELECTED_VISUALS
                    VisualIds: [rh-tbl-failed]
          - FilterGroupId: fg-spice-only-sh-health
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-spice-only-sh-health

                      - {ElementId: db-kpi-unknown, ElementType: VISUAL, ColumnIndex: 27, ColumnSpan: 9, RowIndex: 0, RowSpan: 4}
                      - {ElementId: db-tbl-all, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 36, RowIndex: 4, RowSpan: 11}
                      - {ElementId: db-tbl-delete, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 36, RowIndex: 15, RowSpan: 8}
                      - {ElementId: db-bar-viewed, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 36, RowIndex: 23, RowSpan: 8}
                      - {ElementId: db-txt-note, ElementType: TEXT_BOX, ColumnIndex: 0, ColumnSpan: 36, RowIndex: 31, RowSpan: 4}
          - SheetId: sh-capacity
            Name: 'Capacity and cost'
            Title: 'SPICE capacity and estimated cost'
            Description: 'Consumed SPICE per dataset with an estimated monthly cost signal - an estimate from the configured rate, not an invoice.'
            ParameterControls:
              - DateTimePicker:
                  ParameterControlId: pc-cp-start
                  Title: 'From'
                  SourceParameterName: pStart
                  DisplayOptions: {DateTimeFormat: 'YYYY-MM-DD'}
              - DateTimePicker:
                  ParameterControlId: pc-cp-end
                  Title: 'To (exclusive)'
                  SourceParameterName: pEnd
                  DisplayOptions: {DateTimeFormat: 'YYYY-MM-DD'}
              - Dropdown:
                  ParameterControlId: pc-cp-pIdleDays
                  Title: 'Idle after (days)'

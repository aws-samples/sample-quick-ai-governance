                        - {FieldId: cp-tbl-largest-g2, CustomLabel: 'Cost type'}
                        - {FieldId: cp-tbl-largest-g3, CustomLabel: 'Usage confidence'}
                        - {FieldId: cp-tbl-largest-m0, CustomLabel: 'SPICE GB'}
                        - {FieldId: cp-tbl-largest-m1, CustomLabel: 'Est. USD / month'}
                        - {FieldId: cp-tbl-largest-m2, CustomLabel: 'Dashboards'}
                        - {FieldId: cp-tbl-largest-m3, CustomLabel: 'Topics'}
                        - {FieldId: cp-tbl-largest-m4, CustomLabel: 'Days since use'}
              - BarChartVisual:
                  VisualId: cp-bar-cost
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Estimated monthly cost by dataset (USD)'}}
                  ChartConfiguration:
                    FieldWells:
                      BarChartAggregatedFieldWells:
                        Category:
                          - CategoricalDimensionField: {FieldId: cp-bar-cost-cat, Column: {DataSetIdentifier: usage, ColumnName: dataset_name}}
                        Values:
                          - NumericalMeasureField: {FieldId: cp-bar-cost-val, Column: {DataSetIdentifier: usage, ColumnName: est_monthly_cost_usd}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 2}}}}}
                        Colors:
                          - CategoricalDimensionField: {FieldId: cp-bar-cost-color, Column: {DataSetIdentifier: usage, ColumnName: usage_confidence}}
                    SortConfiguration:
                      CategorySort:
                        - FieldSort: {FieldId: cp-bar-cost-val, Direction: DESC}
                      CategoryItemsLimit: {ItemsLimit: 15, OtherCategories: EXCLUDE}
                    Orientation: HORIZONTAL
                    BarsArrangement: STACKED
                    Legend: {Visibility: VISIBLE, Position: BOTTOM}
              - PivotTableVisual:
                  VisualId: cp-pivot
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'SPICE GB by usage confidence and reference state'}}
                  ChartConfiguration:
                    FieldWells:
                      PivotTableAggregatedFieldWells:
                        Rows:
                          - CategoricalDimensionField: {FieldId: cp-pivot-row, Column: {DataSetIdentifier: usage, ColumnName: usage_confidence}}
                        Columns:
                          - CategoricalDimensionField: {FieldId: cp-pivot-col, Column: {DataSetIdentifier: usage, ColumnName: reference_state}}
                        Values:
                          - NumericalMeasureField: {FieldId: cp-pivot-val, Column: {DataSetIdentifier: usage, ColumnName: spice_gb}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 3}}}}}
                    TotalOptions:
                      RowTotalOptions: {TotalsVisibility: VISIBLE}
                      ColumnTotalOptions: {TotalsVisibility: VISIBLE}
            Layouts:
              - Configuration:
                  GridLayout:
                    CanvasSizeOptions:
                      ScreenCanvasSizeOptions: {ResizeOption: FIXED, OptimizedViewPortWidth: '1600px'}
                    Elements:
                      - {ElementId: cp-tbl-largest, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 36, RowIndex: 0, RowSpan: 12}
                      - {ElementId: cp-bar-cost, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 20, RowIndex: 12, RowSpan: 12}
                      - {ElementId: cp-pivot, ElementType: VISUAL, ColumnIndex: 20, ColumnSpan: 16, RowIndex: 12, RowSpan: 12}
          - SheetId: sh-history
            Name: 'History'
            Title: 'History'
            Description: 'Hourly refresh-state records, and whether the idle count moves from one daily scan to the next.'
            ParameterControls:
              - DateTimePicker:
                  ParameterControlId: pc-hs-start
                  Title: 'From'
                  SourceParameterName: pStart
                  DisplayOptions: {DateTimeFormat: 'YYYY-MM-DD'}
              - DateTimePicker:
                  ParameterControlId: pc-hs-end
                  Title: 'To (exclusive)'
                  SourceParameterName: pEnd
                  DisplayOptions: {DateTimeFormat: 'YYYY-MM-DD'}
            FilterControls:
              - Dropdown:
                  FilterControlId: fc-hs-mode
                  Title: 'Import mode'
                  SourceFilterId: f-mode-hs
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
              - Dropdown:
                  FilterControlId: fc-hs-dataset
                  Title: 'Dataset'
                  SourceFilterId: f-dataset-hs
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
            SheetControlLayouts:
              - Configuration:
                  GridLayout:
                    Elements:
                      - {ElementId: pc-hs-start, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: pc-hs-end, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-hs-mode, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-hs-dataset, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
            Visuals:
              - LineChartVisual:
                  VisualId: hs-line-failed
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Datasets in FAILED state per scan'}}
                  ChartConfiguration:
                    FieldWells:
                      LineChartAggregatedFieldWells:
                        Category:
                          - DateDimensionField: {FieldId: hs-line-failed-cat, Column: {DataSetIdentifier: hist, ColumnName: scan_time}, DateGranularity: HOUR}
                        Values:
                          - NumericalMeasureField: {FieldId: hs-line-failed-val, Column: {DataSetIdentifier: hist, ColumnName: failed_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                        Colors:
                          - CategoricalDimensionField: {FieldId: hs-line-failed-color, Column: {DataSetIdentifier: hist, ColumnName: import_mode}}
                    Type: LINE
                    Legend: {Visibility: VISIBLE, Position: BOTTOM}
              - BarChartVisual:
                  VisualId: hs-bar-status
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Records per day by status'}}

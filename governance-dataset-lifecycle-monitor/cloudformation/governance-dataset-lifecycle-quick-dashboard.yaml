                          - CategoricalDimensionField: {FieldId: ov-tbl-failed-g0, Column: {DataSetIdentifier: health, ColumnName: dataset_name}}
                          - CategoricalDimensionField: {FieldId: ov-tbl-failed-g1, Column: {DataSetIdentifier: health, ColumnName: error_type}}
                          - CategoricalDimensionField: {FieldId: ov-tbl-failed-g2, Column: {DataSetIdentifier: health, ColumnName: error_message}}

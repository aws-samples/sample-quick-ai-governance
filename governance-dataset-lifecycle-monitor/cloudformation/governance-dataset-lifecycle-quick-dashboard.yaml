                      - {ElementId: db-kpi-all, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 9, RowIndex: 0, RowSpan: 4}
                      - {ElementId: db-kpi-viewed, ElementType: VISUAL, ColumnIndex: 9, ColumnSpan: 9, RowIndex: 0, RowSpan: 4}

                  ChartConfiguration:
                    FieldWells:
                      BarChartAggregatedFieldWells:
                        Category:
                          - CategoricalDimensionField: {FieldId: db-bar-viewed-cat, Column: {DataSetIdentifier: dashes, ColumnName: dashboard_name}}
                        Values:
                          - NumericalMeasureField: {FieldId: db-bar-viewed-val, Column: {DataSetIdentifier: dashes, ColumnName: views_90}, AggregationFunction: {SimpleNumericalAggregation: MAX}}
                    SortConfiguration:
                      CategorySort:
                        - FieldSort: {FieldId: db-bar-viewed-val, Direction: DESC}
                      CategoryItemsLimit: {ItemsLimit: 20, OtherCategories: EXCLUDE}
                    Orientation: HORIZONTAL
                    BarsArrangement: STACKED
            TextBoxes:
              - SheetTextBoxId: db-txt-note
                Content: '<text-box><block align="left"><inline font-weight="bold">What a view is.</inline> Views come from DashboardViewCount (web, mobile and embedded). E-mail report deliveries may not count. CloudTrail adds who opened a dashboard. Every dashboard is listed, the governance dashboards included: nobody opening them is a finding too. A dashboard with no metric history for the same 90 days a year earlier is not a deletion candidate, because that absence is missing history rather than a quiet year.</block></text-box>'
            Layouts:
              - Configuration:
                  GridLayout:
                    CanvasSizeOptions:
                      ScreenCanvasSizeOptions: {ResizeOption: FIXED, OptimizedViewPortWidth: '1600px'}

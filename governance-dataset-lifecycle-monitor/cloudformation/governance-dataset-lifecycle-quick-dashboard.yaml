                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-cost-v, Column: {DataSetIdentifier: usage, ColumnName: est_monthly_cost_usd}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 2}}}}}
              - BarChartVisual:
                  VisualId: ov-bar-status
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Datasets by last refresh status and import mode'}}
                  ChartConfiguration:
                    FieldWells:
                      BarChartAggregatedFieldWells:
                        Category:
                          - CategoricalDimensionField: {FieldId: ov-bar-status-cat, Column: {DataSetIdentifier: health, ColumnName: last_status}}
                        Values:
                          - NumericalMeasureField: {FieldId: ov-bar-status-val, Column: {DataSetIdentifier: health, ColumnName: dataset_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                        Colors:
                          - CategoricalDimensionField: {FieldId: ov-bar-status-color, Column: {DataSetIdentifier: health, ColumnName: import_mode}}
                    SortConfiguration:
                      CategorySort:
                        - FieldSort: {FieldId: ov-bar-status-val, Direction: DESC}
                    Orientation: HORIZONTAL
                    BarsArrangement: STACKED
                    Legend: {Visibility: VISIBLE, Position: BOTTOM}
              - BarChartVisual:
                  VisualId: ov-bar-confidence
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Datasets by usage confidence'}}
                  Subtitle: {Visibility: VISIBLE, FormatText: {PlainText: 'HIGH: agent citation or direct query; MEDIUM: dashboard view or scope-level agent evidence; LOW: referenced only; NO_EVIDENCE: nothing observed'}}
                  ChartConfiguration:
                    FieldWells:
                      BarChartAggregatedFieldWells:
                        Category:
                          - CategoricalDimensionField: {FieldId: ov-bar-confidence-cat, Column: {DataSetIdentifier: usage, ColumnName: usage_confidence}}
                        Values:
                          - NumericalMeasureField: {FieldId: ov-bar-confidence-val, Column: {DataSetIdentifier: usage, ColumnName: dataset_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                        Colors:
                          - CategoricalDimensionField: {FieldId: ov-bar-confidence-color, Column: {DataSetIdentifier: usage, ColumnName: import_mode}}
                    SortConfiguration:
                      CategorySort:
                        - FieldSort: {FieldId: ov-bar-confidence-val, Direction: DESC}

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS Quick dataset lifecycle monitor - native AWS Quick dashboard for
  administrators. Glue tables over the fast (refresh health), slow (usage,
  lineage, capacity), dashboard and schedule snapshots the module writes to S3,
  current-state datasets plus refresh and idle history, and a seven-tab
  dashboard: Overview, Refresh health, Refresh plan, Usage, Dashboards,
  Capacity and cost, History.
  Requires the governance analytics foundation stack in the same Region.

# Prerequisites: governance-analytics-foundation in this Region; the Dataset
# Lifecycle module writing snapshots (snapshots/fast|slow/dt=.../run-*.jsonl);
# console authorization of DataBucketName for Quick's service role.

Parameters:
  ResourcePrefix:
    Type: String
    Default: 'quick-governance-dataset-lifecycle'
    AllowedPattern: '^[a-z0-9-]{1,40}$'
    Description: Prefix for the Quick dataset and dashboard IDs.
  FoundationStackName:
    Type: String
    Default: 'quick-governance-analytics-foundation'
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]{0,127}$'
    Description: Stack name of the governance analytics foundation (exports are imported).
  DataBucketName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    Description: >
      Bucket holding the module snapshots. Empty (default) reads the shared
      analytics bucket created by the foundation stack; set it to read a
      module-owned bucket (<prefix>-<account-id>) together with FastPrefix=snapshots/fast/ and SlowPrefix=snapshots/slow/.
  FastPrefix:
    Type: String
    Default: 'dataset-lifecycle/fast/'
    AllowedPattern: '^([A-Za-z0-9_=./-]+/)?$'
    Description: Prefix of the fast-loop (refresh health) snapshots.
  SlowPrefix:
    Type: String
    Default: 'dataset-lifecycle/slow/'
    AllowedPattern: '^([A-Za-z0-9_=./-]+/)?$'
    Description: Prefix of the slow-loop (usage, lineage, capacity) snapshots.
  DashboardsPrefix:
    Type: String
    Default: 'dataset-lifecycle/dashboards/'
    AllowedPattern: '^([A-Za-z0-9_=./-]+/)?$'
    Description: Prefix of the per-dashboard slow-loop snapshots.
  SchedulesPrefix:
    Type: String
    Default: 'dataset-lifecycle/schedules/'
    AllowedPattern: '^([A-Za-z0-9_=./-]+/)?$'
    Description: Prefix of the refresh-schedule slow-loop snapshots.
  QuickPrincipalArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:quicksight:[a-z0-9-]+:[0-9]{12}:(user|group)/.+$'
    Description: Quick user or group ARN (identity Region) that owns the datasets and dashboard.

Conditions:
  UseSharedBucket: !Equals [!Ref DataBucketName, '']

Resources:

  FastTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseName:
        Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
      TableInput:
        Name: dataset_lifecycle_fast
        Description: Dataset Lifecycle Monitor - refresh health, one record per dataset per hourly run.
        TableType: EXTERNAL_TABLE
        Parameters: {classification: json, EXTERNAL: 'TRUE'}
        StorageDescriptor:
          Location: !If
            - UseSharedBucket
            - !Sub
              - 's3://${Bucket}/${FastPrefix}'
              - Bucket:
                  Fn::ImportValue: !Sub '${FoundationStackName}-AnalyticsBucket'
            - !Sub 's3://${DataBucketName}/${FastPrefix}'
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters: {ignore.malformed.json: 'true', case.insensitive: 'true'}
          Columns:
            - {Name: ts, Type: string}
            - {Name: loop, Type: string}
            - {Name: datasetid, Type: string}
            - {Name: datasetname, Type: string}
            - {Name: importmode, Type: string}
            - {Name: assetstate, Type: string}
            - {Name: laststatus, Type: string}
            - {Name: lastrequesttype, Type: string}
            - {Name: lastrequestsource, Type: string}
            - {Name: lastattemptat, Type: string}
            - {Name: lastsuccessat, Type: string}
            - {Name: lastfailedat, Type: string}
            - {Name: errortype, Type: string}
            - {Name: errormessage, Type: string}
            - {Name: lastdurationsec, Type: double}
            - {Name: avgdurationsec, Type: double}
            - {Name: avgfullrefreshsec, Type: double}
            - {Name: avgincrementalsec, Type: double}
            - {Name: rowsingested, Type: bigint}
            - {Name: rowsdropped, Type: bigint}
            - {Name: windowruns, Type: int}
            - {Name: windowfailed, Type: int}
            - {Name: findingscsv, Type: string}

  SlowTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseName:
        Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
      TableInput:
        Name: dataset_lifecycle_slow
        Description: Dataset Lifecycle Monitor - usage evidence, lineage and SPICE capacity, one record per dataset per daily run.
        TableType: EXTERNAL_TABLE
        Parameters: {classification: json, EXTERNAL: 'TRUE'}
        StorageDescriptor:
          Location: !If
            - UseSharedBucket
            - !Sub
              - 's3://${Bucket}/${SlowPrefix}'
              - Bucket:
                  Fn::ImportValue: !Sub '${FoundationStackName}-AnalyticsBucket'
            - !Sub 's3://${DataBucketName}/${SlowPrefix}'
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters: {ignore.malformed.json: 'true', case.insensitive: 'true'}
          Columns:
            - {Name: ts, Type: string}
            - {Name: loop, Type: string}
            - {Name: datasetid, Type: string}
            - {Name: datasetname, Type: string}
            - {Name: importmode, Type: string}
            - {Name: assetstate, Type: string}
            - {Name: dependentdashboardcount, Type: int}
            - {Name: dependenttopiccount, Type: int}
            - {Name: dependentspacecount, Type: int}
            - {Name: dependentagentcount, Type: int}
            - {Name: lastobserveduseat, Type: string}
            - {Name: dayssinceobserveduse, Type: int}
            - {Name: usageconfidence, Type: string}
            - {Name: usagesource, Type: string}
            - {Name: viewlookbackdays, Type: int}
            - {Name: querylookbackdays, Type: int}
            - {Name: agentlookbackdays, Type: int}
            - {Name: spicegb, Type: double}
            - {Name: estmonthlycostusd, Type: double}
            - {Name: costtype, Type: string}
            - {Name: findingscsv, Type: string}
            - {Name: coveragestart, Type: string}
            - {Name: coveragedays, Type: int}
            - {Name: datasetcreatedat, Type: string}
            - {Name: usagestate, Type: string}
            - {Name: unknownreason, Type: string}
            - {Name: recheckafter, Type: string}
            - {Name: usagesourcelabel, Type: string}
            - {Name: schedulecount, Type: int}
            - {Name: nextrunat, Type: string}
            - {Name: runsplanned24h, Type: int}
            - {Name: runsplanned7d, Type: int}
            - {Name: refreshcount30d, Type: int}
            - {Name: lastrefreshat, Type: string}
            - {Name: lastrefreshsource, Type: string}
            - {Name: lastrefreshstatus, Type: string}
            - {Name: avgdurationsec, Type: int}
            - {Name: datasource, Type: string}
            - {Name: ownerstatus, Type: string}

  DashboardsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseName:
        Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
      TableInput:
        Name: dataset_lifecycle_dashboards
        Description: Dataset Lifecycle Monitor - one record per dashboard per daily scan, plus tombstones.
        TableType: EXTERNAL_TABLE
        Parameters: {classification: json, EXTERNAL: 'TRUE'}
        StorageDescriptor:
          Location: !If
            - UseSharedBucket
            - !Sub
              - 's3://${Bucket}/${DashboardsPrefix}'
              - Bucket:
                  Fn::ImportValue: !Sub '${FoundationStackName}-AnalyticsBucket'
            - !Sub 's3://${DataBucketName}/${DashboardsPrefix}'
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters: {ignore.malformed.json: 'true', case.insensitive: 'true'}
          Columns:
            - {Name: ts, Type: string}
            - {Name: dashboardid, Type: string}
            - {Name: dashboardname, Type: string}
            - {Name: assetstate, Type: string}
            - {Name: createdat, Type: string}
            - {Name: lastpublishedat, Type: string}
            - {Name: metriclastviewat, Type: string}
            - {Name: cloudtraillastviewat, Type: string}
            - {Name: lastviewat, Type: string}
            - {Name: lastviewsource, Type: string}
            - {Name: lastviewlabel, Type: string}
            - {Name: dayssincelastview, Type: int}
            - {Name: sortdays, Type: int}
            - {Name: views30, Type: int}
            - {Name: views60, Type: int}
            - {Name: views90, Type: int}
            - {Name: viewsyearago90, Type: int}
            - {Name: metrichistorystart, Type: string}
            - {Name: historycoversyearago, Type: string}
            - {Name: datasetids, Type: string}
            - {Name: datasetnames, Type: string}
            - {Name: coveragestart, Type: string}
            - {Name: coveragedays, Type: int}
            - {Name: usagestate, Type: string}
            - {Name: unknownreason, Type: string}
            - {Name: recheckafter, Type: string}
            - {Name: ownerstatus, Type: string}
            - {Name: deletioncandidate, Type: string}

  SchedulesTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseName:
        Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
      TableInput:
        Name: dataset_lifecycle_schedules
        Description: Dataset Lifecycle Monitor - one row per refresh schedule and one row per planned run.
        TableType: EXTERNAL_TABLE
        Parameters: {classification: json, EXTERNAL: 'TRUE'}
        StorageDescriptor:
          Location: !If
            - UseSharedBucket
            - !Sub
              - 's3://${Bucket}/${SchedulesPrefix}'
              - Bucket:
                  Fn::ImportValue: !Sub '${FoundationStackName}-AnalyticsBucket'
            - !Sub 's3://${DataBucketName}/${SchedulesPrefix}'
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters: {ignore.malformed.json: 'true', case.insensitive: 'true'}
          Columns:
            - {Name: ts, Type: string}
            - {Name: recordkind, Type: string}
            - {Name: datasetid, Type: string}
            - {Name: datasetname, Type: string}
            - {Name: scheduleid, Type: string}
            - {Name: refreshtype, Type: string}
            - {Name: interval, Type: string}
            - {Name: timezone, Type: string}
            - {Name: definition, Type: string}
            - {Name: nextrunat, Type: string}
            - {Name: nextrunlabel, Type: string}
            - {Name: runsperday, Type: double}
            - {Name: minuteknown, Type: string}
            - {Name: minutesource, Type: string}
            - {Name: startafterat, Type: string}
            - {Name: avgdurationsec, Type: int}
            - {Name: lastrefreshstatus, Type: string}
            - {Name: datasource, Type: string}
            - {Name: runat, Type: string}
            - {Name: hourutc, Type: int}

  # Refresh health: latest fast-loop record per dataset.
  HealthDataSet:
    Type: AWS::QuickSight::DataSet
    DependsOn: FastTable
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DataSetId: !Sub '${ResourcePrefix}-health'
      Name: Quick governance - dataset refresh health (current)
      ImportMode: DIRECT_QUERY
      PhysicalTableMap:
        health:
          CustomSql:
            DataSourceArn:
              Fn::ImportValue: !Sub '${FoundationStackName}-QuickDataSourceArn'
            Name: refresh_health
            SqlQuery: !Sub
              - |
                WITH ranked AS (
                  SELECT f.*, row_number() OVER (PARTITION BY datasetid ORDER BY ts DESC) AS rn
                  FROM "${Db}"."dataset_lifecycle_fast" f WHERE ts IS NOT NULL
                )
                SELECT
                  from_iso8601_timestamp(ts) AS scan_time,
                  datasetid AS dataset_id,
                  COALESCE(datasetname, datasetid) AS dataset_name,
                  COALESCE(importmode, 'UNKNOWN') AS import_mode,
                  COALESCE(assetstate, 'ACTIVE') AS asset_state,
                  COALESCE(laststatus, 'UNKNOWN') AS last_status,
                  lastrequesttype AS last_request_type,
                  lastrequestsource AS last_request_source,
                  TRY(from_iso8601_timestamp(lastattemptat)) AS last_attempt_at,
                  TRY(from_iso8601_timestamp(lastsuccessat)) AS last_success_at,
                  TRY(from_iso8601_timestamp(lastfailedat)) AS last_failed_at,
                  errortype AS error_type,
                  errormessage AS error_message,
                  lastdurationsec AS last_duration_sec,
                  avgdurationsec AS avg_duration_sec,
                  avgfullrefreshsec AS avg_full_refresh_sec,
                  avgincrementalsec AS avg_incremental_sec,
                  CASE WHEN avgdurationsec > 0 THEN lastdurationsec / avgdurationsec END AS duration_ratio,
                  rowsingested AS rows_ingested,
                  rowsdropped AS rows_dropped,
                  windowruns AS window_runs,
                  windowfailed AS window_failed,
                  COALESCE(findingscsv, '') AS findings,
                  CASE WHEN laststatus = 'FAILED' THEN 1 ELSE 0 END AS failed_count,
                  CASE WHEN importmode = 'SPICE' THEN 1 ELSE 0 END AS spice_count,
                  CASE WHEN importmode <> 'SPICE' THEN 1 ELSE 0 END AS direct_query_count,
                  1 AS dataset_count
                FROM ranked WHERE rn = 1 AND COALESCE(assetstate, 'ACTIVE') <> 'DELETED'
              - Db:
                  Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
            Columns:
              - {Name: scan_time, Type: DATETIME}
              - {Name: dataset_id, Type: STRING}
              - {Name: dataset_name, Type: STRING}
              - {Name: import_mode, Type: STRING}
              - {Name: asset_state, Type: STRING}
              - {Name: last_status, Type: STRING}
              - {Name: last_request_type, Type: STRING}
              - {Name: last_request_source, Type: STRING}
              - {Name: last_attempt_at, Type: DATETIME}
              - {Name: last_success_at, Type: DATETIME}
              - {Name: last_failed_at, Type: DATETIME}
              - {Name: error_type, Type: STRING}
              - {Name: error_message, Type: STRING}
              - {Name: last_duration_sec, Type: DECIMAL}
              - {Name: avg_duration_sec, Type: DECIMAL}
              - {Name: avg_full_refresh_sec, Type: DECIMAL}
              - {Name: avg_incremental_sec, Type: DECIMAL}
              - {Name: duration_ratio, Type: DECIMAL}
              - {Name: rows_ingested, Type: INTEGER}
              - {Name: rows_dropped, Type: INTEGER}
              - {Name: window_runs, Type: INTEGER}
              - {Name: window_failed, Type: INTEGER}
              - {Name: findings, Type: STRING}
              - {Name: failed_count, Type: INTEGER}
              - {Name: spice_count, Type: INTEGER}
              - {Name: direct_query_count, Type: INTEGER}
              - {Name: dataset_count, Type: INTEGER}
      LogicalTableMap:
        health:
          Alias: refresh_health
          Source: {PhysicalTableId: health}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDataSet, quicksight:DescribeDataSetPermissions, quicksight:PassDataSet, quicksight:DescribeIngestion, quicksight:ListIngestions, quicksight:UpdateDataSet, quicksight:DeleteDataSet, quicksight:CreateIngestion, quicksight:CancelIngestion, quicksight:UpdateDataSetPermissions]
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}
        - {Key: ManagedBy, Value: CloudFormation}

  # Usage, lineage and capacity: latest slow-loop record per dataset.
  UsageDataSet:
    Type: AWS::QuickSight::DataSet
    DependsOn: SlowTable
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DataSetId: !Sub '${ResourcePrefix}-usage'
      Name: Quick governance - dataset usage and capacity (current)
      ImportMode: DIRECT_QUERY
      PhysicalTableMap:
        usage:
          CustomSql:
            DataSourceArn:
              Fn::ImportValue: !Sub '${FoundationStackName}-QuickDataSourceArn'
            Name: dataset_usage
            SqlQuery: !Sub
              - |
                WITH ranked AS (
                  SELECT s.*, row_number() OVER (PARTITION BY datasetid ORDER BY ts DESC) AS rn
                  FROM "${Db}"."dataset_lifecycle_slow" s WHERE ts IS NOT NULL
                )
                SELECT
                  from_iso8601_timestamp(ts) AS scan_time,
                  'Latest' AS scan_label,
                  datasetid AS dataset_id,
                  COALESCE(datasetname, datasetid) AS dataset_name,
                  COALESCE(importmode, 'UNKNOWN') AS import_mode,
                  dependentdashboardcount AS dashboards,
                  dependenttopiccount AS topics,
                  dependentspacecount AS spaces,
                  dependentagentcount AS agents,
                  dependentdashboardcount + dependenttopiccount + dependentspacecount AS references_total,
                  CASE WHEN dependentdashboardcount + dependenttopiccount + dependentspacecount > 0 THEN 'Referenced' ELSE 'Unreferenced' END AS reference_state,
                  TRY(from_iso8601_timestamp(lastobserveduseat)) AS last_observed_use_at,
                  dayssinceobserveduse AS days_since_observed_use,
                  COALESCE(usageconfidence, 'NO_EVIDENCE') AS usage_confidence,
                  COALESCE(usagesource, '(none)') AS usage_source,
                  COALESCE(usagesourcelabel, usagesource, '(none)') AS usage_source_label,
                  TRY(from_iso8601_timestamp(coveragestart)) AS coverage_start,
                  COALESCE(coveragedays, 0) AS coverage_days,
                  TRY(from_iso8601_timestamp(datasetcreatedat)) AS dataset_created_at,
                  COALESCE(usagestate, 'UNKNOWN') AS stored_state,
                  schedulecount AS schedule_count,
                  TRY(from_iso8601_timestamp(nextrunat)) AS next_run_at,
                  runsplanned24h AS runs_planned_24h,
                  refreshcount30d AS refresh_count_30d,
                  TRY(from_iso8601_timestamp(lastrefreshat)) AS last_refresh_at,
                  COALESCE(lastrefreshsource, '') AS started_by,
                  COALESCE(ownerstatus, 'not available') AS owner_status,
                  COALESCE(datasource, '(none)') AS data_source,
                  spicegb AS spice_gb,
                  estmonthlycostusd AS est_monthly_cost_usd,
                  COALESCE(costtype, '(n/a)') AS cost_type,
                  COALESCE(findingscsv, '') AS findings,
                  CASE WHEN importmode = 'SPICE' AND schedulecount = 0 THEN 1 ELSE 0 END AS no_schedule_count,
                  CASE WHEN importmode = 'SPICE' AND schedulecount > 0 THEN 1 ELSE 0 END AS has_schedule_count,
                  CASE
                    WHEN refreshcount30d IS NULL THEN NULL
                    WHEN importmode = 'SPICE' AND schedulecount = 0 THEN refreshcount30d
                    ELSE 0
                  END AS manual_refreshes_30d,
                  CASE WHEN importmode = 'SPICE' THEN 1 ELSE 0 END AS spice_count,
                  1 AS dataset_count
                FROM ranked WHERE rn = 1 AND COALESCE(assetstate, 'ACTIVE') <> 'DELETED'
              - Db:
                  Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
            Columns:
              - {Name: scan_time, Type: DATETIME}
              - {Name: scan_label, Type: STRING}
              - {Name: dataset_id, Type: STRING}
              - {Name: dataset_name, Type: STRING}
              - {Name: import_mode, Type: STRING}
              - {Name: dashboards, Type: INTEGER}
              - {Name: topics, Type: INTEGER}
              - {Name: spaces, Type: INTEGER}
              - {Name: agents, Type: INTEGER}
              - {Name: references_total, Type: INTEGER}
              - {Name: reference_state, Type: STRING}
              - {Name: last_observed_use_at, Type: DATETIME}
              - {Name: days_since_observed_use, Type: INTEGER}
              - {Name: usage_confidence, Type: STRING}
              - {Name: usage_source, Type: STRING}
              - {Name: usage_source_label, Type: STRING}
              - {Name: coverage_start, Type: DATETIME}
              - {Name: coverage_days, Type: INTEGER}
              - {Name: dataset_created_at, Type: DATETIME}
              - {Name: stored_state, Type: STRING}
              - {Name: schedule_count, Type: INTEGER}
              - {Name: next_run_at, Type: DATETIME}
              - {Name: runs_planned_24h, Type: INTEGER}
              - {Name: refresh_count_30d, Type: INTEGER}
              - {Name: last_refresh_at, Type: DATETIME}
              - {Name: started_by, Type: STRING}
              - {Name: owner_status, Type: STRING}
              - {Name: data_source, Type: STRING}
              - {Name: spice_gb, Type: DECIMAL}
              - {Name: est_monthly_cost_usd, Type: DECIMAL}
              - {Name: cost_type, Type: STRING}
              - {Name: findings, Type: STRING}
              - {Name: no_schedule_count, Type: INTEGER}
              - {Name: has_schedule_count, Type: INTEGER}
              - {Name: manual_refreshes_30d, Type: INTEGER}
              - {Name: spice_count, Type: INTEGER}
              - {Name: dataset_count, Type: INTEGER}
      LogicalTableMap:
        usage:
          Alias: dataset_usage
          Source: {PhysicalTableId: usage}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDataSet, quicksight:DescribeDataSetPermissions, quicksight:PassDataSet, quicksight:DescribeIngestion, quicksight:ListIngestions, quicksight:UpdateDataSet, quicksight:DeleteDataSet, quicksight:CreateIngestion, quicksight:CancelIngestion, quicksight:UpdateDataSetPermissions]
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}
        - {Key: ManagedBy, Value: CloudFormation}

  # Refresh history: every fast-loop record (hourly), for trends and the failure feed.
  HistoryDataSet:
    Type: AWS::QuickSight::DataSet
    DependsOn: FastTable
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DataSetId: !Sub '${ResourcePrefix}-history'
      Name: Quick governance - dataset refresh history
      ImportMode: DIRECT_QUERY
      PhysicalTableMap:
        history:
          CustomSql:
            DataSourceArn:
              Fn::ImportValue: !Sub '${FoundationStackName}-QuickDataSourceArn'
            Name: refresh_history
            SqlQuery: !Sub
              - |
                SELECT
                  from_iso8601_timestamp(ts) AS scan_time,
                  datasetid AS dataset_id,
                  COALESCE(datasetname, datasetid) AS dataset_name,
                  COALESCE(importmode, 'UNKNOWN') AS import_mode,
                  COALESCE(laststatus, 'UNKNOWN') AS last_status,
                  lastrequesttype AS last_request_type,
                  errortype AS error_type,
                  errormessage AS error_message,
                  TRY(from_iso8601_timestamp(lastfailedat)) AS last_failed_at,
                  lastdurationsec AS last_duration_sec,
                  rowsingested AS rows_ingested,
                  CASE WHEN laststatus = 'FAILED' THEN 1 ELSE 0 END AS failed_count,
                  1 AS record_count
                FROM "${Db}"."dataset_lifecycle_fast"
                WHERE ts IS NOT NULL AND COALESCE(assetstate, 'ACTIVE') <> 'DELETED'
              - Db:
                  Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
            Columns:
              - {Name: scan_time, Type: DATETIME}
              - {Name: dataset_id, Type: STRING}
              - {Name: dataset_name, Type: STRING}
              - {Name: import_mode, Type: STRING}
              - {Name: last_status, Type: STRING}
              - {Name: last_request_type, Type: STRING}
              - {Name: error_type, Type: STRING}
              - {Name: error_message, Type: STRING}
              - {Name: last_failed_at, Type: DATETIME}
              - {Name: last_duration_sec, Type: DECIMAL}
              - {Name: rows_ingested, Type: INTEGER}
              - {Name: failed_count, Type: INTEGER}
              - {Name: record_count, Type: INTEGER}
      LogicalTableMap:
        history:
          Alias: refresh_history
          Source: {PhysicalTableId: history}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDataSet, quicksight:DescribeDataSetPermissions, quicksight:PassDataSet, quicksight:DescribeIngestion, quicksight:ListIngestions, quicksight:UpdateDataSet, quicksight:DeleteDataSet, quicksight:CreateIngestion, quicksight:CancelIngestion, quicksight:UpdateDataSetPermissions]
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}
        - {Key: ManagedBy, Value: CloudFormation}

  SchedulesDataSet:
    Type: AWS::QuickSight::DataSet
    DependsOn: SchedulesTable
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DataSetId: !Sub '${ResourcePrefix}-schedules'
      Name: Quick governance - dataset refresh schedules
      ImportMode: DIRECT_QUERY
      PhysicalTableMap:
        schedules:
          CustomSql:
            DataSourceArn:
              Fn::ImportValue: !Sub '${FoundationStackName}-QuickDataSourceArn'
            Name: refresh_schedules
            SqlQuery: !Sub
              - |
                WITH latest AS (
                  SELECT max(ts) AS ts FROM "${Db}"."dataset_lifecycle_schedules"
                ),
                src AS (
                  SELECT s.*
                  FROM "${Db}"."dataset_lifecycle_schedules" s
                  JOIN latest l ON s.ts = l.ts
                ),
                future AS (
                  SELECT *
                  FROM src
                  WHERE recordkind = 'planned_run'
                    AND TRY(from_iso8601_timestamp(runat)) > current_timestamp
                ),
                counts AS (
                  SELECT datasetid, scheduleid,
                         count(*) AS runs_7d,
                         count_if(TRY(from_iso8601_timestamp(runat)) <= date_add('day', 1, current_timestamp)) AS runs_24h
                  FROM future
                  GROUP BY 1, 2
                ),
                next_run AS (
                  SELECT datasetid, scheduleid, min(runat) AS next_run
                  FROM future
                  GROUP BY 1, 2
                )
                SELECT
                  from_iso8601_timestamp(s.ts) AS scan_time,
                  s.recordkind AS record_kind,
                  s.datasetid AS dataset_id,
                  COALESCE(s.datasetname, s.datasetid) AS dataset_name,
                  'SPICE' AS import_mode,
                  COALESCE(s.scheduleid, '') AS schedule_id,
                  COALESCE(s.refreshtype, '') AS refresh_type,
                  COALESCE(s.definition, '') AS definition,
                  COALESCE(s.nextrunlabel, '') AS next_run_label,
                  COALESCE(TRY(from_iso8601_timestamp(n.next_run)), TRY(from_iso8601_timestamp(s.nextrunat))) AS next_run_at,
                  s.runsperday AS runs_per_day,
                  CASE
                    WHEN s.recordkind <> 'schedule' THEN NULL
                    WHEN s.minuteknown = 'true' THEN COALESCE(c.runs_24h, 0)
                    ELSE CAST(round(s.runsperday) AS integer)
                  END AS runs_next_24h,
                  CASE
                    WHEN s.recordkind <> 'schedule' THEN NULL
                    WHEN s.minuteknown = 'true' THEN COALESCE(c.runs_7d, 0)
                    ELSE CAST(round(s.runsperday * 7) AS integer)
                  END AS runs_next_7d,
                  s.avgdurationsec AS avg_duration_sec,
                  COALESCE(s.lastrefreshstatus, '') AS last_status,
                  COALESCE(s.datasource, '(none)') AS data_source,
                  CASE
                    WHEN s.recordkind = 'schedule' AND s.runsperday IS NOT NULL AND s.avgdurationsec IS NOT NULL
                    THEN s.runsperday * s.avgdurationsec / 60.0
                  END AS refresh_minutes_per_day,
                  TRY(from_iso8601_timestamp(s.runat)) AS run_at,
                  date_trunc('day', TRY(from_iso8601_timestamp(s.runat))) AS run_day,
                  CASE WHEN s.hourutc IS NULL THEN NULL ELSE lpad(cast(s.hourutc AS varchar), 2, '0') END AS hour_utc,
                  CASE WHEN s.recordkind = 'planned_run' THEN 1 ELSE 0 END AS planned_count
                FROM src s
                LEFT JOIN next_run n ON s.datasetid = n.datasetid AND s.scheduleid = n.scheduleid
                LEFT JOIN counts c ON s.datasetid = c.datasetid AND s.scheduleid = c.scheduleid
                WHERE s.recordkind = 'schedule'
                   OR (s.recordkind = 'planned_run' AND TRY(from_iso8601_timestamp(s.runat)) > current_timestamp)
              - Db:
                  Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
            Columns:
              - {Name: scan_time, Type: DATETIME}
              - {Name: record_kind, Type: STRING}
              - {Name: dataset_id, Type: STRING}
              - {Name: dataset_name, Type: STRING}
              - {Name: import_mode, Type: STRING}
              - {Name: schedule_id, Type: STRING}
              - {Name: refresh_type, Type: STRING}
              - {Name: definition, Type: STRING}
              - {Name: next_run_label, Type: STRING}
              - {Name: next_run_at, Type: DATETIME}
              - {Name: runs_per_day, Type: DECIMAL}
              - {Name: runs_next_24h, Type: INTEGER}
              - {Name: runs_next_7d, Type: INTEGER}
              - {Name: avg_duration_sec, Type: INTEGER}
              - {Name: last_status, Type: STRING}
              - {Name: data_source, Type: STRING}
              - {Name: refresh_minutes_per_day, Type: DECIMAL}
              - {Name: run_at, Type: DATETIME}
              - {Name: run_day, Type: DATETIME}
              - {Name: hour_utc, Type: STRING}
              - {Name: planned_count, Type: INTEGER}
      LogicalTableMap:
        schedules:
          Alias: refresh_schedules
          Source: {PhysicalTableId: schedules}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDataSet, quicksight:DescribeDataSetPermissions, quicksight:PassDataSet, quicksight:DescribeIngestion, quicksight:ListIngestions, quicksight:UpdateDataSet, quicksight:DeleteDataSet, quicksight:CreateIngestion, quicksight:CancelIngestion, quicksight:UpdateDataSetPermissions]
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}
        - {Key: ManagedBy, Value: CloudFormation}

  DashboardsDataSet:
    Type: AWS::QuickSight::DataSet
    DependsOn: DashboardsTable
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DataSetId: !Sub '${ResourcePrefix}-dashboards'
      Name: Quick governance - dashboard usage
      ImportMode: DIRECT_QUERY
      PhysicalTableMap:
        dashboards:
          CustomSql:
            DataSourceArn:
              Fn::ImportValue: !Sub '${FoundationStackName}-QuickDataSourceArn'
            Name: dashboard_usage
            SqlQuery: !Sub
              - |
                WITH ranked AS (
                  SELECT d.*, row_number() OVER (PARTITION BY dashboardid ORDER BY ts DESC) AS rn
                  FROM "${Db}"."dataset_lifecycle_dashboards" d
                  WHERE ts IS NOT NULL
                ),
                latest AS (
                  SELECT * FROM ranked WHERE rn = 1 AND COALESCE(assetstate, 'ACTIVE') <> 'DELETED'
                )
                SELECT
                  from_iso8601_timestamp(l.ts) AS scan_time,
                  l.dashboardid AS dashboard_id,
                  COALESCE(l.dashboardname, l.dashboardid) AS dashboard_name,
                  CASE WHEN trim(u.name) = '' THEN '(no dataset)' ELSE trim(u.name) END AS dataset_name,
                  'DASHBOARD' AS import_mode,
                  COALESCE(l.usagestate, 'UNKNOWN') AS stored_state,
                  TRY(from_iso8601_timestamp(l.lastviewat)) AS last_view_at,
                  COALESCE(l.lastviewsource, '') AS last_view_source,
                  COALESCE(l.lastviewlabel, '') AS last_view_label,
                  l.dayssincelastview AS days_since_last_view,
                  COALESCE(l.sortdays, 999999) AS sort_days,
                  COALESCE(l.views30, 0) AS views_30,
                  COALESCE(l.views60, 0) AS views_60,
                  COALESCE(l.views90, 0) AS views_90,
                  l.viewsyearago90 AS views_year_ago_90,
                  TRY(from_iso8601_timestamp(l.metrichistorystart)) AS metric_history_start,
                  COALESCE(l.historycoversyearago, 'false') AS history_covers_year_ago,
                  TRY(from_iso8601_timestamp(l.lastpublishedat)) AS last_published_at,
                  TRY(from_iso8601_timestamp(l.createdat)) AS created_at,
                  TRY(from_iso8601_timestamp(l.coveragestart)) AS coverage_start,
                  COALESCE(l.coveragedays, 0) AS coverage_days,
                  COALESCE(l.datasetnames, '') AS dataset_names,
                  COALESCE(l.ownerstatus, 'not available') AS owner_status,
                  CASE WHEN l.lastviewat IS NULL THEN 1 ELSE 0 END AS never_viewed
                FROM latest l
                CROSS JOIN UNNEST(split(coalesce(nullif(l.datasetnames, ''), ' '), ',')) AS u(name)
              - Db:
                  Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
            Columns:
              - {Name: scan_time, Type: DATETIME}
              - {Name: dashboard_id, Type: STRING}
              - {Name: dashboard_name, Type: STRING}
              - {Name: dataset_name, Type: STRING}
              - {Name: import_mode, Type: STRING}
              - {Name: stored_state, Type: STRING}
              - {Name: last_view_at, Type: DATETIME}
              - {Name: last_view_source, Type: STRING}
              - {Name: last_view_label, Type: STRING}
              - {Name: days_since_last_view, Type: INTEGER}
              - {Name: sort_days, Type: INTEGER}
              - {Name: views_30, Type: INTEGER}
              - {Name: views_60, Type: INTEGER}
              - {Name: views_90, Type: INTEGER}
              - {Name: views_year_ago_90, Type: INTEGER}
              - {Name: metric_history_start, Type: DATETIME}
              - {Name: history_covers_year_ago, Type: STRING}
              - {Name: last_published_at, Type: DATETIME}
              - {Name: created_at, Type: DATETIME}
              - {Name: coverage_start, Type: DATETIME}
              - {Name: coverage_days, Type: INTEGER}
              - {Name: dataset_names, Type: STRING}
              - {Name: owner_status, Type: STRING}
              - {Name: never_viewed, Type: INTEGER}
      LogicalTableMap:
        dashboards:
          Alias: dashboard_usage
          Source: {PhysicalTableId: dashboards}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDataSet, quicksight:DescribeDataSetPermissions, quicksight:PassDataSet, quicksight:DescribeIngestion, quicksight:ListIngestions, quicksight:UpdateDataSet, quicksight:DeleteDataSet, quicksight:CreateIngestion, quicksight:CancelIngestion, quicksight:UpdateDataSetPermissions]
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}
        - {Key: ManagedBy, Value: CloudFormation}

  IdleHistoryDataSet:
    Type: AWS::QuickSight::DataSet
    DependsOn: [SlowTable, DashboardsTable]
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DataSetId: !Sub '${ResourcePrefix}-idle-history'
      Name: Quick governance - idle history
      ImportMode: DIRECT_QUERY
      PhysicalTableMap:
        idlehist:
          CustomSql:
            DataSourceArn:
              Fn::ImportValue: !Sub '${FoundationStackName}-QuickDataSourceArn'
            Name: idle_history
            SqlQuery: !Sub
              - |
                SELECT
                  from_iso8601_timestamp(ts) AS scan_time,
                  COALESCE(datasetname, datasetid) AS dataset_name,
                  COALESCE(importmode, 'UNKNOWN') AS import_mode,
                  'Datasets' AS series,
                  CASE WHEN usagestate = 'IDLE' THEN 1 ELSE 0 END AS idle_count
                FROM "${Db}"."dataset_lifecycle_slow"
                WHERE ts IS NOT NULL AND COALESCE(assetstate, 'ACTIVE') <> 'DELETED'
                UNION ALL
                SELECT
                  from_iso8601_timestamp(ts) AS scan_time,
                  '(dashboards)' AS dataset_name,
                  'DASHBOARD' AS import_mode,
                  'Dashboards' AS series,
                  CASE WHEN usagestate = 'IDLE' THEN 1 ELSE 0 END AS idle_count
                FROM "${Db}"."dataset_lifecycle_dashboards"
                WHERE ts IS NOT NULL AND COALESCE(assetstate, 'ACTIVE') <> 'DELETED'
              - Db:
                  Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
            Columns:
              - {Name: scan_time, Type: DATETIME}
              - {Name: dataset_name, Type: STRING}
              - {Name: import_mode, Type: STRING}
              - {Name: series, Type: STRING}
              - {Name: idle_count, Type: INTEGER}
      LogicalTableMap:
        idlehist:
          Alias: idle_history
          Source: {PhysicalTableId: idlehist}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDataSet, quicksight:DescribeDataSetPermissions, quicksight:PassDataSet, quicksight:DescribeIngestion, quicksight:ListIngestions, quicksight:UpdateDataSet, quicksight:DeleteDataSet, quicksight:CreateIngestion, quicksight:CancelIngestion, quicksight:UpdateDataSetPermissions]
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}
        - {Key: ManagedBy, Value: CloudFormation}

  Dashboard:
    Type: AWS::QuickSight::Dashboard
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DashboardId: !Sub '${ResourcePrefix}-dashboard'
      Name: AWS Quick - Dataset Lifecycle
      VersionDescription: Administrator dashboard - Overview, Refresh health, Usage, Capacity and cost, History.
      DashboardPublishOptions:
        AdHocFilteringOption: {AvailabilityStatus: ENABLED}
        ExportToCSVOption: {AvailabilityStatus: ENABLED}
        SheetControlsOption: {VisibilityState: EXPANDED}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDashboard, quicksight:ListDashboardVersions, quicksight:UpdateDashboardPermissions, quicksight:QueryDashboard, quicksight:UpdateDashboard, quicksight:DeleteDashboard, quicksight:DescribeDashboardPermissions, quicksight:UpdateDashboardPublishedVersion]
      Definition: # GENERATED
        DataSetIdentifierDeclarations:
          - Identifier: health
            DataSetArn: !GetAtt HealthDataSet.Arn
          - Identifier: usage
            DataSetArn: !GetAtt UsageDataSet.Arn
          - Identifier: hist
            DataSetArn: !GetAtt HistoryDataSet.Arn
          - Identifier: sched
            DataSetArn: !GetAtt SchedulesDataSet.Arn
          - Identifier: dashes
            DataSetArn: !GetAtt DashboardsDataSet.Arn
          - Identifier: idlehist
            DataSetArn: !GetAtt IdleHistoryDataSet.Arn
        ParameterDeclarations:
          - DateTimeParameterDeclaration:
              Name: pStart
              TimeGranularity: DAY
              DefaultValues:
                RollingDate: {Expression: "addDateTime(-1, 'MM', truncDate('MM', now()))"}
          - DateTimeParameterDeclaration:
              Name: pEnd
              TimeGranularity: DAY
              DefaultValues:
                RollingDate: {Expression: "addDateTime(1, 'DD', truncDate('DD', now()))"}
          - StringParameterDeclaration:
              Name: pIdleDays
              ParameterValueType: SINGLE_VALUED
              DefaultValues:
                StaticValues: ['60']
        CalculatedFields:
          - DataSetIdentifier: usage
            Name: usage_state
            Expression: 'ifelse(isNotNull({last_observed_use_at}) AND dateDiff({last_observed_use_at}, now(), ''DD'') <= parseInt(${pIdleDays}), ''ACTIVE'', ifelse(isNotNull({coverage_start}) AND isNotNull({dataset_created_at}) AND dateDiff({coverage_start}, now(), ''DD'') >= parseInt(${pIdleDays}) AND dateDiff({dataset_created_at}, now(), ''DD'') > parseInt(${pIdleDays}), ''IDLE'', ''UNKNOWN''))'
          - DataSetIdentifier: usage
            Name: active_flag
            Expression: 'ifelse({usage_state} = ''ACTIVE'', 1, 0)'
          - DataSetIdentifier: usage
            Name: idle_flag
            Expression: 'ifelse({usage_state} = ''IDLE'', 1, 0)'
          - DataSetIdentifier: usage
            Name: unknown_flag
            Expression: 'ifelse({usage_state} = ''UNKNOWN'', 1, 0)'
          - DataSetIdentifier: usage
            Name: idle_spice
            Expression: 'ifelse({usage_state} = ''IDLE'', ifelse(isNull({spice_gb}), 0, {spice_gb}), 0)'
          - DataSetIdentifier: usage
            Name: idle_cost
            Expression: 'ifelse({usage_state} = ''IDLE'', ifelse(isNull({est_monthly_cost_usd}), 0, {est_monthly_cost_usd}), 0)'
          - DataSetIdentifier: usage
            Name: staleness
            Expression: 'ifelse(isNull({last_observed_use_at}), 999999, dateDiff({last_observed_use_at}, now(), ''DD''))'
          - DataSetIdentifier: usage
            Name: days_now
            Expression: 'ifelse(isNull({last_observed_use_at}), NULL, dateDiff({last_observed_use_at}, now(), ''DD''))'
          - DataSetIdentifier: usage
            Name: days_since_refresh
            Expression: 'ifelse(isNull({last_refresh_at}), NULL, dateDiff({last_refresh_at}, now(), ''DD''))'
          - DataSetIdentifier: usage
            Name: unknown_reason
            Expression: 'ifelse({usage_state} <> ''UNKNOWN'', NULL, ifelse(isNull({dataset_created_at}), ''created date is missing'', ifelse(dateDiff({dataset_created_at}, now(), ''DD'') <= parseInt(${pIdleDays}), concat(''created '', toString(dateDiff({dataset_created_at}, now(), ''DD'')), '' days ago''), concat(''coverage is '', toString(ifelse(isNull({coverage_start}), 0, dateDiff({coverage_start}, now(), ''DD''))), '' days''))))'
          - DataSetIdentifier: usage
            Name: recheck_after
            Expression: 'ifelse({usage_state} <> ''UNKNOWN'', NULL, ifelse(isNull({dataset_created_at}), addDateTime(parseInt(${pIdleDays}), ''DD'', {coverage_start}), ifelse(isNull({coverage_start}), addDateTime(parseInt(${pIdleDays}), ''DD'', {dataset_created_at}), ifelse(addDateTime(parseInt(${pIdleDays}), ''DD'', {dataset_created_at}) > addDateTime(parseInt(${pIdleDays}), ''DD'', {coverage_start}), addDateTime(parseInt(${pIdleDays}), ''DD'', {dataset_created_at}), addDateTime(parseInt(${pIdleDays}), ''DD'', {coverage_start})))))'
          - DataSetIdentifier: dashes
            Name: usage_state
            Expression: 'ifelse(isNotNull({last_view_at}) AND dateDiff({last_view_at}, now(), ''DD'') <= parseInt(${pIdleDays}), ''ACTIVE'', ifelse(isNotNull({coverage_start}) AND isNotNull({created_at}) AND dateDiff({coverage_start}, now(), ''DD'') >= parseInt(${pIdleDays}) AND dateDiff({created_at}, now(), ''DD'') > parseInt(${pIdleDays}), ''IDLE'', ''UNKNOWN''))'
          - DataSetIdentifier: dashes
            Name: active_id
            Expression: 'ifelse({usage_state} = ''ACTIVE'', {dashboard_id}, NULL)'
          - DataSetIdentifier: dashes
            Name: idle_id
            Expression: 'ifelse({usage_state} = ''IDLE'', {dashboard_id}, NULL)'
          - DataSetIdentifier: dashes
            Name: unknown_id
            Expression: 'ifelse({usage_state} = ''UNKNOWN'', {dashboard_id}, NULL)'
          - DataSetIdentifier: dashes
            Name: deletion_candidate
            Expression: 'ifelse({usage_state} = ''IDLE'' AND {history_covers_year_ago} = ''true'' AND {views_year_ago_90} = 0, ''true'', ''false'')'
          - DataSetIdentifier: dashes
            Name: staleness
            Expression: 'ifelse(isNull({last_view_at}), 999999, dateDiff({last_view_at}, now(), ''DD''))'
          - DataSetIdentifier: dashes
            Name: days_now
            Expression: 'ifelse(isNull({last_view_at}), NULL, dateDiff({last_view_at}, now(), ''DD''))'
          - DataSetIdentifier: dashes

                        Values:
                          - DateMeasureField: {FieldId: ov-tbl-failed-m0, Column: {DataSetIdentifier: health, ColumnName: last_failed_at}, AggregationFunction: MAX, FormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm'}}
                          - DateMeasureField: {FieldId: ov-tbl-failed-m1, Column: {DataSetIdentifier: health, ColumnName: last_success_at}, AggregationFunction: MAX, FormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm'}}
                          - NumericalMeasureField: {FieldId: ov-tbl-failed-m2, Column: {DataSetIdentifier: health, ColumnName: window_failed}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}
                    SortConfiguration:
                      RowSort:
                        - FieldSort: {FieldId: ov-tbl-failed-m0, Direction: DESC}
                    FieldOptions:
                      SelectedFieldOptions:
                        - {FieldId: ov-tbl-failed-g0, CustomLabel: 'Dataset'}
                        - {FieldId: ov-tbl-failed-g1, CustomLabel: 'Error type'}
                        - {FieldId: ov-tbl-failed-g2, CustomLabel: 'Error message'}
                        - {FieldId: ov-tbl-failed-g3, CustomLabel: 'Refresh type'}
                        - {FieldId: ov-tbl-failed-m0, CustomLabel: 'Last failed'}
                        - {FieldId: ov-tbl-failed-m1, CustomLabel: 'Last success'}
                        - {FieldId: ov-tbl-failed-m2, CustomLabel: 'Failures in window'}
            TextBoxes:
              - SheetTextBoxId: ov-txt-howto
                Content: '<text-box><block align="left"><inline font-weight="bold">How to read usage evidence.</inline> Quick exposes no authoritative "last used" attribute, so usage is a signal with a confidence label, never a verdict. A topic-grounded agent answer can cite nothing and leave no trace; ad-hoc analyses are invisible. Never delete a dataset on this signal alone. Refresh state comes from ListIngestions (hourly); usage, lineage and capacity from the daily scan. All collection is read-only through IAM - the governance team sees the operation without becoming a co-owner of anyone''s data.</block></text-box>'
            Layouts:
              - Configuration:
                  GridLayout:
                    CanvasSizeOptions:
                      ScreenCanvasSizeOptions: {ResizeOption: FIXED, OptimizedViewPortWidth: '1600px'}
                    Elements:
                      - {ElementId: ov-kpi-datasets, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 4, RowIndex: 0, RowSpan: 5}

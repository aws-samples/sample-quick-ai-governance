                        - {FieldId: db-tbl-all-g8, CustomLabel: 'Views in 90 days'}
                        - {FieldId: db-tbl-all-g9, CustomLabel: 'Views in the same 90 days a year earlier'}
                        - {FieldId: db-tbl-all-g10, CustomLabel: 'Last published (UTC)'}
                        - {FieldId: db-tbl-all-g11, CustomLabel: 'Datasets used'}

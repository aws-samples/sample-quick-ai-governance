AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Amazon Quick orphaned assets monitor (Phase 1, AUDIT_ONLY). A scheduled
  collector reconciles every asset's owner grants (datasets, dashboards,
  analyses, data sources, folders, spaces, agents, topics) against the
  current Quick user/group inventory and flags ownership risk - orphaned
  assets, missing owner principals, single-owner assets - with evidence and
  confidence. Findings land as JSONL snapshots in the shared analytics bucket
  of the Analytics Foundation stack, where the module's Amazon Quick dashboard
  reads them; KPI metrics drive the alarms and SNS alerts. Strictly read-only:
  it never transfers ownership, never deletes anything. Deploy via
  scripts/apply-governance-orphaned-assets-monitor.sh (sam build + deploy,
  then the Quick dashboard).

Parameters:
  ResourcePrefix:
    Type: String
    Default: 'quick-governance-orphaned-assets'
    AllowedPattern: '^[a-z0-9-]{1,40}$'
    ConstraintDescription: 1-40 chars, lowercase letters, digits, hyphens.
    Description: Prefix for every resource name (also in the bucket name).

  ScheduleExpression:
    Type: String
    Default: 'cron(45 3 * * ? *)'
    Description: Reconciliation cadence (daily 03:45 UTC by default).

  AlertEmail:
    Type: String
    Default: ''
    Description: >
      Email for new HIGH-severity finding alerts and alarms. Empty = no SNS.
      Confirm the subscription from the inbox after deployment.

  IdentityRegion:
    Type: String
    Default: ''
    Description: >
      Region hosting the Quick user/group APIs, which can differ from the
      asset Region. Leave empty to auto-discover (the collector parses the
      identity-region hint from the AccessDeniedException and caches it).

  Namespaces:
    Type: String
    Default: 'default'
    Description: Comma-separated Quick namespaces to inventory.

  AssetTypes:
    Type: String
    Default: 'DATASET,DASHBOARD,ANALYSIS,DATA_SOURCE,FOLDER,SPACE,AGENT,TOPIC'
    Description: Comma-separated asset types to scan.

  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]

  FunctionTimeoutSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    MaxValue: 900

  FunctionMemoryMb:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240

  ExcludeAssetIdPrefixes:
    Type: String
    Default: 'quick-governance-'
    AllowedPattern: '^[A-Za-z0-9_,. -]*$'
    Description: >
      Comma-separated asset-ID prefixes to leave out of the scan. The default
      skips the Quick assets created by the governance stacks themselves (IDs
      quick-governance-*), so the monitor does not report on its own dashboards
      and datasets. Empty scans everything.

  AnalyticsBucketName:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: An existing S3 bucket name (3-63 chars).
    Description: >
      Shared analytics bucket created by the Analytics Foundation stack (its
      AnalyticsBucketName output; the apply script resolves it). Snapshots land
      under orphaned-assets/ (the Quick dashboard's Glue table locations) and the
      collector's working state under orphaned-assets/state/.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
Resources:

  AlertTopicKey:
    Type: AWS::KMS::Key
    Condition: HasAlertEmail
    Properties:
      Description: !Sub 'Encrypts the ${ResourcePrefix} alert topic (SNS SSE)'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          # Root delegation enables identity-based grants (the collector
          # role gets kms:Decrypt/GenerateDataKey via its own policy).
          - Sid: AccountRootAdmin
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: !Sub '${ResourcePrefix}-alerts'
      KmsMasterKeyId: !Ref AlertTopicKey
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: !Sub '${ResourcePrefix}-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: QuickSightListInventory
                Effect: Allow
                Action:
                  - quicksight:ListDataSets
                  - quicksight:ListDashboards
                  - quicksight:ListAnalyses
                  - quicksight:ListDataSources
                  - quicksight:ListFolders
                  - quicksight:ListSpaces
                  - quicksight:ListAgents
                  - quicksight:ListTopics
                  - quicksight:ListTopicsV2
                Resource: '*'
              # User/group APIs live in the account's identity region, which
              # can differ from the deployment region - hence region "*".
              - Sid: QuickSightIdentityRead
                Effect: Allow
                Action:
                  - quicksight:ListUsers
                  - quicksight:ListGroups
                  - quicksight:ListGroupMemberships
                Resource:
                  - !Sub 'arn:${AWS::Partition}:quicksight:*:${AWS::AccountId}:user/*'
                  - !Sub 'arn:${AWS::Partition}:quicksight:*:${AWS::AccountId}:group/*'
                  - !Sub 'arn:${AWS::Partition}:quicksight:*:${AWS::AccountId}:namespace/*'
              - Sid: QuickSightPermissionsRead
                Effect: Allow
                Action:
                  - quicksight:DescribeDataSetPermissions
                  - quicksight:DescribeDashboardPermissions
                  - quicksight:DescribeAnalysisPermissions
                  - quicksight:DescribeDataSourcePermissions
                  - quicksight:DescribeFolderPermissions
                  - quicksight:DescribeFolderResolvedPermissions
                  - quicksight:DescribeSpacePermissions
                  - quicksight:DescribeAgentPermissions
                  - quicksight:DescribeTopicPermissions
                  - quicksight:DescribeTopicPermissionsV2
                Resource:
                  - !Sub 'arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:dataset/*'
                  - !Sub 'arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:dashboard/*'
                  - !Sub 'arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:analysis/*'
                  - !Sub 'arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:datasource/*'
                  - !Sub 'arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:folder/*'
                  - !Sub 'arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:space/*'
                  - !Sub 'arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:agent/*'
                  - !Sub 'arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:topic/*'
              - Sid: CloudWatchWriteKpis
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: 'QuickGovernance/OrphanedAssets'
              - Sid: SharedBucketSnapshotAndStateWrite
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AnalyticsBucketName}/orphaned-assets/*'
              - Sid: SharedBucketStateRead
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AnalyticsBucketName}/orphaned-assets/state/*'
              # ListBucket is what turns a missing state file into NoSuchKey
              # (first run) instead of AccessDenied; key names only.
              - Sid: SharedBucketList
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AnalyticsBucketName}'
              - !If
                - HasAlertEmail
                - Sid: SnsPublishAlerts
                  Effect: Allow
                  Action:
                    - sns:Publish
                  Resource: !Ref AlertTopic
                - !Ref AWS::NoValue
              - !If
                - HasAlertEmail
                - Sid: KmsForEncryptedAlerts
                  Effect: Allow
                  Action:
                    - kms:Decrypt
                    - kms:GenerateDataKey*
                  Resource: !GetAtt AlertTopicKey.Arn
                - !Ref AWS::NoValue
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix
        - Key: ManagedBy
          Value: CloudFormation

  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ResourcePrefix}-fn'
      RetentionInDays: !Ref LogRetentionDays

  CollectorFunction:
    Type: AWS::Serverless::Function
    DependsOn: CollectorLogGroup
    Properties:
      FunctionName: !Sub '${ResourcePrefix}-fn'
      Description: >
        Reconciles Amazon Quick asset ownership against the user inventory
        (audit-only).
      Runtime: python3.14
      Architectures:
        - arm64
      Handler: collector.lambda_handler
      CodeUri: ../lambda/
      Role: !GetAtt CollectorRole.Arn
      Timeout: !Ref FunctionTimeoutSeconds
      MemorySize: !Ref FunctionMemoryMb
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          QS_ACCOUNT_ID: !Ref AWS::AccountId
          STATE_BUCKET: !Ref AnalyticsBucketName
          STATE_PREFIX: 'orphaned-assets/'
          SNAPSHOT_BUCKET: !Ref AnalyticsBucketName
          SNAPSHOT_PREFIX: 'orphaned-assets/'
          EXCLUDE_ASSET_ID_PREFIXES: !Ref ExcludeAssetIdPrefixes
          SNS_TOPIC_ARN: !If [HasAlertEmail, !Ref AlertTopic, '']
          IDENTITY_REGION: !Ref IdentityRegion
          NAMESPACES: !Ref Namespaces
          ASSET_TYPES: !Ref AssetTypes
      Events:
        DailyScan:
          Type: Schedule
          Properties:
            Name: !Sub '${ResourcePrefix}-scan'
            Description: Daily ownership reconciliation scan.
            Schedule: !Ref ScheduleExpression
            Input: '{}'
      Tags:
        Purpose: !Ref ResourcePrefix
        ManagedBy: CloudFormation

  CollectorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ResourcePrefix}-collector-errors'
      AlarmDescription: >
        The orphaned-assets collector reported an error. Findings may be
        stale; no findings are ever closed after a failed or partial scan.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CollectorFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], []]

  HighFindingsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ResourcePrefix}-high-findings'
      AlarmDescription: >
        At least one HIGH-severity ownership finding is open (asset with no
        active owner or with every owner principal missing). Review the
        Quick dashboard and transfer ownership via the Quick asset management
        console.
      Namespace: QuickGovernance/OrphanedAssets
      MetricName: HighSeverityFindings
      Statistic: Maximum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], []]

Outputs:
  FunctionName:
    Description: Name of the collector Lambda function.
    Value: !Ref CollectorFunction
    Export:
      Name: !Sub '${AWS::StackName}-FunctionName'

  StateLocation:
    Description: Where the collector keeps its working state (state/*.json).
    Value: !Sub 's3://${AnalyticsBucketName}/orphaned-assets/state/'

  AlertTopicArn:
    Condition: HasAlertEmail
    Description: SNS topic receiving new HIGH-finding alerts and alarms.
    Value: !Ref AlertTopic

  RunScanNowCommand:
    Description: Convenience command to trigger a scan immediately.
    Value: !Sub >-
      aws lambda invoke --function-name ${CollectorFunction}
      --payload '{}' --cli-binary-format raw-in-base64-out
      --region ${AWS::Region} /dev/stdout

  SnapshotLocation:
    Description: S3 prefix that receives the JSONL snapshots (Glue table location for the Quick dashboard).
    Value: !Sub 's3://${AnalyticsBucketName}/orphaned-assets/ownership/'

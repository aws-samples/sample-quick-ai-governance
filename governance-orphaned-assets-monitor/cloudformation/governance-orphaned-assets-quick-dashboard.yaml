AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Amazon Quick orphaned assets monitor - native Amazon Quick dashboard for
  administrators. Glue table over the daily ownership snapshots the module
  writes to S3 (owner principal names are not declared), a current-state
  dataset (latest scan per asset) and a history dataset, and a four-tab
  dashboard: Overview, Findings, Ownership, History. Requires the governance
  analytics foundation stack in the same Region.

# Prerequisites: governance-analytics-foundation in this Region; the Orphaned
# Assets module writing snapshots (snapshots/ownership/dt=.../run-*.jsonl);
# console authorization of DataBucketName for Quick's service role.

Parameters:
  ResourcePrefix:
    Type: String
    Default: 'quick-governance-orphaned-assets'
    AllowedPattern: '^[a-z0-9-]{1,40}$'
    Description: Prefix for the Quick dataset and dashboard IDs.
  FoundationStackName:
    Type: String
    Default: 'quick-governance-analytics-foundation'
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]{0,127}$'
    Description: Stack name of the governance analytics foundation (exports are imported).
  DataBucketName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    Description: >
      Bucket holding the module snapshots. Empty (default) reads the shared
      analytics bucket created by the foundation stack; set it to read a
      module-owned bucket (<prefix>-<account-id>) together with SnapshotPrefix=snapshots/ownership/.
  SnapshotPrefix:
    Type: String
    Default: 'orphaned-assets/ownership/'
    AllowedPattern: '^([A-Za-z0-9_=./-]+/)?$'
    Description: Prefix of the dt=... partitioned ownership snapshots.
  QuickPrincipalArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:quicksight:[a-z0-9-]+:[0-9]{12}:(user|group)/.+$'
    Description: Quick user or group ARN (identity Region) that owns the datasets and dashboard.

Conditions:
  UseSharedBucket: !Equals [!Ref DataBucketName, '']

Resources:

  SnapshotTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseName:
        Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
      TableInput:
        Name: orphaned_assets_snapshots
        Description: Orphaned Assets Monitor - one record per asset per daily scan (ownerPrincipals not declared).
        TableType: EXTERNAL_TABLE
        Parameters: {classification: json, EXTERNAL: 'TRUE'}
        StorageDescriptor:
          Location: !If
            - UseSharedBucket
            - !Sub
              - 's3://${Bucket}/${SnapshotPrefix}'
              - Bucket:
                  Fn::ImportValue: !Sub '${FoundationStackName}-AnalyticsBucket'
            - !Sub 's3://${DataBucketName}/${SnapshotPrefix}'
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters: {ignore.malformed.json: 'true', case.insensitive: 'true'}
          Columns:
            - {Name: ts, Type: string}
            - {Name: scanid, Type: string}
            - {Name: scanstatus, Type: string}
            - {Name: assettype, Type: string}
            - {Name: assetid, Type: string}
            - {Name: assetname, Type: string}
            - {Name: assetarn, Type: string}
            - {Name: findingtype, Type: string}
            - {Name: severity, Type: string}
            - {Name: confidence, Type: string}
            - {Name: scannote, Type: string}
            - {Name: ownerstotal, Type: int}
            - {Name: ownersactive, Type: int}
            - {Name: ownersmissing, Type: int}
            - {Name: ownerspending, Type: int}
            - {Name: viewerstotal, Type: int}
            - {Name: firstobservedat, Type: string}
            - {Name: lastobservedat, Type: string}
            - {Name: recoveredfrom, Type: string}

  # Current state: the most recent scan record per asset (window function).
  CurrentDataSet:
    Type: AWS::QuickSight::DataSet
    DependsOn: SnapshotTable
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DataSetId: !Sub '${ResourcePrefix}-current'
      Name: Quick governance - asset ownership (current)
      ImportMode: DIRECT_QUERY
      PhysicalTableMap:
        current:
          CustomSql:
            DataSourceArn:
              Fn::ImportValue: !Sub '${FoundationStackName}-QuickDataSourceArn'
            Name: ownership_current
            SqlQuery: !Sub
              - |
                WITH ranked AS (
                  SELECT s.*, row_number() OVER (PARTITION BY assettype, assetid ORDER BY ts DESC) AS rn
                  FROM "${Db}"."orphaned_assets_snapshots" s
                  WHERE ts IS NOT NULL
                )
                -- An asset whose most recent record is RECOVERED has left the estate
                -- or been excluded: it is not current. Filtering after ranking keeps
                -- the older open finding from resurfacing.
                SELECT
                  from_iso8601_timestamp(ts) AS scan_time,
                  scanid AS scan_id,
                  COALESCE(scanstatus, 'UNKNOWN') AS scan_status,
                  assettype AS asset_type,
                  assetid AS asset_id,
                  COALESCE(assetname, assetid) AS asset_name,
                  assetarn AS asset_arn,
                  findingtype AS finding_type,
                  severity,
                  CASE severity WHEN 'HIGH' THEN 1 WHEN 'MEDIUM' THEN 2 WHEN 'LOW' THEN 3 ELSE 4 END AS severity_rank,
                  COALESCE(confidence, 'UNKNOWN') AS confidence,
                  scannote AS scan_note,
                  ownerstotal AS owners_total,
                  ownersactive AS owners_active,
                  ownersmissing AS owners_missing,
                  ownerspending AS owners_pending,
                  viewerstotal AS viewers_total,
                  TRY(from_iso8601_timestamp(firstobservedat)) AS first_observed_at,
                  date_diff('day', TRY(from_iso8601_timestamp(firstobservedat)), from_iso8601_timestamp(ts)) AS days_open,
                  CASE WHEN severity = 'HIGH' THEN 1 ELSE 0 END AS high_count,
                  CASE WHEN severity = 'MEDIUM' THEN 1 ELSE 0 END AS medium_count,
                  CASE WHEN severity = 'LOW' THEN 1 ELSE 0 END AS low_count,
                  CASE WHEN findingtype = 'NONE' THEN 1 ELSE 0 END AS healthy_count,
                  CASE WHEN findingtype = 'SINGLE_ACTIVE_OWNER' THEN 1 ELSE 0 END AS single_owner_count,
                  CASE WHEN findingtype IN ('NO_OWNER_GRANTS', 'OWNER_PRINCIPAL_MISSING', 'NO_ACTIVE_OWNER') THEN 1 ELSE 0 END AS orphaned_count,
                  1 AS asset_count
                FROM ranked WHERE rn = 1 AND findingtype <> 'RECOVERED'
              - Db:
                  Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
            Columns:
              - {Name: scan_time, Type: DATETIME}
              - {Name: scan_id, Type: STRING}
              - {Name: scan_status, Type: STRING}
              - {Name: asset_type, Type: STRING}
              - {Name: asset_id, Type: STRING}
              - {Name: asset_name, Type: STRING}
              - {Name: asset_arn, Type: STRING}
              - {Name: finding_type, Type: STRING}
              - {Name: severity, Type: STRING}
              - {Name: severity_rank, Type: INTEGER}
              - {Name: confidence, Type: STRING}
              - {Name: scan_note, Type: STRING}
              - {Name: owners_total, Type: INTEGER}
              - {Name: owners_active, Type: INTEGER}
              - {Name: owners_missing, Type: INTEGER}
              - {Name: owners_pending, Type: INTEGER}
              - {Name: viewers_total, Type: INTEGER}
              - {Name: first_observed_at, Type: DATETIME}
              - {Name: days_open, Type: INTEGER}
              - {Name: high_count, Type: INTEGER}
              - {Name: medium_count, Type: INTEGER}
              - {Name: low_count, Type: INTEGER}
              - {Name: healthy_count, Type: INTEGER}
              - {Name: single_owner_count, Type: INTEGER}
              - {Name: orphaned_count, Type: INTEGER}
              - {Name: asset_count, Type: INTEGER}
      LogicalTableMap:
        current:
          Alias: ownership_current
          Source: {PhysicalTableId: current}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDataSet, quicksight:DescribeDataSetPermissions, quicksight:PassDataSet, quicksight:DescribeIngestion, quicksight:ListIngestions, quicksight:UpdateDataSet, quicksight:DeleteDataSet, quicksight:CreateIngestion, quicksight:CancelIngestion, quicksight:UpdateDataSetPermissions]
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}
        - {Key: ManagedBy, Value: CloudFormation}

  # History: every scan record, for trends and the recovered-findings feed.
  HistoryDataSet:
    Type: AWS::QuickSight::DataSet
    DependsOn: SnapshotTable
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DataSetId: !Sub '${ResourcePrefix}-history'
      Name: Quick governance - asset ownership (scan history)
      ImportMode: DIRECT_QUERY
      PhysicalTableMap:
        history:
          CustomSql:
            DataSourceArn:
              Fn::ImportValue: !Sub '${FoundationStackName}-QuickDataSourceArn'
            Name: ownership_history
            SqlQuery: !Sub
              - |
                SELECT
                  from_iso8601_timestamp(ts) AS scan_time,
                  scanid AS scan_id,
                  COALESCE(scanstatus, 'UNKNOWN') AS scan_status,
                  assettype AS asset_type,
                  assetid AS asset_id,
                  COALESCE(assetname, assetid) AS asset_name,
                  findingtype AS finding_type,
                  severity,
                  recoveredfrom AS recovered_from,
                  TRY(from_iso8601_timestamp(firstobservedat)) AS first_observed_at,
                  CASE WHEN severity = 'HIGH' THEN 1 ELSE 0 END AS high_count,
                  CASE WHEN severity = 'MEDIUM' THEN 1 ELSE 0 END AS medium_count,
                  CASE WHEN severity = 'LOW' THEN 1 ELSE 0 END AS low_count,
                  CASE WHEN findingtype = 'RECOVERED' THEN 1 ELSE 0 END AS recovered_count,
                  CASE WHEN findingtype <> 'RECOVERED' THEN 1 ELSE 0 END AS asset_count
                FROM "${Db}"."orphaned_assets_snapshots"
                WHERE ts IS NOT NULL
              - Db:
                  Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
            Columns:
              - {Name: scan_time, Type: DATETIME}
              - {Name: scan_id, Type: STRING}
              - {Name: scan_status, Type: STRING}
              - {Name: asset_type, Type: STRING}
              - {Name: asset_id, Type: STRING}
              - {Name: asset_name, Type: STRING}
              - {Name: finding_type, Type: STRING}
              - {Name: severity, Type: STRING}
              - {Name: recovered_from, Type: STRING}
              - {Name: first_observed_at, Type: DATETIME}
              - {Name: high_count, Type: INTEGER}
              - {Name: medium_count, Type: INTEGER}
              - {Name: low_count, Type: INTEGER}
              - {Name: recovered_count, Type: INTEGER}
              - {Name: asset_count, Type: INTEGER}
      LogicalTableMap:
        history:
          Alias: ownership_history
          Source: {PhysicalTableId: history}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDataSet, quicksight:DescribeDataSetPermissions, quicksight:PassDataSet, quicksight:DescribeIngestion, quicksight:ListIngestions, quicksight:UpdateDataSet, quicksight:DeleteDataSet, quicksight:CreateIngestion, quicksight:CancelIngestion, quicksight:UpdateDataSetPermissions]
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}
        - {Key: ManagedBy, Value: CloudFormation}

  Dashboard:
    Type: AWS::QuickSight::Dashboard
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DashboardId: !Sub '${ResourcePrefix}-dashboard'
      Name: Amazon Quick - asset ownership
      VersionDescription: Administrator dashboard - Overview, Findings, Ownership, History.
      DashboardPublishOptions:
        AdHocFilteringOption: {AvailabilityStatus: ENABLED}
        ExportToCSVOption: {AvailabilityStatus: ENABLED}
        SheetControlsOption: {VisibilityState: EXPANDED}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDashboard, quicksight:ListDashboardVersions, quicksight:UpdateDashboardPermissions, quicksight:QueryDashboard, quicksight:UpdateDashboard, quicksight:DeleteDashboard, quicksight:DescribeDashboardPermissions, quicksight:UpdateDashboardPublishedVersion]
      Definition: # GENERATED
        DataSetIdentifierDeclarations:
          - Identifier: cur
            DataSetArn: !GetAtt CurrentDataSet.Arn
          - Identifier: hist
            DataSetArn: !GetAtt HistoryDataSet.Arn
        ParameterDeclarations:
          - DateTimeParameterDeclaration:
              Name: pStart
              TimeGranularity: DAY
              DefaultValues:
                RollingDate: {Expression: "addDateTime(-3, 'MM', truncDate('MM', now()))"}
          - DateTimeParameterDeclaration:
              Name: pEnd
              TimeGranularity: DAY
              DefaultValues:
                RollingDate: {Expression: "addDateTime(1, 'DD', truncDate('DD', now()))"}
        FilterGroups:
          - FilterGroupId: fg-range
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - TimeRangeFilter:
                  FilterId: f-range
                  Column: {DataSetIdentifier: hist, ColumnName: scan_time}
                  IncludeMinimum: true
                  IncludeMaximum: false
                  RangeMinimumValue: {Parameter: pStart}
                  RangeMaximumValue: {Parameter: pEnd}
                  NullOption: NON_NULLS_ONLY
                  TimeGranularity: DAY
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-history
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-assettype-ov
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-assettype-ov
                  Column: {DataSetIdentifier: cur, ColumnName: asset_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-overview
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-severity-ov
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-severity-ov
                  Column: {DataSetIdentifier: cur, ColumnName: severity}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-overview
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-finding-ov
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-finding-ov
                  Column: {DataSetIdentifier: cur, ColumnName: finding_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-overview
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-assettype-fd
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-assettype-fd
                  Column: {DataSetIdentifier: cur, ColumnName: asset_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-findings
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-severity-fd
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-severity-fd
                  Column: {DataSetIdentifier: cur, ColumnName: severity}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-findings
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-finding-fd
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-finding-fd
                  Column: {DataSetIdentifier: cur, ColumnName: finding_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-findings
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-assettype-ow
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-assettype-ow
                  Column: {DataSetIdentifier: cur, ColumnName: asset_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-ownership
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-severity-ow
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-severity-ow
                  Column: {DataSetIdentifier: cur, ColumnName: severity}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-ownership
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-finding-ow
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-finding-ow
                  Column: {DataSetIdentifier: cur, ColumnName: finding_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-ownership
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-assettype-hs
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-assettype-hs
                  Column: {DataSetIdentifier: cur, ColumnName: asset_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-history
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-severity-hs
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-severity-hs
                  Column: {DataSetIdentifier: cur, ColumnName: severity}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-history
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-finding-hs
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-finding-hs
                  Column: {DataSetIdentifier: cur, ColumnName: finding_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-history
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-high-only-sh-overview
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-high-only-sh-overview
                  Column: {DataSetIdentifier: cur, ColumnName: severity}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      CategoryValues: ['HIGH']
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-overview
                    Scope: SELECTED_VISUALS
                    VisualIds: [ov-tbl-oldest-high]
          - FilterGroupId: fg-high-only-sh-findings
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-high-only-sh-findings
                  Column: {DataSetIdentifier: cur, ColumnName: severity}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      CategoryValues: ['HIGH']
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-findings
                    Scope: SELECTED_VISUALS
                    VisualIds: [fd-tbl-high]
          - FilterGroupId: fg-medium-only-sh-findings
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-medium-only-sh-findings
                  Column: {DataSetIdentifier: cur, ColumnName: severity}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      CategoryValues: ['MEDIUM']
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-findings
                    Scope: SELECTED_VISUALS
                    VisualIds: [fd-tbl-medium]
          - FilterGroupId: fg-low-only-sh-findings
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-low-only-sh-findings
                  Column: {DataSetIdentifier: cur, ColumnName: severity}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      CategoryValues: ['LOW']
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-findings
                    Scope: SELECTED_VISUALS
                    VisualIds: [fd-tbl-low]
          - FilterGroupId: fg-single-owner-sh-ownership
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-single-owner-sh-ownership
                  Column: {DataSetIdentifier: cur, ColumnName: finding_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      CategoryValues: ['SINGLE_ACTIVE_OWNER']
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-ownership
                    Scope: SELECTED_VISUALS
                    VisualIds: [ow-tbl-single]
          - FilterGroupId: fg-recovered-only-sh-history
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-recovered-only-sh-history
                  Column: {DataSetIdentifier: hist, ColumnName: finding_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      CategoryValues: ['RECOVERED']
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-history
                    Scope: SELECTED_VISUALS
                    VisualIds: [hs-tbl-recovered]
        Sheets:
          - SheetId: sh-overview
            Name: 'Overview'
            Title: 'Asset ownership - overview'
            Description: 'Latest daily scan: who owns every Quick asset, which assets nobody can manage, and which are one departure from being orphaned.'
            ParameterControls:
              - DateTimePicker:
                  ParameterControlId: pc-ov-start
                  Title: 'From'
                  SourceParameterName: pStart
                  DisplayOptions: {DateTimeFormat: 'YYYY-MM-DD'}
              - DateTimePicker:
                  ParameterControlId: pc-ov-end
                  Title: 'To (exclusive)'
                  SourceParameterName: pEnd
                  DisplayOptions: {DateTimeFormat: 'YYYY-MM-DD'}
            FilterControls:
              - Dropdown:
                  FilterControlId: fc-ov-assettype
                  Title: 'Asset type'
                  SourceFilterId: f-assettype-ov
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
              - Dropdown:
                  FilterControlId: fc-ov-severity
                  Title: 'Severity'
                  SourceFilterId: f-severity-ov
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
              - Dropdown:
                  FilterControlId: fc-ov-finding
                  Title: 'Finding'
                  SourceFilterId: f-finding-ov
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
            SheetControlLayouts:
              - Configuration:
                  GridLayout:
                    Elements:
                      - {ElementId: pc-ov-start, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: pc-ov-end, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-ov-assettype, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-ov-severity, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-ov-finding, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
            Visuals:
              - KPIVisual:
                  VisualId: ov-kpi-assets
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Assets scanned'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-assets-v, Column: {DataSetIdentifier: cur, ColumnName: asset_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-orphaned
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Orphaned (HIGH)'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-orphaned-v, Column: {DataSetIdentifier: cur, ColumnName: orphaned_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-high
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'HIGH findings'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-high-v, Column: {DataSetIdentifier: cur, ColumnName: high_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-medium
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'MEDIUM findings'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:

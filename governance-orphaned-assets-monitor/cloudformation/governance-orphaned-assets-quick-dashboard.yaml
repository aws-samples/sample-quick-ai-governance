                          - CategoricalDimensionField: {FieldId: ow-pivot-col, Column: {DataSetIdentifier: cur, ColumnName: finding_type}}
                        Values:
                          - NumericalMeasureField: {FieldId: ow-pivot-val, Column: {DataSetIdentifier: cur, ColumnName: asset_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                    TotalOptions:
                      RowTotalOptions: {TotalsVisibility: VISIBLE}
                      ColumnTotalOptions: {TotalsVisibility: VISIBLE}
              - TableVisual:
                  VisualId: ow-tbl-single
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Single-owner assets - add a co-owner before the owner leaves'}}
                  Subtitle: {Visibility: VISIBLE, FormatText: {PlainText: 'Quick never deletes an asset that has more than one owner when a user is removed'}}
                  ChartConfiguration:
                    FieldWells:
                      TableAggregatedFieldWells:
                        GroupBy:
                          - CategoricalDimensionField: {FieldId: ow-tbl-single-g0, Column: {DataSetIdentifier: cur, ColumnName: asset_type}}
                          - CategoricalDimensionField: {FieldId: ow-tbl-single-g1, Column: {DataSetIdentifier: cur, ColumnName: asset_name}}
                          - CategoricalDimensionField: {FieldId: ow-tbl-single-g2, Column: {DataSetIdentifier: cur, ColumnName: asset_id}}
                        Values:
                          - NumericalMeasureField: {FieldId: ow-tbl-single-m0, Column: {DataSetIdentifier: cur, ColumnName: viewers_total}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}
                          - NumericalMeasureField: {FieldId: ow-tbl-single-m1, Column: {DataSetIdentifier: cur, ColumnName: days_open}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}
                          - DateMeasureField: {FieldId: ow-tbl-single-m2, Column: {DataSetIdentifier: cur, ColumnName: first_observed_at}, AggregationFunction: MIN, FormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm'}}
                    SortConfiguration:
                      RowSort:
                        - FieldSort: {FieldId: ow-tbl-single-m0, Direction: DESC}
                    FieldOptions:
                      SelectedFieldOptions:
                        - {FieldId: ow-tbl-single-g0, CustomLabel: 'Type'}
                        - {FieldId: ow-tbl-single-g1, CustomLabel: 'Asset'}
                        - {FieldId: ow-tbl-single-g2, CustomLabel: 'Asset ID'}
                        - {FieldId: ow-tbl-single-m0, CustomLabel: 'Viewers'}
                        - {FieldId: ow-tbl-single-m1, CustomLabel: 'Days single-owned'}
                        - {FieldId: ow-tbl-single-m2, CustomLabel: 'Since'}
            Layouts:
              - Configuration:
                  GridLayout:
                    CanvasSizeOptions:
                      ScreenCanvasSizeOptions: {ResizeOption: FIXED, OptimizedViewPortWidth: '1600px'}
                    Elements:
                      - {ElementId: ow-tbl-coverage, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 36, RowIndex: 0, RowSpan: 9}
                      - {ElementId: ow-pivot, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 16, RowIndex: 9, RowSpan: 12}
                      - {ElementId: ow-tbl-single, ElementType: VISUAL, ColumnIndex: 16, ColumnSpan: 20, RowIndex: 9, RowSpan: 12}
          - SheetId: sh-history
            Name: 'History'
            Title: 'Scan history'
            Description: 'Daily scans over the selected period: how the finding ladder evolves and which HIGH findings were recovered.'
            ParameterControls:
              - DateTimePicker:
                  ParameterControlId: pc-hs-start
                  Title: 'From'
                  SourceParameterName: pStart
                  DisplayOptions: {DateTimeFormat: 'YYYY-MM-DD'}
              - DateTimePicker:
                  ParameterControlId: pc-hs-end
                  Title: 'To (exclusive)'
                  SourceParameterName: pEnd
                  DisplayOptions: {DateTimeFormat: 'YYYY-MM-DD'}
            FilterControls:
              - Dropdown:
                  FilterControlId: fc-hs-assettype
                  Title: 'Asset type'
                  SourceFilterId: f-assettype-hs
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
              - Dropdown:
                  FilterControlId: fc-hs-severity
                  Title: 'Severity'
                  SourceFilterId: f-severity-hs
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
              - Dropdown:
                  FilterControlId: fc-hs-finding
                  Title: 'Finding'
                  SourceFilterId: f-finding-hs
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
            SheetControlLayouts:
              - Configuration:
                  GridLayout:
                    Elements:
                      - {ElementId: pc-hs-start, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: pc-hs-end, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-hs-assettype, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-hs-severity, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-hs-finding, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
            Visuals:
              - LineChartVisual:
                  VisualId: hs-line-severity
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Findings per scan by severity'}}
                  ChartConfiguration:
                    FieldWells:
                      LineChartAggregatedFieldWells:
                        Category:
                          - DateDimensionField: {FieldId: hs-line-severity-cat, Column: {DataSetIdentifier: hist, ColumnName: scan_time}, DateGranularity: DAY}
                        Values:
                          - NumericalMeasureField: {FieldId: hs-line-severity-val, Column: {DataSetIdentifier: hist, ColumnName: high_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                        Colors:
                          - CategoricalDimensionField: {FieldId: hs-line-severity-color, Column: {DataSetIdentifier: hist, ColumnName: severity}}
                    Type: LINE
                    Legend: {Visibility: VISIBLE, Position: BOTTOM}
              - BarChartVisual:
                  VisualId: hs-bar-assets
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Assets scanned per day by type'}}
                  ChartConfiguration:
                    FieldWells:
                      BarChartAggregatedFieldWells:
                        Category:
                          - DateDimensionField: {FieldId: hs-bar-assets-cat, Column: {DataSetIdentifier: hist, ColumnName: scan_time}, DateGranularity: DAY}
                        Values:
                          - NumericalMeasureField: {FieldId: hs-bar-assets-val, Column: {DataSetIdentifier: hist, ColumnName: asset_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                        Colors:
                          - CategoricalDimensionField: {FieldId: hs-bar-assets-color, Column: {DataSetIdentifier: hist, ColumnName: asset_type}}
                    Orientation: VERTICAL
                    BarsArrangement: STACKED
                    Legend: {Visibility: VISIBLE, Position: BOTTOM}
              - TableVisual:
                  VisualId: hs-tbl-recovered
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Recovered findings'}}
                  Subtitle: {Visibility: VISIBLE, FormatText: {PlainText: 'HIGH findings that cleared after a complete scan - ownership restored or asset removed'}}
                  ChartConfiguration:
                    FieldWells:
                      TableAggregatedFieldWells:
                        GroupBy:
                          - CategoricalDimensionField: {FieldId: hs-tbl-recovered-g0, Column: {DataSetIdentifier: hist, ColumnName: asset_type}}
                          - CategoricalDimensionField: {FieldId: hs-tbl-recovered-g1, Column: {DataSetIdentifier: hist, ColumnName: asset_name}}
                          - CategoricalDimensionField: {FieldId: hs-tbl-recovered-g2, Column: {DataSetIdentifier: hist, ColumnName: recovered_from}}
                        Values:
                          - DateMeasureField: {FieldId: hs-tbl-recovered-m0, Column: {DataSetIdentifier: hist, ColumnName: scan_time}, AggregationFunction: MAX, FormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm'}}
                          - DateMeasureField: {FieldId: hs-tbl-recovered-m1, Column: {DataSetIdentifier: hist, ColumnName: first_observed_at}, AggregationFunction: MIN, FormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm'}}
                    SortConfiguration:
                      RowSort:
                        - FieldSort: {FieldId: hs-tbl-recovered-m0, Direction: DESC}
                    FieldOptions:
                      SelectedFieldOptions:
                        - {FieldId: hs-tbl-recovered-g0, CustomLabel: 'Type'}
                        - {FieldId: hs-tbl-recovered-g1, CustomLabel: 'Asset'}
                        - {FieldId: hs-tbl-recovered-g2, CustomLabel: 'Recovered from'}
                        - {FieldId: hs-tbl-recovered-m0, CustomLabel: 'Recovered on'}
                        - {FieldId: hs-tbl-recovered-m1, CustomLabel: 'First observed'}
              - TableVisual:
                  VisualId: hs-tbl-scans
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Scans'}}
                  ChartConfiguration:
                    FieldWells:
                      TableAggregatedFieldWells:
                        GroupBy:
                          - CategoricalDimensionField: {FieldId: hs-tbl-scans-g0, Column: {DataSetIdentifier: hist, ColumnName: scan_id}}
                          - CategoricalDimensionField: {FieldId: hs-tbl-scans-g1, Column: {DataSetIdentifier: hist, ColumnName: scan_status}}
                        Values:
                          - DateMeasureField: {FieldId: hs-tbl-scans-m0, Column: {DataSetIdentifier: hist, ColumnName: scan_time}, AggregationFunction: MAX, FormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm'}}
                          - NumericalMeasureField: {FieldId: hs-tbl-scans-m1, Column: {DataSetIdentifier: hist, ColumnName: asset_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}
                          - NumericalMeasureField: {FieldId: hs-tbl-scans-m2, Column: {DataSetIdentifier: hist, ColumnName: high_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}
                          - NumericalMeasureField: {FieldId: hs-tbl-scans-m3, Column: {DataSetIdentifier: hist, ColumnName: medium_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}
                          - NumericalMeasureField: {FieldId: hs-tbl-scans-m4, Column: {DataSetIdentifier: hist, ColumnName: recovered_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}, FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}}
                    SortConfiguration:
                      RowSort:
                        - FieldSort: {FieldId: hs-tbl-scans-m0, Direction: DESC}
                    FieldOptions:
                      SelectedFieldOptions:
                        - {FieldId: hs-tbl-scans-g0, CustomLabel: 'Scan'}
                        - {FieldId: hs-tbl-scans-g1, CustomLabel: 'Status'}
                        - {FieldId: hs-tbl-scans-m0, CustomLabel: 'Time'}
                        - {FieldId: hs-tbl-scans-m1, CustomLabel: 'Assets'}
                        - {FieldId: hs-tbl-scans-m2, CustomLabel: 'HIGH'}
                        - {FieldId: hs-tbl-scans-m3, CustomLabel: 'MEDIUM'}
                        - {FieldId: hs-tbl-scans-m4, CustomLabel: 'Recovered'}
            Layouts:
              - Configuration:
                  GridLayout:
                    CanvasSizeOptions:
                      ScreenCanvasSizeOptions: {ResizeOption: FIXED, OptimizedViewPortWidth: '1600px'}
                    Elements:
                      - {ElementId: hs-line-severity, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 18, RowIndex: 0, RowSpan: 11}
                      - {ElementId: hs-bar-assets, ElementType: VISUAL, ColumnIndex: 18, ColumnSpan: 18, RowIndex: 0, RowSpan: 11}
                      - {ElementId: hs-tbl-recovered, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 18, RowIndex: 11, RowSpan: 12}
                      - {ElementId: hs-tbl-scans, ElementType: VISUAL, ColumnIndex: 18, ColumnSpan: 18, RowIndex: 11, RowSpan: 12}
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}
        - {Key: ManagedBy, Value: CloudFormation}

Outputs:
  DashboardUrl:
    Description: Open the dashboard in Amazon Quick (this Region).
    Value: !Sub 'https://${AWS::Region}.quicksight.aws.amazon.com/sn/dashboards/${ResourcePrefix}-dashboard'

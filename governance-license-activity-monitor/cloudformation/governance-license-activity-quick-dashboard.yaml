AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS Quick license and activity monitor. Glue tables over the user, source
  and tier snapshots, Direct Query datasets, and a five-tab dashboard:
  Overview, Users, License fit, Evidence, History.
  Requires the governance analytics foundation and the license-activity module.

Parameters:
  ResourcePrefix:
    Type: String
    Default: 'quick-governance-license-activity'
    AllowedPattern: '^[a-z0-9-]{1,40}$'
  FoundationStackName:
    Type: String
    Default: 'quick-governance-analytics-foundation'
  QuickPrincipalArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:quicksight:[a-z0-9-]+:[0-9]{12}:(user|group)/.+$'
  UsersPrefix:
    Type: String
    Default: 'license-activity/users/'
  SourcesPrefix:
    Type: String
    Default: 'license-activity/sources/'
  TiersPrefix:
    Type: String
    Default: 'license-activity/tiers/'

Resources:
  UsersTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseName: {Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'}
      TableInput:
        Name: license_activity_users
        TableType: EXTERNAL_TABLE
        Parameters: {classification: json, EXTERNAL: 'TRUE'}
        StorageDescriptor:
          Location: !Sub
            - 's3://${Bucket}/${UsersPrefix}'
            - Bucket: {Fn::ImportValue: !Sub '${FoundationStackName}-AnalyticsBucket'}
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters: {ignore.malformed.json: 'true', case.insensitive: 'true'}
          Columns:
            - {Name: ts, Type: string}
            - {Name: userarn, Type: string}
            - {Name: username, Type: string}
            - {Name: role, Type: string}
            - {Name: identitytype, Type: string}
            - {Name: active, Type: string}
            - {Name: assetstate, Type: string}
            - {Name: lastactivityat, Type: string}
            - {Name: lastactivitysource, Type: string}
            - {Name: lastactivitycategory, Type: string}
            - {Name: dayssinceactivity, Type: int}
            - {Name: lastsigninat, Type: string}
            - {Name: coveragestart, Type: string}
            - {Name: coveragedays, Type: int}
            - {Name: usagestate, Type: string}
            - {Name: unknownreason, Type: string}
            - {Name: recheckafter, Type: string}
            - {Name: assetsowned, Type: int}
            - {Name: assetsownedalone, Type: int}
            - {Name: removalreadiness, Type: string}
            - {Name: peakhours, Type: double}
            - {Name: hoursconfidence, Type: string}
            - {Name: currenttier, Type: string}
            - {Name: listpriceusd, Type: double}
            - {Name: candidatetier, Type: string}
            - {Name: candidatepriceusd, Type: double}
            - {Name: savingusd, Type: double}
            - {Name: changepath, Type: string}
            - {Name: savingfrom, Type: string}
            - {Name: authoringcount, Type: int}
            - {Name: didauthoring, Type: int}
            - {Name: didai, Type: int}
            - {Name: didviewing, Type: int}
            - {Name: didadministration, Type: int}

  SourcesTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseName: {Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'}
      TableInput:
        Name: license_activity_sources
        TableType: EXTERNAL_TABLE
        Parameters: {classification: json, EXTERNAL: 'TRUE'}
        StorageDescriptor:
          Location: !Sub
            - 's3://${Bucket}/${SourcesPrefix}'
            - Bucket: {Fn::ImportValue: !Sub '${FoundationStackName}-AnalyticsBucket'}
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters: {ignore.malformed.json: 'true', case.insensitive: 'true'}
          Columns:
            - {Name: ts, Type: string}
            - {Name: source, Type: string}
            - {Name: newestrecordat, Type: string}
            - {Name: coveragestart, Type: string}
            - {Name: coveragedays, Type: int}
            - {Name: gapdays30, Type: int}
            - {Name: status, Type: string}

  TiersTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseName: {Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'}
      TableInput:
        Name: license_activity_tiers
        TableType: EXTERNAL_TABLE
        Parameters: {classification: json, EXTERNAL: 'TRUE'}
        StorageDescriptor:
          Location: !Sub
            - 's3://${Bucket}/${TiersPrefix}'
            - Bucket: {Fn::ImportValue: !Sub '${FoundationStackName}-AnalyticsBucket'}
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters: {ignore.malformed.json: 'true', case.insensitive: 'true'}
          Columns:
            - {Name: ts, Type: string}
            - {Name: userarn, Type: string}
            - {Name: username, Type: string}
            - {Name: tier, Type: string}
            - {Name: listpriceusd, Type: double}
            - {Name: includedhours, Type: double}
            - {Name: coversuse, Type: string}
            - {Name: costusd, Type: double}

  UsersDataSet:
    Type: AWS::QuickSight::DataSet
    DependsOn: UsersTable
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DataSetId: !Sub '${ResourcePrefix}-users'
      Name: AWS Quick governance - license activity users
      ImportMode: DIRECT_QUERY
      PhysicalTableMap:
        users:
          CustomSql:
            DataSourceArn: {Fn::ImportValue: !Sub '${FoundationStackName}-QuickDataSourceArn'}
            Name: license_users
            SqlQuery: !Sub
              - |
                WITH ranked AS (
                  SELECT u.*, row_number() OVER (PARTITION BY userarn ORDER BY ts DESC) AS rn
                  FROM "${Db}"."license_activity_users" u WHERE ts IS NOT NULL
                ),
                latest AS (
                  SELECT * FROM ranked WHERE rn = 1 AND COALESCE(assetstate, 'ACTIVE') <> 'DELETED'
                )
                SELECT
                  from_iso8601_timestamp(u.ts) AS scan_time,
                  'Latest' AS scan_label,
                  u.userarn AS user_arn,
                  COALESCE(u.username, u.userarn) AS user_name,
                  COALESCE(u.role, '') AS role,
                  COALESCE(u.identitytype, '') AS identity_type,
                  COALESCE(u.active, 'true') AS active_flag,
                  TRY(from_iso8601_timestamp(u.lastactivityat)) AS last_activity_at,
                  COALESCE(u.lastactivitysource, '') AS activity_source,
                  COALESCE(u.lastactivitycategory, '') AS activity_category,
                  TRY(from_iso8601_timestamp(u.lastsigninat)) AS last_sign_in_at,
                  TRY(from_iso8601_timestamp(u.coveragestart)) AS coverage_start,
                  COALESCE(u.coveragedays, 0) AS coverage_days,
                  COALESCE(u.assetsowned, 0) AS assets_owned,
                  COALESCE(u.assetsownedalone, 0) AS assets_owned_alone,
                  COALESCE(u.removalreadiness, '') AS removal_readiness,
                  u.peakhours AS peak_hours,
                  COALESCE(u.hoursconfidence, '') AS hours_confidence,
                  COALESCE(u.currenttier, '') AS current_tier,
                  u.listpriceusd AS list_price_usd,
                  COALESCE(u.candidatetier, '') AS candidate_tier,
                  u.candidatepriceusd AS candidate_price_usd,
                  u.savingusd AS saving_usd,
                  COALESCE(u.changepath, '') AS change_path,
                  COALESCE(u.savingfrom, '') AS saving_from,
                  COALESCE(u.authoringcount, 0) AS authoring_count,
                  COALESCE(u.didauthoring, 0) AS did_authoring,
                  COALESCE(u.didai, 0) AS did_ai,
                  COALESCE(u.didviewing, 0) AS did_viewing,
                  COALESCE(u.didadministration, 0) AS did_administration,
                  CASE WHEN u.savingusd > 0 THEN 1 ELSE 0 END AS candidate_count,
                  CASE WHEN u.peakhours > t.includedhours THEN 1 ELSE 0 END AS above_included,
                  1 AS user_count
                FROM latest u
                LEFT JOIN "${Db}"."license_activity_tiers" t
                  ON t.userarn = u.userarn AND t.ts = u.ts AND t.tier = u.currenttier
              - Db: {Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'}
            Columns:
              - {Name: scan_time, Type: DATETIME}
              - {Name: scan_label, Type: STRING}
              - {Name: user_arn, Type: STRING}
              - {Name: user_name, Type: STRING}
              - {Name: role, Type: STRING}
              - {Name: identity_type, Type: STRING}
              - {Name: active_flag, Type: STRING}
              - {Name: last_activity_at, Type: DATETIME}
              - {Name: activity_source, Type: STRING}
              - {Name: activity_category, Type: STRING}
              - {Name: last_sign_in_at, Type: DATETIME}
              - {Name: coverage_start, Type: DATETIME}
              - {Name: coverage_days, Type: INTEGER}
              - {Name: assets_owned, Type: INTEGER}
              - {Name: assets_owned_alone, Type: INTEGER}
              - {Name: removal_readiness, Type: STRING}
              - {Name: peak_hours, Type: DECIMAL}
              - {Name: hours_confidence, Type: STRING}
              - {Name: current_tier, Type: STRING}
              - {Name: list_price_usd, Type: DECIMAL}
              - {Name: candidate_tier, Type: STRING}
              - {Name: candidate_price_usd, Type: DECIMAL}
              - {Name: saving_usd, Type: DECIMAL}
              - {Name: change_path, Type: STRING}
              - {Name: saving_from, Type: STRING}
              - {Name: authoring_count, Type: INTEGER}
              - {Name: did_authoring, Type: INTEGER}
              - {Name: did_ai, Type: INTEGER}
              - {Name: did_viewing, Type: INTEGER}
              - {Name: did_administration, Type: INTEGER}
              - {Name: candidate_count, Type: INTEGER}
              - {Name: above_included, Type: INTEGER}
              - {Name: user_count, Type: INTEGER}
      LogicalTableMap:
        users:
          Alias: license_users
          Source: {PhysicalTableId: users}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDataSet, quicksight:DescribeDataSetPermissions, quicksight:PassDataSet, quicksight:DescribeIngestion, quicksight:ListIngestions, quicksight:UpdateDataSet, quicksight:DeleteDataSet, quicksight:CreateIngestion, quicksight:CancelIngestion, quicksight:UpdateDataSetPermissions]
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}

  SourcesDataSet:
    Type: AWS::QuickSight::DataSet
    DependsOn: SourcesTable
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DataSetId: !Sub '${ResourcePrefix}-sources'
      Name: AWS Quick governance - license activity sources
      ImportMode: DIRECT_QUERY
      PhysicalTableMap:
        sources:
          CustomSql:
            DataSourceArn: {Fn::ImportValue: !Sub '${FoundationStackName}-QuickDataSourceArn'}
            Name: license_sources
            SqlQuery: !Sub
              - |
                WITH ranked AS (
                  SELECT s.*, row_number() OVER (PARTITION BY source ORDER BY ts DESC) AS rn
                  FROM "${Db}"."license_activity_sources" s WHERE ts IS NOT NULL
                )
                SELECT
                  from_iso8601_timestamp(ts) AS scan_time,
                  source,
                  TRY(from_iso8601_timestamp(newestrecordat)) AS newest_record_at,
                  TRY(from_iso8601_timestamp(coveragestart)) AS coverage_start,
                  COALESCE(coveragedays, 0) AS coverage_days,
                  COALESCE(gapdays30, 0) AS gap_days_30,
                  COALESCE(status, '') AS status
                FROM ranked WHERE rn = 1
              - Db: {Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'}
            Columns:
              - {Name: scan_time, Type: DATETIME}
              - {Name: source, Type: STRING}
              - {Name: newest_record_at, Type: DATETIME}
              - {Name: coverage_start, Type: DATETIME}
              - {Name: coverage_days, Type: INTEGER}
              - {Name: gap_days_30, Type: INTEGER}
              - {Name: status, Type: STRING}
      LogicalTableMap:
        sources:
          Alias: license_sources
          Source: {PhysicalTableId: sources}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDataSet, quicksight:DescribeDataSetPermissions, quicksight:PassDataSet, quicksight:DescribeIngestion, quicksight:ListIngestions, quicksight:UpdateDataSet, quicksight:DeleteDataSet, quicksight:CreateIngestion, quicksight:CancelIngestion, quicksight:UpdateDataSetPermissions]
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}

  TiersDataSet:
    Type: AWS::QuickSight::DataSet
    DependsOn: TiersTable
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DataSetId: !Sub '${ResourcePrefix}-tiers'
      Name: AWS Quick governance - license activity tiers
      ImportMode: DIRECT_QUERY
      PhysicalTableMap:
        tiers:
          CustomSql:
            DataSourceArn: {Fn::ImportValue: !Sub '${FoundationStackName}-QuickDataSourceArn'}
            Name: license_tiers
            SqlQuery: !Sub
              - |
                WITH ranked AS (
                  SELECT t.*, row_number() OVER (PARTITION BY userarn, tier ORDER BY ts DESC) AS rn
                  FROM "${Db}"."license_activity_tiers" t WHERE ts IS NOT NULL
                )
                SELECT
                  from_iso8601_timestamp(ts) AS scan_time,
                  userarn AS user_arn,
                  COALESCE(username, userarn) AS user_name,
                  tier,
                  listpriceusd AS list_price_usd,
                  includedhours AS included_hours,
                  COALESCE(coversuse, 'false') AS covers_use,
                  costusd AS cost_usd
                FROM ranked WHERE rn = 1
              - Db: {Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'}
            Columns:
              - {Name: scan_time, Type: DATETIME}
              - {Name: user_arn, Type: STRING}
              - {Name: user_name, Type: STRING}
              - {Name: tier, Type: STRING}
              - {Name: list_price_usd, Type: DECIMAL}
              - {Name: included_hours, Type: DECIMAL}
              - {Name: covers_use, Type: STRING}
              - {Name: cost_usd, Type: DECIMAL}
      LogicalTableMap:
        tiers:
          Alias: license_tiers
          Source: {PhysicalTableId: tiers}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDataSet, quicksight:DescribeDataSetPermissions, quicksight:PassDataSet, quicksight:DescribeIngestion, quicksight:ListIngestions, quicksight:UpdateDataSet, quicksight:DeleteDataSet, quicksight:CreateIngestion, quicksight:CancelIngestion, quicksight:UpdateDataSetPermissions]
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}

  HistoryDataSet:
    Type: AWS::QuickSight::DataSet
    DependsOn: UsersTable
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DataSetId: !Sub '${ResourcePrefix}-history'
      Name: AWS Quick governance - license activity history
      ImportMode: DIRECT_QUERY
      PhysicalTableMap:
        history:
          CustomSql:
            DataSourceArn: {Fn::ImportValue: !Sub '${FoundationStackName}-QuickDataSourceArn'}
            Name: license_history
            SqlQuery: !Sub
              - |
                WITH latest AS (
                  SELECT userarn, substr(ts, 1, 10) AS day, max(ts) AS ts
                  FROM "${Db}"."license_activity_users"
                  WHERE ts IS NOT NULL AND COALESCE(assetstate, 'ACTIVE') <> 'DELETED'
                  GROUP BY userarn, substr(ts, 1, 10)
                )
                SELECT
                  from_iso8601_timestamp(u.ts) AS scan_time,
                  CASE WHEN u.usagestate = 'IDLE' THEN 1 ELSE 0 END AS idle_count,
                  CASE WHEN u.savingusd > 0 THEN 1 ELSE 0 END AS candidate_count,
                  COALESCE(u.savingusd, 0) AS saving_usd
                FROM "${Db}"."license_activity_users" u
                JOIN latest l ON u.userarn = l.userarn AND u.ts = l.ts
              - Db: {Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'}
            Columns:
              - {Name: scan_time, Type: DATETIME}
              - {Name: idle_count, Type: INTEGER}
              - {Name: candidate_count, Type: INTEGER}
              - {Name: saving_usd, Type: DECIMAL}
      LogicalTableMap:
        history:
          Alias: license_history
          Source: {PhysicalTableId: history}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDataSet, quicksight:DescribeDataSetPermissions, quicksight:PassDataSet, quicksight:DescribeIngestion, quicksight:ListIngestions, quicksight:UpdateDataSet, quicksight:DeleteDataSet, quicksight:CreateIngestion, quicksight:CancelIngestion, quicksight:UpdateDataSetPermissions]
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}

  Dashboard:
    Type: AWS::QuickSight::Dashboard
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DashboardId: !Sub '${ResourcePrefix}-dashboard'
      Name: AWS Quick - license and activity
      VersionDescription: Overview, Users, License fit, Evidence, History.
      DashboardPublishOptions:
        AdHocFilteringOption: {AvailabilityStatus: ENABLED}
        ExportToCSVOption: {AvailabilityStatus: ENABLED}
        SheetControlsOption: {VisibilityState: EXPANDED}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions: [quicksight:DescribeDashboard, quicksight:ListDashboardVersions, quicksight:UpdateDashboardPermissions, quicksight:QueryDashboard, quicksight:UpdateDashboard, quicksight:DeleteDashboard, quicksight:DescribeDashboardPermissions, quicksight:UpdateDashboardPublishedVersion]
      Definition: # GENERATED
        DataSetIdentifierDeclarations:
          - Identifier: users
            DataSetArn: !GetAtt UsersDataSet.Arn
          - Identifier: sources
            DataSetArn: !GetAtt SourcesDataSet.Arn
          - Identifier: tiers
            DataSetArn: !GetAtt TiersDataSet.Arn
          - Identifier: hist
            DataSetArn: !GetAtt HistoryDataSet.Arn
        ParameterDeclarations:
          - StringParameterDeclaration:
              Name: pIdleDays
              ParameterValueType: SINGLE_VALUED
              DefaultValues:
                StaticValues: ['60']
        CalculatedFields:
          - DataSetIdentifier: users
            Name: usage_state
            Expression: 'ifelse({active_flag} = ''false'', ''PENDING'', ifelse(isNotNull({last_activity_at}) AND dateDiff({last_activity_at}, now(), ''DD'') <= parseInt(${pIdleDays}), ''ACTIVE'', ifelse(dateDiff({coverage_start}, now(), ''DD'') >= parseInt(${pIdleDays}), ''IDLE'', ''UNKNOWN'')))'
          - DataSetIdentifier: users
            Name: active_id
            Expression: 'ifelse({usage_state} = ''ACTIVE'', {user_arn}, NULL)'
          - DataSetIdentifier: users
            Name: idle_id
            Expression: 'ifelse({usage_state} = ''IDLE'', {user_arn}, NULL)'
          - DataSetIdentifier: users
            Name: pending_id
            Expression: 'ifelse({usage_state} = ''PENDING'', {user_arn}, NULL)'
          - DataSetIdentifier: users
            Name: unknown_id
            Expression: 'ifelse({usage_state} = ''UNKNOWN'', {user_arn}, NULL)'
          - DataSetIdentifier: users
            Name: staleness
            Expression: 'ifelse(isNull({last_activity_at}), 999999, dateDiff({last_activity_at}, now(), ''DD''))'
          - DataSetIdentifier: users
            Name: days_now
            Expression: 'ifelse(isNull({last_activity_at}), NULL, dateDiff({last_activity_at}, now(), ''DD''))'
          - DataSetIdentifier: users
            Name: saving_now
            Expression: 'ifelse({usage_state} = ''ACTIVE'', ifelse(isNull({saving_usd}), 0, {saving_usd}), 0)'
          - DataSetIdentifier: users
            Name: days_bucket
            Expression: 'ifelse(isNull({last_activity_at}), ''no activity'', ifelse(dateDiff({last_activity_at}, now(), ''DD'') <= 7, ''0-7'', ifelse(dateDiff({last_activity_at}, now(), ''DD'') <= 30, ''8-30'', ifelse(dateDiff({last_activity_at}, now(), ''DD'') <= 60, ''31-60'', ifelse(dateDiff({last_activity_at}, now(), ''DD'') <= 90, ''61-90'', ''over 90'')))))'
        FilterGroups:
          - FilterGroupId: fg-state-ov
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-state-ov
                  Column: {DataSetIdentifier: users, ColumnName: usage_state}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-overview
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-role-us
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-role-us
                  Column: {DataSetIdentifier: users, ColumnName: role}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-users
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-identity-us
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-identity-us
                  Column: {DataSetIdentifier: users, ColumnName: identity_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-users
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-state-us
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-state-us
                  Column: {DataSetIdentifier: users, ColumnName: usage_state}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-users
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-role-lf
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-role-lf
                  Column: {DataSetIdentifier: users, ColumnName: role}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-license
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-user-lf
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-user-lf
                  Column: {DataSetIdentifier: tiers, ColumnName: user_name}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-license
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-pending-sh-users
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-pending-sh-users
                  Column: {DataSetIdentifier: users, ColumnName: usage_state}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      CategoryValues: ['PENDING']
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-users
                    Scope: SELECTED_VISUALS
                    VisualIds: [us-tbl-pending]
          - FilterGroupId: fg-active-fit-sh-license
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-active-fit-sh-license
                  Column: {DataSetIdentifier: users, ColumnName: usage_state}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      CategoryValues: ['ACTIVE']
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-license
                    Scope: SELECTED_VISUALS
                    VisualIds: [lf-tbl-fit]
        Sheets:
          - SheetId: sh-overview
            Name: 'Overview'
            Title: 'License and activity - overview'
            Description: 'Who is not using a license, and what would right-sizing save?'
            ParameterControls:
              - Dropdown:
                  ParameterControlId: pc-ov-pIdleDays
                  Title: 'Idle after (days)'
                  SourceParameterName: pIdleDays
                  Type: SINGLE_SELECT
                  SelectableValues:
                    Values: ['30', '60', '90', '180']
                  DisplayOptions:
                    SelectAllOptions: {Visibility: HIDDEN}
                    TitleOptions: {Visibility: VISIBLE}
            FilterControls:
              - Dropdown:
                  FilterControlId: fc-ov-state
                  Title: 'State'
                  SourceFilterId: f-state-ov
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
            SheetControlLayouts:
              - Configuration:
                  GridLayout:
                    Elements:
                      - {ElementId: pc-ov-pIdleDays, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-ov-state, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
            Visuals:
              - KPIVisual:

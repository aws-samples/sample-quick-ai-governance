AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Amazon Quick agent-hours usage monitor. Delivers the Quick AGENT_HOURS_LOGS
  vended-log feed to the shared analytics bucket created by the Analytics
  Foundation stack, under the agent-hours/ prefix, where the module's Amazon
  Quick dashboard (governance-agent-hours-quick-dashboard.yaml) reads it through
  Athena. Assumes the Quick subscription is in the same AWS account as this stack.

# Prerequisites (NOT created by this stack):
#   * The Analytics Foundation stack (../../governance-analytics-foundation) in
#     this account and Region. Its AnalyticsBucketName output is this template's
#     AnalyticsBucketName parameter (the apply script resolves it for you); its
#     bucket policy already lets delivery.logs.amazonaws.com write agent-hours/.
#   * Quick AI features enabled (Enterprise or Professional subscription).
#   * The deploying principal must hold the IAM permission
#     quicksight:AllowVendedLogDeliveryForResource on the Quick account.
#
# Cross-account delivery (Quick in a different account) needs an extra
# delivery-destination policy and is out of scope for this template.
#
# Deploy with scripts/apply-governance-agent-hours-monitor.sh (deploys this
# stack and the Quick dashboard), or directly:
#   aws cloudformation deploy \
#       --stack-name quick-governance-agent-hours-monitor \
#       --template-file governance-agent-hours-monitor.yaml --region <REGION> \
#       --parameter-overrides AnalyticsBucketName=<foundation bucket>

Parameters:
  ResourcePrefix:
    Type: String
    Default: 'quick-governance-agent-hours-monitor'
    Description: Prefix applied to every resource name (lowercase, DNS-safe).
    AllowedPattern: '^[a-z0-9-]{1,40}$'
    ConstraintDescription: 1-40 chars, lowercase letters, digits, hyphens.

  AnalyticsBucketName:
    Type: String
    Description: >
      Shared analytics bucket created by the Analytics Foundation stack (its
      AnalyticsBucketName output). The feed lands under agent-hours/.
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: An existing S3 bucket name (3-63 chars).

  S3HiveCompatiblePath:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Write S3 objects under Hive-style key=value partitions (Athena partition
      projection, no crawler). Set to false to keep the legacy
      AWSLogs/<account-id>/... layout, for example when an existing Athena table
      or pipeline already reads that layout. The Quick dashboard's Glue table
      reads the whole agent-hours/ prefix, so either layout works for it.

Conditions:
  WithHivePath: !Equals [!Ref S3HiveCompatiblePath, 'true']

Resources:
  # ----- Vended-log delivery: Quick AGENT_HOURS_LOGS -> shared bucket ---------
  DeliverySource:
    Type: AWS::Logs::DeliverySource
    Properties:
      Name: !Sub '${ResourcePrefix}-source'
      LogType: AGENT_HOURS_LOGS
      ResourceArn: !Sub 'arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:account/${AWS::AccountId}'
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  # Logical IDs and names are those of the shared-bucket variant of the previous
  # release, so existing stacks update the live delivery in place.
  S3DeliveryDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: !Sub '${ResourcePrefix}-shared-s3-dest'
      DeliveryDestinationType: S3
      DestinationResourceArn: !Sub 'arn:${AWS::Partition}:s3:::${AnalyticsBucketName}/agent-hours'
      OutputFormat: json
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  S3DeliverySharedBucket:
    Type: AWS::Logs::Delivery
    DependsOn: DeliverySource
    Properties:
      DeliverySourceName: !Sub '${ResourcePrefix}-source'
      DeliveryDestinationArn: !GetAtt S3DeliveryDestination.Arn
      S3EnableHiveCompatiblePath: !If [WithHivePath, true, false]
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

Outputs:
  DeliverySourceName:
    Description: CloudWatch Logs delivery source for the Quick agent-hours feed.
    Value: !Sub '${ResourcePrefix}-source'
    Export:
      Name: !Sub '${AWS::StackName}-DeliverySource'

  LogBucketName:
    Description: Shared analytics bucket receiving the agent-hours feed.
    Value: !Ref AnalyticsBucketName
    Export:
      Name: !Sub '${AWS::StackName}-LogBucket'

  S3DataLocation:
    Description: >
      S3 prefix under which the feed lands (the Quick dashboard's Glue table
      location). Objects are partitioned per S3HiveCompatiblePath.
    Value: !Sub 's3://${AnalyticsBucketName}/agent-hours/'

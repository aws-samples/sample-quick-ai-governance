  DataSetArn:
    Description: Quick dataset (Direct Query).
    Value: !GetAtt DataSet.Arn

  DashboardUrl:
    Description: Open the dashboard in Amazon Quick (this Region).
    Value: !Sub 'https://${AWS::Region}.quicksight.aws.amazon.com/sn/dashboards/${ResourcePrefix}-dashboard'

                      CategorySort:
                        - FieldSort: {FieldId: us-tb-n, Direction: DESC}
                      CategoryItemsLimit: {ItemsLimit: 15, OtherCategories: EXCLUDE}
                    Orientation: HORIZONTAL
                    BarsArrangement: STACKED
                    Legend: {Visibility: VISIBLE, Position: BOTTOM}
            Layouts:
              - Configuration:
                  GridLayout:
                    CanvasSizeOptions:
                      ScreenCanvasSizeOptions: {ResizeOption: FIXED, OptimizedViewPortWidth: '1600px'}
                    Elements:
                      - {ElementId: us-tbl-users, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 36, RowIndex: 0, RowSpan: 13}
                      - {ElementId: us-pivot-agents, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 22, RowIndex: 13, RowSpan: 13}
                      - {ElementId: us-bar-top, ElementType: VISUAL, ColumnIndex: 22, ColumnSpan: 14, RowIndex: 13, RowSpan: 13}

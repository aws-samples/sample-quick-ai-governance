                  VisualId: ag-bar-scope
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Messages by agent and data scope'}}
                  Subtitle: {Visibility: VISIBLE, FormatText: {PlainText: 'message_scope - which resources the answer could draw on'}}
                  ChartConfiguration:
                    FieldWells:
                      BarChartAggregatedFieldWells:
                        Category:
                          - CategoricalDimensionField: {FieldId: ag-sc-agent, Column: {DataSetIdentifier: chat, ColumnName: agent_label}}
                        Values:
                          - NumericalMeasureField: {FieldId: ag-sc-n, Column: {DataSetIdentifier: chat, ColumnName: message_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                        Colors:
                          - CategoricalDimensionField: {FieldId: ag-sc-scope, Column: {DataSetIdentifier: chat, ColumnName: message_scope}}
                    SortConfiguration:
                      CategorySort:
                        - FieldSort: {FieldId: ag-sc-n, Direction: DESC}
                    Orientation: HORIZONTAL
                    BarsArrangement: STACKED
                    Legend: {Visibility: VISIBLE, Position: BOTTOM}
            Layouts:
              - Configuration:
                  GridLayout:
                    CanvasSizeOptions:
                      ScreenCanvasSizeOptions: {ResizeOption: FIXED, OptimizedViewPortWidth: '1600px'}
                    Elements:
                      - {ElementId: ag-tbl-agents, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 36, RowIndex: 0, RowSpan: 12}
                      - {ElementId: ag-tbl-sentiment, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 16, RowIndex: 12, RowSpan: 12}
                      - {ElementId: ag-bar-scope, ElementType: VISUAL, ColumnIndex: 16, ColumnSpan: 20, RowIndex: 12, RowSpan: 12}
          # ===================== Quality =====================
          - SheetId: sh-quality
            Name: Quality
            Title: Quality
            Description: "Response outcomes, latency and feedback. Content stays in CloudWatch Logs; use the correlation IDs to investigate."
            ParameterControls:
              - DateTimePicker:
                  ParameterControlId: pc-qa-start
                  Title: From
                  SourceParameterName: pStart
                  DisplayOptions: {DateTimeFormat: 'YYYY-MM-DD'}
              - DateTimePicker:
                  ParameterControlId: pc-qa-end
                  Title: To (exclusive)
                  SourceParameterName: pEnd
                  DisplayOptions: {DateTimeFormat: 'YYYY-MM-DD'}
            FilterControls:
              - Dropdown:
                  FilterControlId: fc-qa-agent
                  Title: Agent
                  SourceFilterId: f-agent-qa
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
              - Dropdown:
                  FilterControlId: fc-qa-surface
                  Title: Surface
                  SourceFilterId: f-surface-qa
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
              - Dropdown:
                  FilterControlId: fc-qa-usertype
                  Title: User type
                  SourceFilterId: f-usertype-qa
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
            SheetControlLayouts:
              - Configuration:
                  GridLayout:
                    Elements:
                      - {ElementId: pc-qa-start, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: pc-qa-end, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-qa-agent, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-qa-surface, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-qa-usertype, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
            Visuals:
              - KPIVisual:
                  VisualId: qa-kpi-success
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Answered successfully'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField:
                            FieldId: qa-kpi-success-v
                            Column: {DataSetIdentifier: chat, ColumnName: success_rate}
                            FormatConfiguration: {FormatConfiguration: {PercentageDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 1}}}}
              - KPIVisual:
                  VisualId: qa-kpi-notsuccess
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Blocked or unanswered'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: qa-kpi-notsuccess-v, Column: {DataSetIdentifier: chat, ColumnName: not_success_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: qa-kpi-cited
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Answers with citations'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: qa-kpi-cited-v, Column: {DataSetIdentifier: chat, ColumnName: cited_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: qa-kpi-latency
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Avg latency (raw units)'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField:
                            FieldId: qa-kpi-latency-v
                            Column: {DataSetIdentifier: chat, ColumnName: latency}
                            AggregationFunction: {SimpleNumericalAggregation: AVERAGE}
                            FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}
              - KPIVisual:
                  VisualId: qa-kpi-ttft
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Avg time to first token (raw units)'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField:
                            FieldId: qa-kpi-ttft-v
                            Column: {DataSetIdentifier: chat, ColumnName: time_to_first_token}
                            AggregationFunction: {SimpleNumericalAggregation: AVERAGE}
                            FormatConfiguration: {FormatConfiguration: {NumberDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 0}}}}
              - KPIVisual:
                  VisualId: qa-kpi-satisfaction
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Satisfaction (up / rated)'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField:
                            FieldId: qa-kpi-satisfaction-v
                            Column: {DataSetIdentifier: feedback, ColumnName: satisfaction}
                            FormatConfiguration: {FormatConfiguration: {PercentageDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 1}}}}
              - TableVisual:
                  VisualId: qa-tbl-reasons
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Feedback reasons'}}
                  ChartConfiguration:
                    FieldWells:
                      TableAggregatedFieldWells:
                        GroupBy:
                          - CategoricalDimensionField: {FieldId: qa-rs-type, Column: {DataSetIdentifier: feedback, ColumnName: feedback_type}}
                          - CategoricalDimensionField: {FieldId: qa-rs-reason, Column: {DataSetIdentifier: feedback, ColumnName: feedback_reason}}
                        Values:
                          - NumericalMeasureField: {FieldId: qa-rs-n, Column: {DataSetIdentifier: feedback, ColumnName: feedback_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                          - CategoricalMeasureField: {FieldId: qa-rs-users, Column: {DataSetIdentifier: feedback, ColumnName: user_arn}, AggregationFunction: DISTINCT_COUNT}
                    SortConfiguration:
                      RowSort:
                        - FieldSort: {FieldId: qa-rs-n, Direction: DESC}
                    FieldOptions:
                      SelectedFieldOptions:
                        - {FieldId: qa-rs-type, CustomLabel: Feedback}
                        - {FieldId: qa-rs-reason, CustomLabel: Reason}
                        - {FieldId: qa-rs-n, CustomLabel: Ratings}
                        - {FieldId: qa-rs-users, CustomLabel: Users}
              - TableVisual:
                  VisualId: tbl-not-success
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Blocked and unanswered messages'}}
                  Subtitle: {Visibility: VISIBLE, FormatText: {PlainText: 'Use the conversation and message IDs to read the exchange in CloudWatch Logs'}}
                  ChartConfiguration:
                    FieldWells:
                      TableUnaggregatedFieldWells:
                        Values:
                          - {FieldId: qa-ns-time, Column: {DataSetIdentifier: chat, ColumnName: event_time}, FormatConfiguration: {DateTimeFormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm:ss'}}}
                          - {FieldId: qa-ns-user, Column: {DataSetIdentifier: chat, ColumnName: user_label}}
                          - {FieldId: qa-ns-agent, Column: {DataSetIdentifier: chat, ColumnName: agent_label}}
                          - {FieldId: qa-ns-status, Column: {DataSetIdentifier: chat, ColumnName: status_code}}
                          - {FieldId: qa-ns-surface, Column: {DataSetIdentifier: chat, ColumnName: surface_type}}
                          - {FieldId: qa-ns-scope, Column: {DataSetIdentifier: chat, ColumnName: message_scope}}
                          - {FieldId: qa-ns-conv, Column: {DataSetIdentifier: chat, ColumnName: conversation_id}}
                          - {FieldId: qa-ns-umid, Column: {DataSetIdentifier: chat, ColumnName: user_message_id}}
                          - {FieldId: qa-ns-smid, Column: {DataSetIdentifier: chat, ColumnName: system_message_id}}
                    SortConfiguration:
                      RowSort:
                        - FieldSort: {FieldId: qa-ns-time, Direction: DESC}
                      PaginationConfiguration: {PageSize: 100, PageNumber: 1}
                    FieldOptions:
                      SelectedFieldOptions:
                        - {FieldId: qa-ns-time, CustomLabel: Time (UTC)}
                        - {FieldId: qa-ns-user, CustomLabel: User}
                        - {FieldId: qa-ns-agent, CustomLabel: Agent}
                        - {FieldId: qa-ns-status, CustomLabel: Status}
                        - {FieldId: qa-ns-surface, CustomLabel: Surface}
                        - {FieldId: qa-ns-scope, CustomLabel: Scope}
                        - {FieldId: qa-ns-conv, CustomLabel: Conversation ID}
                        - {FieldId: qa-ns-umid, CustomLabel: User message ID}
                        - {FieldId: qa-ns-smid, CustomLabel: System message ID}
              - TableVisual:
                  VisualId: tbl-negative
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Negative feedback'}}
                  Subtitle: {Visibility: VISIBLE, FormatText: {PlainText: 'Reason and rating only - the free-text comment stays in CloudWatch Logs'}}
                  ChartConfiguration:
                    FieldWells:
                      TableUnaggregatedFieldWells:
                        Values:
                          - {FieldId: qa-ng-time, Column: {DataSetIdentifier: feedback, ColumnName: event_time}, FormatConfiguration: {DateTimeFormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm:ss'}}}
                          - {FieldId: qa-ng-user, Column: {DataSetIdentifier: feedback, ColumnName: user_label}}
                          - {FieldId: qa-ng-agent, Column: {DataSetIdentifier: feedback, ColumnName: agent_label}}
                          - {FieldId: qa-ng-reason, Column: {DataSetIdentifier: feedback, ColumnName: feedback_reason}}
                          - {FieldId: qa-ng-rating, Column: {DataSetIdentifier: feedback, ColumnName: rating}}
                          - {FieldId: qa-ng-conv, Column: {DataSetIdentifier: feedback, ColumnName: conversation_id}}
                          - {FieldId: qa-ng-smid, Column: {DataSetIdentifier: feedback, ColumnName: system_message_id}}
                    SortConfiguration:
                      RowSort:
                        - FieldSort: {FieldId: qa-ng-time, Direction: DESC}
                      PaginationConfiguration: {PageSize: 100, PageNumber: 1}
                    FieldOptions:
                      SelectedFieldOptions:
                        - {FieldId: qa-ng-time, CustomLabel: Time (UTC)}
                        - {FieldId: qa-ng-user, CustomLabel: User}
                        - {FieldId: qa-ng-agent, CustomLabel: Agent}
                        - {FieldId: qa-ng-reason, CustomLabel: Reason}
                        - {FieldId: qa-ng-rating, CustomLabel: Rating}
                        - {FieldId: qa-ng-conv, CustomLabel: Conversation ID}
                        - {FieldId: qa-ng-smid, CustomLabel: System message ID}
            Layouts:
              - Configuration:
                  GridLayout:
                    CanvasSizeOptions:
                      ScreenCanvasSizeOptions: {ResizeOption: FIXED, OptimizedViewPortWidth: '1600px'}
                    Elements:
                      - {ElementId: qa-kpi-success, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 6, RowIndex: 0, RowSpan: 5}
                      - {ElementId: qa-kpi-notsuccess, ElementType: VISUAL, ColumnIndex: 6, ColumnSpan: 6, RowIndex: 0, RowSpan: 5}
                      - {ElementId: qa-kpi-cited, ElementType: VISUAL, ColumnIndex: 12, ColumnSpan: 6, RowIndex: 0, RowSpan: 5}
                      - {ElementId: qa-kpi-latency, ElementType: VISUAL, ColumnIndex: 18, ColumnSpan: 6, RowIndex: 0, RowSpan: 5}
                      - {ElementId: qa-kpi-ttft, ElementType: VISUAL, ColumnIndex: 24, ColumnSpan: 6, RowIndex: 0, RowSpan: 5}
                      - {ElementId: qa-kpi-satisfaction, ElementType: VISUAL, ColumnIndex: 30, ColumnSpan: 6, RowIndex: 0, RowSpan: 5}
                      - {ElementId: qa-tbl-reasons, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 12, RowIndex: 5, RowSpan: 12}
                      - {ElementId: tbl-not-success, ElementType: VISUAL, ColumnIndex: 12, ColumnSpan: 24, RowIndex: 5, RowSpan: 12}
                      - {ElementId: tbl-negative, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 36, RowIndex: 17, RowSpan: 12}
          # ===================== Events =====================
          - SheetId: sh-events
            Name: Events
            Title: Events (audit)
            Description: "Every message and feedback event in the selected period, newest first, without prompts, responses or comments."
            ParameterControls:
              - DateTimePicker:
                  ParameterControlId: pc-ev-start
                  Title: From
                  SourceParameterName: pStart
                  DisplayOptions: {DateTimeFormat: 'YYYY-MM-DD'}
              - DateTimePicker:
                  ParameterControlId: pc-ev-end
                  Title: To (exclusive)
                  SourceParameterName: pEnd
                  DisplayOptions: {DateTimeFormat: 'YYYY-MM-DD'}
            FilterControls:
              - Dropdown:
                  FilterControlId: fc-ev-agent
                  Title: Agent
                  SourceFilterId: f-agent-ev
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
              - Dropdown:
                  FilterControlId: fc-ev-surface
                  Title: Surface
                  SourceFilterId: f-surface-ev
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
              - Dropdown:
                  FilterControlId: fc-ev-usertype
                  Title: User type
                  SourceFilterId: f-usertype-ev
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
            SheetControlLayouts:
              - Configuration:
                  GridLayout:
                    Elements:
                      - {ElementId: pc-ev-start, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: pc-ev-end, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-ev-agent, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-ev-surface, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-ev-usertype, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
            Visuals:
              - TableVisual:
                  VisualId: ev-tbl-messages
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Messages (metadata)'}}
                  ChartConfiguration:
                    FieldWells:
                      TableUnaggregatedFieldWells:
                        Values:
                          - {FieldId: ev-m-time, Column: {DataSetIdentifier: chat, ColumnName: event_time}, FormatConfiguration: {DateTimeFormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm:ss'}}}
                          - {FieldId: ev-m-user, Column: {DataSetIdentifier: chat, ColumnName: user_label}}
                          - {FieldId: ev-m-type, Column: {DataSetIdentifier: chat, ColumnName: user_type}}
                          - {FieldId: ev-m-agent, Column: {DataSetIdentifier: chat, ColumnName: agent_label}}
                          - {FieldId: ev-m-surface, Column: {DataSetIdentifier: chat, ColumnName: surface_type}}
                          - {FieldId: ev-m-scope, Column: {DataSetIdentifier: chat, ColumnName: message_scope}}
                          - {FieldId: ev-m-status, Column: {DataSetIdentifier: chat, ColumnName: status_code}}
                          - {FieldId: ev-m-latency, Column: {DataSetIdentifier: chat, ColumnName: latency}}
                          - {FieldId: ev-m-flow, Column: {DataSetIdentifier: chat, ColumnName: flow_id}}
                          - {FieldId: ev-m-conv, Column: {DataSetIdentifier: chat, ColumnName: conversation_id}}
                          - {FieldId: ev-m-umid, Column: {DataSetIdentifier: chat, ColumnName: user_message_id}}
                          - {FieldId: ev-m-smid, Column: {DataSetIdentifier: chat, ColumnName: system_message_id}}
                    SortConfiguration:
                      RowSort:
                        - FieldSort: {FieldId: ev-m-time, Direction: DESC}
                      PaginationConfiguration: {PageSize: 100, PageNumber: 1}
                    FieldOptions:
                      SelectedFieldOptions:
                        - {FieldId: ev-m-time, CustomLabel: Time (UTC)}
                        - {FieldId: ev-m-user, CustomLabel: User}
                        - {FieldId: ev-m-type, CustomLabel: User type}
                        - {FieldId: ev-m-agent, CustomLabel: Agent}
                        - {FieldId: ev-m-surface, CustomLabel: Surface}
                        - {FieldId: ev-m-scope, CustomLabel: Scope}
                        - {FieldId: ev-m-status, CustomLabel: Status}
                        - {FieldId: ev-m-latency, CustomLabel: Latency}
                        - {FieldId: ev-m-flow, CustomLabel: Flow ID}
                        - {FieldId: ev-m-conv, CustomLabel: Conversation ID}
                        - {FieldId: ev-m-umid, CustomLabel: User message ID}
                        - {FieldId: ev-m-smid, CustomLabel: System message ID}
              - TableVisual:
                  VisualId: ev-tbl-feedback
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Feedback events'}}
                  ChartConfiguration:
                    FieldWells:
                      TableUnaggregatedFieldWells:
                        Values:
                          - {FieldId: ev-f-time, Column: {DataSetIdentifier: feedback, ColumnName: event_time}, FormatConfiguration: {DateTimeFormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm:ss'}}}
                          - {FieldId: ev-f-user, Column: {DataSetIdentifier: feedback, ColumnName: user_label}}
                          - {FieldId: ev-f-type, Column: {DataSetIdentifier: feedback, ColumnName: feedback_type}}
                          - {FieldId: ev-f-reason, Column: {DataSetIdentifier: feedback, ColumnName: feedback_reason}}
                          - {FieldId: ev-f-rating, Column: {DataSetIdentifier: feedback, ColumnName: rating}}
                          - {FieldId: ev-f-agent, Column: {DataSetIdentifier: feedback, ColumnName: agent_label}}
                          - {FieldId: ev-f-conv, Column: {DataSetIdentifier: feedback, ColumnName: conversation_id}}
                          - {FieldId: ev-f-smid, Column: {DataSetIdentifier: feedback, ColumnName: system_message_id}}
                          - {FieldId: ev-f-research, Column: {DataSetIdentifier: feedback, ColumnName: research_id}}
                    SortConfiguration:
                      RowSort:
                        - FieldSort: {FieldId: ev-f-time, Direction: DESC}
                      PaginationConfiguration: {PageSize: 100, PageNumber: 1}
                    FieldOptions:
                      SelectedFieldOptions:
                        - {FieldId: ev-f-time, CustomLabel: Time (UTC)}
                        - {FieldId: ev-f-user, CustomLabel: User}
                        - {FieldId: ev-f-type, CustomLabel: Feedback}
                        - {FieldId: ev-f-reason, CustomLabel: Reason}
                        - {FieldId: ev-f-rating, CustomLabel: Rating}
                        - {FieldId: ev-f-agent, CustomLabel: Agent}
                        - {FieldId: ev-f-conv, CustomLabel: Conversation ID}
                        - {FieldId: ev-f-smid, CustomLabel: System message ID}
                        - {FieldId: ev-f-research, CustomLabel: Research ID}
            Layouts:
              - Configuration:
                  GridLayout:
                    CanvasSizeOptions:
                      ScreenCanvasSizeOptions: {ResizeOption: FIXED, OptimizedViewPortWidth: '1600px'}
                    Elements:
                      - {ElementId: ev-tbl-messages, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 36, RowIndex: 0, RowSpan: 16}
                      - {ElementId: ev-tbl-feedback, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 36, RowIndex: 16, RowSpan: 12}
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}
        - {Key: ManagedBy, Value: CloudFormation}

Outputs:
  ChatDataSetArn:
    Description: Quick dataset over CHAT_LOGS metadata (Direct Query).
    Value: !GetAtt ChatDataSet.Arn
  FeedbackDataSetArn:
    Description: Quick dataset over FEEDBACK_LOGS metadata joined to messages (Direct Query).
    Value: !GetAtt FeedbackDataSet.Arn
  DashboardUrl:
    Description: Open the dashboard in Amazon Quick (this Region).
    Value: !Sub 'https://${AWS::Region}.quicksight.aws.amazon.com/sn/dashboards/${ResourcePrefix}-dashboard'

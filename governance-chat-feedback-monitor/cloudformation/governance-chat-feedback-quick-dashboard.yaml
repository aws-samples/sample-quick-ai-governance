                          - NumericalMeasureField: {FieldId: us-flows, Column: {DataSetIdentifier: chat, ColumnName: flow_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                          - DateMeasureField: {FieldId: us-first, Column: {DataSetIdentifier: chat, ColumnName: event_time}, AggregationFunction: MIN, FormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm'}}
                          - DateMeasureField: {FieldId: us-last, Column: {DataSetIdentifier: chat, ColumnName: event_time}, AggregationFunction: MAX, FormatConfiguration: {DateTimeFormat: 'YYYY-MM-DD HH:mm'}}
                    SortConfiguration:
                      RowSort:
                        - FieldSort: {FieldId: us-msgs, Direction: DESC}
                    FieldOptions:
                      SelectedFieldOptions:
                        - {FieldId: us-user, CustomLabel: User}
                        - {FieldId: us-type, CustomLabel: Type}
                        - {FieldId: us-msgs, CustomLabel: Messages}
                        - {FieldId: us-convs, CustomLabel: Conversations}
                        - {FieldId: us-agents, CustomLabel: Agents used}
                        - {FieldId: us-success, CustomLabel: Answered}
                        - {FieldId: us-flows, CustomLabel: Flow runs}
                        - {FieldId: us-first, CustomLabel: First activity}
                        - {FieldId: us-last, CustomLabel: Last activity}
              - PivotTableVisual:
                  VisualId: us-pivot-agents
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Messages by user and agent'}}
                  ChartConfiguration:
                    FieldWells:
                      PivotTableAggregatedFieldWells:
                        Rows:
                          - CategoricalDimensionField: {FieldId: us-pv-user, Column: {DataSetIdentifier: chat, ColumnName: user_label}}
                        Columns:
                          - CategoricalDimensionField: {FieldId: us-pv-agent, Column: {DataSetIdentifier: chat, ColumnName: agent_label}}
                        Values:
                          - NumericalMeasureField: {FieldId: us-pv-n, Column: {DataSetIdentifier: chat, ColumnName: message_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                    TotalOptions:
                      RowTotalOptions: {TotalsVisibility: VISIBLE}
                      ColumnTotalOptions: {TotalsVisibility: VISIBLE}
              - BarChartVisual:
                  VisualId: us-bar-top
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Top 15 users by messages'}}
                  ChartConfiguration:
                    FieldWells:
                      BarChartAggregatedFieldWells:
                        Category:
                          - CategoricalDimensionField: {FieldId: us-tb-user, Column: {DataSetIdentifier: chat, ColumnName: user_label}}
                        Values:
                          - NumericalMeasureField: {FieldId: us-tb-n, Column: {DataSetIdentifier: chat, ColumnName: message_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}

              - TableVisual:
                  VisualId: us-tbl-users
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Users - activity and outcomes (sorted by messages)'}}
                  ChartConfiguration:
                    FieldWells:
                      TableAggregatedFieldWells:
                        GroupBy:
                          - CategoricalDimensionField: {FieldId: us-user, Column: {DataSetIdentifier: chat, ColumnName: user_label}}
                          - CategoricalDimensionField: {FieldId: us-type, Column: {DataSetIdentifier: chat, ColumnName: user_type}}
                        Values:
                          - NumericalMeasureField: {FieldId: us-msgs, Column: {DataSetIdentifier: chat, ColumnName: message_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                          - CategoricalMeasureField: {FieldId: us-convs, Column: {DataSetIdentifier: chat, ColumnName: conversation_id}, AggregationFunction: DISTINCT_COUNT}
                          - CategoricalMeasureField: {FieldId: us-agents, Column: {DataSetIdentifier: chat, ColumnName: agent_label}, AggregationFunction: DISTINCT_COUNT}
                          - NumericalMeasureField:

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Amazon Quick chat and feedback monitor - native Amazon Quick dashboard for
  administrators. Creates Glue tables over the CHAT_LOGS and FEEDBACK_LOGS
  objects delivered to S3 (message text and comment fields are deliberately
  not declared), two Direct Query datasets (Athena, custom SQL) and a five-tab
  dashboard: Overview, Users, Agents, Quality, Events. Requires the governance
  analytics foundation stack in the same Region.

# Prerequisites (NOT created by this stack):
#   * governance-analytics-foundation deployed in this Region.
#   * CHAT_LOGS and FEEDBACK_LOGS delivered to S3 (the Chat and Feedback module's
#     field-minimized deliveries, or the S3 deliveries Quick's console creates).
#   * Optional: an agent_id,agent_name CSV under AgentNamesLocation (the module's
#     agent-name resolver exports it) - without it agents show their IDs.
#   * Manual, console only: Manage Quick -> Security & permissions -> AWS
#     resources -> Manage: Amazon Athena enabled and DataBucketName selected.
#
# Privacy by construction: the Glue tables omit user_message,
# system_text_message and feedback_details, so neither Athena nor Quick can
# read conversation content through this stack. Correlation IDs are kept so
# investigators can pivot to the CloudWatch Logs audit trail.

Parameters:
  ResourcePrefix:
    Type: String
    Default: 'quick-governance-chat-feedback'
    AllowedPattern: '^[a-z0-9-]{1,40}$'
    Description: Prefix for the Quick dataset and dashboard IDs.

  FoundationStackName:
    Type: String
    Default: 'quick-governance-analytics-foundation'
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]{0,127}$'
    Description: Stack name of the governance analytics foundation (exports are imported).

  DataBucketName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    Description: >
      Bucket holding the CHAT_LOGS and FEEDBACK_LOGS objects. Empty (default)
      reads the shared analytics bucket created by the foundation stack; set it
      to read another bucket (for example the console-created deliveries),
      together with ChatPrefix and FeedbackPrefix.

  ChatPrefix:
    Type: String
    Default: 'chat-feedback/chat/'
    AllowedPattern: '^([A-Za-z0-9_=./-]+/)?$'
    Description: Prefix of the CHAT_LOGS objects (for console-created deliveries, AWSLogs/<account-id>/quicksuitelogs/chat-logs/).

  FeedbackPrefix:
    Type: String
    Default: 'chat-feedback/feedback/'
    AllowedPattern: '^([A-Za-z0-9_=./-]+/)?$'
    Description: Prefix of the FEEDBACK_LOGS objects (for console-created deliveries, AWSLogs/<account-id>/quicksuitelogs/feedback-logs/).

  AgentNamesLocation:
    Type: String
    Default: ''
    AllowedPattern: '^$|^s3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]/([A-Za-z0-9_=./-]+/)?$'
    Description: >
      S3 location (s3://bucket/prefix/) of the agent_id,agent_name CSV. Empty
      uses chat-feedback/agent-names/ in the foundation analytics bucket.

  QuickPrincipalArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:quicksight:[a-z0-9-]+:[0-9]{12}:(user|group)/.+$'
    Description: Quick user or group ARN (identity Region) that owns the datasets and dashboard.

Conditions:
  DefaultAgentNamesLocation: !Equals [!Ref AgentNamesLocation, '']
  UseSharedBucket: !Equals [!Ref DataBucketName, '']

Resources:

  # ----- Glue tables ------------------------------------------------------------
  # OpenX JSON SerDe over gzip JSON lines, no partitions (same modeling as the
  # agent-hours table). Content fields are not declared on purpose.

  ChatTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseName:
        Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
      TableInput:
        Name: chat_logs
        Description: Amazon Quick CHAT_LOGS events - metadata only (user_message and system_text_message not declared).
        TableType: EXTERNAL_TABLE
        Parameters: {classification: json, EXTERNAL: 'TRUE'}
        StorageDescriptor:
          Location: !If
            - UseSharedBucket
            - !Sub
              - 's3://${Bucket}/${ChatPrefix}'
              - Bucket:
                  Fn::ImportValue: !Sub '${FoundationStackName}-AnalyticsBucket'
            - !Sub 's3://${DataBucketName}/${ChatPrefix}'
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          Compressed: true
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters: {ignore.malformed.json: 'true', case.insensitive: 'true'}
          Columns:
            - {Name: resource_arn, Type: string}
            - {Name: resource_id, Type: string}
            - {Name: event_timestamp, Type: bigint}
            - {Name: logtype, Type: string}
            - {Name: accountid, Type: string}
            - {Name: user_arn, Type: string}
            - {Name: user_type, Type: string}
            - {Name: namespace, Type: string}
            - {Name: status_code, Type: string}
            - {Name: conversation_id, Type: string}
            - {Name: system_message_id, Type: string}
            - {Name: user_message_id, Type: string}
            - {Name: latency, Type: string}
            - {Name: time_to_first_token, Type: string}
            - {Name: message_scope, Type: string}
            - {Name: agent_id, Type: string}
            - {Name: flow_id, Type: string}
            - {Name: surface_type, Type: string}
            - {Name: web_search, Type: string}
            - {Name: user_selected_resources, Type: string}
            - {Name: action_connectors, Type: string}
            - {Name: cited_resource, Type: string}
            - {Name: file_attachment, Type: string}

  FeedbackTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseName:
        Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
      TableInput:
        Name: feedback_logs
        Description: Amazon Quick FEEDBACK_LOGS events - metadata only (feedback_details not declared).
        TableType: EXTERNAL_TABLE
        Parameters: {classification: json, EXTERNAL: 'TRUE'}
        StorageDescriptor:
          Location: !If
            - UseSharedBucket
            - !Sub
              - 's3://${Bucket}/${FeedbackPrefix}'
              - Bucket:
                  Fn::ImportValue: !Sub '${FoundationStackName}-AnalyticsBucket'
            - !Sub 's3://${DataBucketName}/${FeedbackPrefix}'
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          Compressed: true
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters: {ignore.malformed.json: 'true', case.insensitive: 'true'}
          Columns:
            - {Name: resource_arn, Type: string}
            - {Name: resource_id, Type: string}
            - {Name: event_timestamp, Type: bigint}
            - {Name: logtype, Type: string}
            - {Name: accountid, Type: string}
            - {Name: user_arn, Type: string}
            - {Name: user_type, Type: string}
            - {Name: namespace, Type: string}
            - {Name: status_code, Type: string}
            - {Name: conversation_id, Type: string}
            - {Name: research_id, Type: string}
            - {Name: system_message_id, Type: string}
            - {Name: user_message_id, Type: string}
            - {Name: feedback_type, Type: string}
            - {Name: feedback_reason, Type: string}
            - {Name: rating, Type: string}

  # agent_id,agent_name CSV with a header row. Empty until the resolver exports
  # it; the datasets fall back to the agent ID.
  AgentNamesTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseName:
        Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
      TableInput:
        Name: chat_agent_names
        Description: Quick agent ID to friendly name (CSV exported by the Chat and Feedback module).
        TableType: EXTERNAL_TABLE
        Parameters: {classification: csv, EXTERNAL: 'TRUE', skip.header.line.count: '1'}
        StorageDescriptor:
          Location: !If
            - DefaultAgentNamesLocation
            - !Sub
              - 's3://${Bucket}/chat-feedback/agent-names/'
              - Bucket:
                  Fn::ImportValue: !Sub '${FoundationStackName}-AnalyticsBucket'
            - !Ref AgentNamesLocation
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.OpenCSVSerde
            Parameters: {separatorChar: ',', quoteChar: '"', escapeChar: '\'}
          Columns:
            - {Name: agent_id, Type: string}
            - {Name: agent_name, Type: string}

  # ----- Datasets: Direct Query, metadata only ---------------------------------

  ChatDataSet:
    Type: AWS::QuickSight::DataSet
    DependsOn: [ChatTable, AgentNamesTable]
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DataSetId: !Sub '${ResourcePrefix}-chat'
      Name: Quick governance - chat messages (metadata)
      ImportMode: DIRECT_QUERY
      PhysicalTableMap:
        chat:
          CustomSql:
            DataSourceArn:
              Fn::ImportValue: !Sub '${FoundationStackName}-QuickDataSourceArn'
            Name: chat
            SqlQuery: !Sub
              - |
                SELECT
                  CAST(from_unixtime(CASE WHEN c.event_timestamp > 100000000000 THEN c.event_timestamp / 1000 ELSE c.event_timestamp END) AS TIMESTAMP) AS event_time,
                  c.user_arn,
                  regexp_replace(c.user_arn, '^.*:user/', '') AS user_label,
                  COALESCE(c.user_type, 'unknown') AS user_type,
                  c.namespace,
                  COALESCE(c.status_code, 'unknown') AS status_code,
                  CASE WHEN c.status_code = 'success' THEN 1 ELSE 0 END AS success_count,
                  CASE WHEN c.status_code IS NULL OR c.status_code <> 'success' THEN 1 ELSE 0 END AS not_success_count,
                  c.conversation_id,
                  c.user_message_id,
                  c.system_message_id,
                  c.agent_id,
                  COALESCE(a.agent_name, CASE WHEN c.agent_id = 'SYSTEM' THEN 'Default chat agent' END, c.agent_id, '(no agent)') AS agent_label,
                  c.flow_id,
                  COALESCE(c.message_scope, 'unknown') AS message_scope,
                  COALESCE(c.surface_type, 'unknown') AS surface_type,
                  TRY_CAST(c.latency AS DOUBLE) AS latency,
                  TRY_CAST(c.time_to_first_token AS DOUBLE) AS time_to_first_token,
                  CASE WHEN c.cited_resource IS NOT NULL AND c.cited_resource NOT IN ('', '[]', 'null') THEN 1 ELSE 0 END AS cited_count,
                  CASE WHEN c.flow_id IS NOT NULL AND c.flow_id <> '' THEN 1 ELSE 0 END AS flow_count,
                  1 AS message_count
                FROM "${Db}"."chat_logs" c
                LEFT JOIN "${Db}"."chat_agent_names" a ON a.agent_id = c.agent_id
                WHERE c.event_timestamp IS NOT NULL
              - Db:
                  Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
            Columns:
              - {Name: event_time, Type: DATETIME}
              - {Name: user_arn, Type: STRING}
              - {Name: user_label, Type: STRING}
              - {Name: user_type, Type: STRING}
              - {Name: namespace, Type: STRING}
              - {Name: status_code, Type: STRING}
              - {Name: success_count, Type: INTEGER}
              - {Name: not_success_count, Type: INTEGER}
              - {Name: conversation_id, Type: STRING}
              - {Name: user_message_id, Type: STRING}
              - {Name: system_message_id, Type: STRING}
              - {Name: agent_id, Type: STRING}
              - {Name: agent_label, Type: STRING}
              - {Name: flow_id, Type: STRING}
              - {Name: message_scope, Type: STRING}
              - {Name: surface_type, Type: STRING}
              - {Name: latency, Type: DECIMAL}
              - {Name: time_to_first_token, Type: DECIMAL}
              - {Name: cited_count, Type: INTEGER}
              - {Name: flow_count, Type: INTEGER}
              - {Name: message_count, Type: INTEGER}
      LogicalTableMap:
        chat:
          Alias: chat
          Source: {PhysicalTableId: chat}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions:
            - quicksight:DescribeDataSet
            - quicksight:DescribeDataSetPermissions
            - quicksight:PassDataSet
            - quicksight:DescribeIngestion
            - quicksight:ListIngestions
            - quicksight:UpdateDataSet
            - quicksight:DeleteDataSet
            - quicksight:CreateIngestion
            - quicksight:CancelIngestion
            - quicksight:UpdateDataSetPermissions
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}
        - {Key: ManagedBy, Value: CloudFormation}

  # Feedback joined to the rated message so ratings can be attributed to an
  # agent and a surface. Positive / negative classification tolerates the
  # naming variants seen across Quick releases.
  FeedbackDataSet:
    Type: AWS::QuickSight::DataSet
    DependsOn: [ChatTable, FeedbackTable, AgentNamesTable]
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DataSetId: !Sub '${ResourcePrefix}-feedback'
      Name: Quick governance - feedback (metadata)
      ImportMode: DIRECT_QUERY
      PhysicalTableMap:
        feedback:
          CustomSql:
            DataSourceArn:
              Fn::ImportValue: !Sub '${FoundationStackName}-QuickDataSourceArn'
            Name: feedback
            SqlQuery: !Sub
              - |
                SELECT
                  CAST(from_unixtime(CASE WHEN f.event_timestamp > 100000000000 THEN f.event_timestamp / 1000 ELSE f.event_timestamp END) AS TIMESTAMP) AS event_time,
                  f.user_arn,
                  regexp_replace(f.user_arn, '^.*:user/', '') AS user_label,
                  COALESCE(f.user_type, 'unknown') AS user_type,
                  COALESCE(f.feedback_type, 'unknown') AS feedback_type,
                  COALESCE(f.feedback_reason, '(no reason given)') AS feedback_reason,
                  TRY_CAST(f.rating AS DOUBLE) AS rating,
                  CASE WHEN lower(replace(f.feedback_type, '_', ' ')) IN ('useful', 'thumbs up', 'positive', 'up', 'like', 'helpful') THEN 1 ELSE 0 END AS positive_count,
                  CASE WHEN lower(replace(f.feedback_type, '_', ' ')) IN ('not useful', 'notuseful', 'thumbs down', 'negative', 'down', 'dislike', 'not helpful') THEN 1 ELSE 0 END AS negative_count,
                  f.conversation_id,
                  f.user_message_id,
                  f.system_message_id,
                  f.research_id,
                  COALESCE(a.agent_name, CASE WHEN c.agent_id = 'SYSTEM' THEN 'Default chat agent' END, c.agent_id, '(not linked to a message)') AS agent_label,
                  COALESCE(c.surface_type, 'unknown') AS surface_type,
                  1 AS feedback_count
                FROM "${Db}"."feedback_logs" f
                LEFT JOIN "${Db}"."chat_logs" c ON c.system_message_id = f.system_message_id
                LEFT JOIN "${Db}"."chat_agent_names" a ON a.agent_id = c.agent_id
                WHERE f.event_timestamp IS NOT NULL
              - Db:
                  Fn::ImportValue: !Sub '${FoundationStackName}-GlueDatabase'
            Columns:
              - {Name: event_time, Type: DATETIME}
              - {Name: user_arn, Type: STRING}
              - {Name: user_label, Type: STRING}
              - {Name: user_type, Type: STRING}
              - {Name: feedback_type, Type: STRING}
              - {Name: feedback_reason, Type: STRING}
              - {Name: rating, Type: DECIMAL}
              - {Name: positive_count, Type: INTEGER}
              - {Name: negative_count, Type: INTEGER}
              - {Name: conversation_id, Type: STRING}
              - {Name: user_message_id, Type: STRING}
              - {Name: system_message_id, Type: STRING}
              - {Name: research_id, Type: STRING}
              - {Name: agent_label, Type: STRING}
              - {Name: surface_type, Type: STRING}
              - {Name: feedback_count, Type: INTEGER}
      LogicalTableMap:
        feedback:
          Alias: feedback
          Source: {PhysicalTableId: feedback}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions:
            - quicksight:DescribeDataSet
            - quicksight:DescribeDataSetPermissions
            - quicksight:PassDataSet
            - quicksight:DescribeIngestion
            - quicksight:ListIngestions
            - quicksight:UpdateDataSet
            - quicksight:DeleteDataSet
            - quicksight:CreateIngestion
            - quicksight:CancelIngestion
            - quicksight:UpdateDataSetPermissions
      Tags:
        - {Key: Purpose, Value: !Ref ResourcePrefix}
        - {Key: ManagedBy, Value: CloudFormation}

  # ----- Dashboard: administrator view, five tabs -------------------------------

  Dashboard:
    Type: AWS::QuickSight::Dashboard
    Properties:
      AwsAccountId: !Ref 'AWS::AccountId'
      DashboardId: !Sub '${ResourcePrefix}-dashboard'
      Name: Amazon Quick - chat and feedback
      VersionDescription: Administrator dashboard - Overview, Users, Agents, Quality, Events (metadata only).
      DashboardPublishOptions:
        AdHocFilteringOption: {AvailabilityStatus: ENABLED}
        ExportToCSVOption: {AvailabilityStatus: ENABLED}
        SheetControlsOption: {VisibilityState: EXPANDED}
      Permissions:
        - Principal: !Ref QuickPrincipalArn
          Actions:
            - quicksight:DescribeDashboard
            - quicksight:ListDashboardVersions
            - quicksight:UpdateDashboardPermissions
            - quicksight:QueryDashboard
            - quicksight:UpdateDashboard
            - quicksight:DeleteDashboard
            - quicksight:DescribeDashboardPermissions
            - quicksight:UpdateDashboardPublishedVersion
      Definition:
        DataSetIdentifierDeclarations:
          - Identifier: chat
            DataSetArn: !GetAtt ChatDataSet.Arn
          - Identifier: feedback
            DataSetArn: !GetAtt FeedbackDataSet.Arn
        ParameterDeclarations:
          - DateTimeParameterDeclaration:
              Name: pStart
              TimeGranularity: DAY
              DefaultValues:
                RollingDate: {Expression: "addDateTime(-3, 'MM', truncDate('MM', now()))"}
          - DateTimeParameterDeclaration:
              Name: pEnd
              TimeGranularity: DAY
              DefaultValues:
                RollingDate: {Expression: "addDateTime(1, 'DD', truncDate('DD', now()))"}
        CalculatedFields:
          - DataSetIdentifier: chat
            Name: success_rate
            Expression: "ifelse(sum({message_count}) = 0, 0, sum({success_count}) / sum({message_count}))"
          - DataSetIdentifier: feedback
            Name: satisfaction
            Expression: "ifelse(sum({positive_count}) + sum({negative_count}) = 0, 0, sum({positive_count}) / (sum({positive_count}) + sum({negative_count})))"
        FilterGroups:
          # Time range: parameter-driven, both datasets, every sheet.
          - FilterGroupId: fg-range
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - TimeRangeFilter:
                  FilterId: f-range
                  Column: {DataSetIdentifier: chat, ColumnName: event_time}
                  IncludeMinimum: true
                  IncludeMaximum: false
                  RangeMinimumValue: {Parameter: pStart}
                  RangeMaximumValue: {Parameter: pEnd}
                  NullOption: NON_NULLS_ONLY
                  TimeGranularity: DAY
            ScopeConfiguration:
              AllSheets: {}
          # Quality tab: only messages that did not succeed / negative feedback.
          - FilterGroupId: fg-not-success
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-not-success
                  Column: {DataSetIdentifier: chat, ColumnName: status_code}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: DOES_NOT_CONTAIN
                      CategoryValues: [success]
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-quality
                    Scope: SELECTED_VISUALS
                    VisualIds: [tbl-not-success]
          - FilterGroupId: fg-negative
            CrossDataset: SINGLE_DATASET
            Status: ENABLED
            Filters:
              - NumericEqualityFilter:
                  FilterId: f-negative
                  Column: {DataSetIdentifier: feedback, ColumnName: negative_count}
                  MatchOperator: EQUALS
                  Value: 1
                  NullOption: NON_NULLS_ONLY
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-quality
                    Scope: SELECTED_VISUALS
                    VisualIds: [tbl-negative]
          - FilterGroupId: fg-agent-ov
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-agent-ov
                  Column: {DataSetIdentifier: chat, ColumnName: agent_label}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-overview
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-surface-ov
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-surface-ov
                  Column: {DataSetIdentifier: chat, ColumnName: surface_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-overview
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-usertype-ov
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-usertype-ov
                  Column: {DataSetIdentifier: chat, ColumnName: user_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-overview
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-agent-us
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-agent-us
                  Column: {DataSetIdentifier: chat, ColumnName: agent_label}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-users
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-surface-us
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-surface-us
                  Column: {DataSetIdentifier: chat, ColumnName: surface_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-users
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-usertype-us
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-usertype-us
                  Column: {DataSetIdentifier: chat, ColumnName: user_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-users
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-agent-ag
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-agent-ag
                  Column: {DataSetIdentifier: chat, ColumnName: agent_label}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-agents
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-surface-ag
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-surface-ag
                  Column: {DataSetIdentifier: chat, ColumnName: surface_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-agents
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-usertype-ag
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-usertype-ag
                  Column: {DataSetIdentifier: chat, ColumnName: user_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-agents
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-agent-qa
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-agent-qa
                  Column: {DataSetIdentifier: chat, ColumnName: agent_label}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-quality
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-surface-qa
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-surface-qa
                  Column: {DataSetIdentifier: chat, ColumnName: surface_type}
                  Configuration:
                    FilterListConfiguration:
                      MatchOperator: CONTAINS
                      SelectAllOptions: FILTER_ALL_VALUES
            ScopeConfiguration:
              SelectedSheets:
                SheetVisualScopingConfigurations:
                  - SheetId: sh-quality
                    Scope: ALL_VISUALS
          - FilterGroupId: fg-usertype-qa
            CrossDataset: ALL_DATASETS
            Status: ENABLED
            Filters:
              - CategoryFilter:
                  FilterId: f-usertype-qa
                  Column: {DataSetIdentifier: chat, ColumnName: user_type}

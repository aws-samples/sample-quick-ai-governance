        Sheets:
          # ===================== Overview =====================
          - SheetId: sh-overview
            Name: Overview
            Title: Chat and feedback - overview
            Description: "Adoption, response outcomes and user sentiment for the selected period. Metadata only - no message content."
            ParameterControls:
              - DateTimePicker:
                  ParameterControlId: pc-ov-start
                  Title: From
                  SourceParameterName: pStart
                  DisplayOptions: {DateTimeFormat: 'YYYY-MM-DD'}
              - DateTimePicker:
                  ParameterControlId: pc-ov-end
                  Title: To (exclusive)
                  SourceParameterName: pEnd
                  DisplayOptions: {DateTimeFormat: 'YYYY-MM-DD'}
            FilterControls:
              - Dropdown:
                  FilterControlId: fc-ov-agent
                  Title: Agent
                  SourceFilterId: f-agent-ov
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
              - Dropdown:
                  FilterControlId: fc-ov-surface
                  Title: Surface
                  SourceFilterId: f-surface-ov
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
              - Dropdown:
                  FilterControlId: fc-ov-usertype
                  Title: User type
                  SourceFilterId: f-usertype-ov
                  Type: MULTI_SELECT
                  DisplayOptions:
                    SelectAllOptions: {Visibility: VISIBLE}
                    TitleOptions: {Visibility: VISIBLE}
            SheetControlLayouts:
              - Configuration:
                  GridLayout:
                    Elements:
                      - {ElementId: pc-ov-start, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: pc-ov-end, ElementType: PARAMETER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-ov-agent, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-ov-surface, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
                      - {ElementId: fc-ov-usertype, ElementType: FILTER_CONTROL, ColumnSpan: 2, RowSpan: 1}
            Visuals:
              - KPIVisual:
                  VisualId: ov-kpi-messages
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Messages'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-messages-v, Column: {DataSetIdentifier: chat, ColumnName: message_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-conversations
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Conversations'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - CategoricalMeasureField: {FieldId: ov-kpi-conversations-v, Column: {DataSetIdentifier: chat, ColumnName: conversation_id}, AggregationFunction: DISTINCT_COUNT}
              - KPIVisual:
                  VisualId: ov-kpi-users
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Active users'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - CategoricalMeasureField: {FieldId: ov-kpi-users-v, Column: {DataSetIdentifier: chat, ColumnName: user_arn}, AggregationFunction: DISTINCT_COUNT}
              - KPIVisual:
                  VisualId: ov-kpi-agents
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Agents used'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - CategoricalMeasureField: {FieldId: ov-kpi-agents-v, Column: {DataSetIdentifier: chat, ColumnName: agent_label}, AggregationFunction: DISTINCT_COUNT}
              - KPIVisual:
                  VisualId: ov-kpi-success
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Answered successfully'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField:
                            FieldId: ov-kpi-success-v
                            Column: {DataSetIdentifier: chat, ColumnName: success_rate}
                            FormatConfiguration: {FormatConfiguration: {PercentageDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 1}}}}
              - KPIVisual:
                  VisualId: ov-kpi-up
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Thumbs up'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-up-v, Column: {DataSetIdentifier: feedback, ColumnName: positive_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-down
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Thumbs down'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField: {FieldId: ov-kpi-down-v, Column: {DataSetIdentifier: feedback, ColumnName: negative_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
              - KPIVisual:
                  VisualId: ov-kpi-satisfaction
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Satisfaction (up / rated)'}}
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField:
                            FieldId: ov-kpi-satisfaction-v
                            Column: {DataSetIdentifier: feedback, ColumnName: satisfaction}
                            FormatConfiguration: {FormatConfiguration: {PercentageDisplayFormatConfiguration: {DecimalPlacesConfiguration: {DecimalPlaces: 1}}}}
              - BarChartVisual:
                  VisualId: ov-bar-status-trend
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Daily messages by response status'}}
                  ChartConfiguration:
                    FieldWells:
                      BarChartAggregatedFieldWells:
                        Category:
                          - DateDimensionField: {FieldId: ov-st-day, Column: {DataSetIdentifier: chat, ColumnName: event_time}, DateGranularity: DAY}
                        Values:
                          - NumericalMeasureField: {FieldId: ov-st-n, Column: {DataSetIdentifier: chat, ColumnName: message_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                        Colors:
                          - CategoricalDimensionField: {FieldId: ov-st-status, Column: {DataSetIdentifier: chat, ColumnName: status_code}}
                    Orientation: VERTICAL
                    BarsArrangement: STACKED
                    Legend: {Visibility: VISIBLE, Position: BOTTOM}
              - BarChartVisual:
                  VisualId: ov-bar-feedback-trend
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Daily feedback by type'}}
                  ChartConfiguration:
                    FieldWells:
                      BarChartAggregatedFieldWells:
                        Category:
                          - DateDimensionField: {FieldId: ov-fb-day, Column: {DataSetIdentifier: feedback, ColumnName: event_time}, DateGranularity: DAY}
                        Values:
                          - NumericalMeasureField: {FieldId: ov-fb-n, Column: {DataSetIdentifier: feedback, ColumnName: feedback_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                        Colors:
                          - CategoricalDimensionField: {FieldId: ov-fb-type, Column: {DataSetIdentifier: feedback, ColumnName: feedback_type}}
                    Orientation: VERTICAL
                    BarsArrangement: STACKED
                    Legend: {Visibility: VISIBLE, Position: BOTTOM}
              - BarChartVisual:
                  VisualId: ov-bar-top-agents
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Top 10 agents by messages'}}
                  Subtitle: {Visibility: VISIBLE, FormatText: {PlainText: 'Friendly names appear once the module exports the agent-name CSV; otherwise the agent ID is shown'}}
                  ChartConfiguration:
                    FieldWells:
                      BarChartAggregatedFieldWells:
                        Category:
                          - CategoricalDimensionField: {FieldId: ov-ta-agent, Column: {DataSetIdentifier: chat, ColumnName: agent_label}}
                        Values:
                          - NumericalMeasureField: {FieldId: ov-ta-n, Column: {DataSetIdentifier: chat, ColumnName: message_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                        Colors:
                          - CategoricalDimensionField: {FieldId: ov-ta-status, Column: {DataSetIdentifier: chat, ColumnName: status_code}}
                    SortConfiguration:
                      CategorySort:
                        - FieldSort: {FieldId: ov-ta-n, Direction: DESC}
                      CategoryItemsLimit: {ItemsLimit: 10, OtherCategories: EXCLUDE}
                    Orientation: HORIZONTAL
                    BarsArrangement: STACKED
                    Legend: {Visibility: VISIBLE, Position: BOTTOM}
              - BarChartVisual:
                  VisualId: ov-bar-surfaces
                  Title: {Visibility: VISIBLE, FormatText: {PlainText: 'Messages by surface and user type'}}
                  ChartConfiguration:
                    FieldWells:
                      BarChartAggregatedFieldWells:
                        Category:
                          - CategoricalDimensionField: {FieldId: ov-sf-surface, Column: {DataSetIdentifier: chat, ColumnName: surface_type}}
                        Values:
                          - NumericalMeasureField: {FieldId: ov-sf-n, Column: {DataSetIdentifier: chat, ColumnName: message_count}, AggregationFunction: {SimpleNumericalAggregation: SUM}}
                        Colors:
                          - CategoricalDimensionField: {FieldId: ov-sf-usertype, Column: {DataSetIdentifier: chat, ColumnName: user_type}}
                    SortConfiguration:
                      CategorySort:
                        - FieldSort: {FieldId: ov-sf-n, Direction: DESC}
                    Orientation: HORIZONTAL
                    BarsArrangement: STACKED
                    Legend: {Visibility: VISIBLE, Position: BOTTOM}
            TextBoxes:
              - SheetTextBoxId: ov-txt-howto
                Content: >-
                  <text-box><block align="left"><inline font-weight="bold">How to read this dashboard.</inline> Messages are
                  CHAT_LOGS events (one per user prompt and response); feedback events are Useful / Not Useful ratings with
                  an optional reason. Only metadata is loaded here - prompts, responses and free-text comments stay in the
                  KMS-encrypted CloudWatch log group; copy a conversation or message ID from the Events tab to look them up
                  there. Per-user views are sensitive: involve privacy and legal teams before sharing this dashboard
                  widely.</block></text-box>
            Layouts:
              - Configuration:
                  GridLayout:
                    CanvasSizeOptions:
                      ScreenCanvasSizeOptions: {ResizeOption: FIXED, OptimizedViewPortWidth: '1600px'}
                    Elements:
                      - {ElementId: ov-kpi-messages, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 4, RowIndex: 0, RowSpan: 5}
                      - {ElementId: ov-kpi-conversations, ElementType: VISUAL, ColumnIndex: 4, ColumnSpan: 4, RowIndex: 0, RowSpan: 5}
                      - {ElementId: ov-kpi-users, ElementType: VISUAL, ColumnIndex: 8, ColumnSpan: 4, RowIndex: 0, RowSpan: 5}
                      - {ElementId: ov-kpi-agents, ElementType: VISUAL, ColumnIndex: 12, ColumnSpan: 4, RowIndex: 0, RowSpan: 5}
                      - {ElementId: ov-kpi-success, ElementType: VISUAL, ColumnIndex: 16, ColumnSpan: 5, RowIndex: 0, RowSpan: 5}
                      - {ElementId: ov-kpi-up, ElementType: VISUAL, ColumnIndex: 21, ColumnSpan: 5, RowIndex: 0, RowSpan: 5}
                      - {ElementId: ov-kpi-down, ElementType: VISUAL, ColumnIndex: 26, ColumnSpan: 5, RowIndex: 0, RowSpan: 5}
                      - {ElementId: ov-kpi-satisfaction, ElementType: VISUAL, ColumnIndex: 31, ColumnSpan: 5, RowIndex: 0, RowSpan: 5}
                      - {ElementId: ov-bar-status-trend, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 18, RowIndex: 5, RowSpan: 11}
                      - {ElementId: ov-bar-feedback-trend, ElementType: VISUAL, ColumnIndex: 18, ColumnSpan: 18, RowIndex: 5, RowSpan: 11}
                      - {ElementId: ov-bar-top-agents, ElementType: VISUAL, ColumnIndex: 0, ColumnSpan: 22, RowIndex: 16, RowSpan: 11}
                      - {ElementId: ov-bar-surfaces, ElementType: VISUAL, ColumnIndex: 22, ColumnSpan: 14, RowIndex: 16, RowSpan: 11}
                      - {ElementId: ov-txt-howto, ElementType: TEXT_BOX, ColumnIndex: 0, ColumnSpan: 36, RowIndex: 27, RowSpan: 3}

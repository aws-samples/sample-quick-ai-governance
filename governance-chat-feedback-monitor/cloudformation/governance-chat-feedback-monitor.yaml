AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Amazon Quick chat and feedback monitor. Delivers the regional CHAT_LOGS and
  FEEDBACK_LOGS vended-log feeds to an encrypted CloudWatch Logs log group (the
  content audit trail) and, field-minimized, to the shared analytics bucket of
  the Analytics Foundation stack, where the module's Amazon Quick dashboard
  reads them through Athena. A small Lambda exports the agent ID-to-name CSV the
  dashboard joins on, refreshed daily and on every agent create/rename/delete.
  Log delivery is not retroactive. Assumes Quick is in the same AWS account.

# Prerequisites (not created by this stack):
#   * The Analytics Foundation stack in this account and Region (its
#     AnalyticsBucketName output is this template's AnalyticsBucketName parameter;
#     the apply script resolves it).
#   * Amazon Quick AI features enabled (Enterprise or Professional subscription).
#   * The deploying principal must hold the IAM permission
#     quicksight:AllowVendedLogDeliveryForResource on the Quick account.
#
# Chat logs contain prompts, responses, resource names, and attachment metadata.
# Only the CloudWatch log group holds that content; the S3 copies exclude it.
# Restrict access to the log group according to your data policy.
# Vended-log delivery is regional; deploy once in each active Quick Region.

Parameters:
  ResourcePrefix:
    Type: String
    Default: quick-governance-chat-feedback-monitor
    Description: Prefix applied to named resources.
    AllowedPattern: '^[a-z0-9-]{1,40}$'
    ConstraintDescription: 1-40 lowercase letters, digits, or hyphens.

  LogGroupName:
    Type: String
    Default: /aws/vendedlogs/quick/chat-feedback
    Description: CloudWatch Logs log group receiving chat and feedback events.
    AllowedPattern: '^[\.\-_/#A-Za-z0-9]+$'

  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: Retention in days for prompts, responses, and feedback.

  EnableKmsEncryption:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Encrypt the log group with a dedicated customer managed KMS key.

  CreateChatDeliverySource:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Create CHAT_LOGS source; set false to reuse an existing source.

  ExistingChatDeliverySourceName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[\w-]{1,60}$'
    Description: Existing CHAT_LOGS source name when creation is disabled.

  CreateFeedbackDeliverySource:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Create FEEDBACK_LOGS source; set false to reuse an existing source.

  ExistingFeedbackDeliverySourceName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[\w-]{1,60}$'
    Description: Existing FEEDBACK_LOGS source name when creation is disabled.

  AnalyticsBucketName:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: An existing S3 bucket name (3-63 chars).
    Description: >
      Shared analytics bucket created by the Analytics Foundation stack (its
      AnalyticsBucketName output; the apply script resolves it). The
      field-minimized copies of both feeds land under chat-feedback/chat/ and
      chat-feedback/feedback/, the agent-name lookup under chat-feedback/agent-names/.

  EnableAgentLifecycleTrigger:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Deliver the AGENT_METADATA_LOGS feed (agent create/update/delete events,
      identifiers and names only) to a small log group and refresh agent
      friendly names as soon as an agent is renamed, created or deleted,
      instead of waiting for the daily refresh. Set to false if another stack
      already owns a delivery source for that log type.

Conditions:
  WithKms: !Equals [!Ref EnableKmsEncryption, 'true']
  WithAgentMetadata: !Equals [!Ref EnableAgentLifecycleTrigger, 'true']
  CreateChatSource: !Equals [!Ref CreateChatDeliverySource, 'true']
  ReuseChatSource: !Equals [!Ref CreateChatDeliverySource, 'false']
  CreateFeedbackSource: !Equals [!Ref CreateFeedbackDeliverySource, 'true']
  ReuseFeedbackSource: !Equals [!Ref CreateFeedbackDeliverySource, 'false']
Resources:
  LogsKey:
    Type: AWS::KMS::Key
    Condition: WithKms
    Properties:
      Description: !Sub 'Encrypts ${ResourcePrefix} conversation and feedback logs'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchLogsUse
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}-agent-metadata'
          - Sid: AllowVendedLogDeliveryUse
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: '*'
            Condition:
              # StringLike, as the Amazon Quick documentation prescribes: the
              # value carries a wildcard, which StringEquals would take literally
              # (security review M1).
              StringLike:
                kms:EncryptionContext:SourceArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*'
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix
        - Key: ManagedBy
          Value: CloudFormation

  LogsKeyAlias:
    Type: AWS::KMS::Alias
    Condition: WithKms
    Properties:
      AliasName: !Sub 'alias/${ResourcePrefix}'
      TargetKeyId: !Ref LogsKey

  InteractionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Ref LogGroupName
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !If [WithKms, !GetAtt LogsKey.Arn, !Ref 'AWS::NoValue']
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix
        - Key: DataClassification
          Value: Sensitive
        - Key: ManagedBy
          Value: CloudFormation

  ChatDeliverySource:
    Type: AWS::Logs::DeliverySource
    Condition: CreateChatSource
    Properties:
      Name: !Sub '${ResourcePrefix}-chat-source'
      LogType: CHAT_LOGS
      ResourceArn: !Sub 'arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:account/${AWS::AccountId}'
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  FeedbackDeliverySource:
    Type: AWS::Logs::DeliverySource
    Condition: CreateFeedbackSource
    Properties:
      Name: !Sub '${ResourcePrefix}-feedback-source'
      LogType: FEEDBACK_LOGS
      ResourceArn: !Sub 'arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:account/${AWS::AccountId}'
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  ChatDeliveryDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: !Sub '${ResourcePrefix}-chat-cwl'
      DeliveryDestinationType: CWL
      DestinationResourceArn: !GetAtt InteractionLogGroup.Arn
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  FeedbackDeliveryDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: !Sub '${ResourcePrefix}-feedback-cwl'
      DeliveryDestinationType: CWL
      DestinationResourceArn: !GetAtt InteractionLogGroup.Arn
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  ChatDeliveryWithNewSource:
    Type: AWS::Logs::Delivery
    Condition: CreateChatSource
    DependsOn: ChatDeliverySource
    Properties:
      DeliverySourceName: !Sub '${ResourcePrefix}-chat-source'
      DeliveryDestinationArn: !GetAtt ChatDeliveryDestination.Arn
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  ChatDeliveryWithExistingSource:
    Type: AWS::Logs::Delivery
    Condition: ReuseChatSource
    Properties:
      DeliverySourceName: !Ref ExistingChatDeliverySourceName
      DeliveryDestinationArn: !GetAtt ChatDeliveryDestination.Arn
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  FeedbackDeliveryWithNewSource:
    Type: AWS::Logs::Delivery
    Condition: CreateFeedbackSource
    DependsOn: FeedbackDeliverySource
    Properties:
      DeliverySourceName: !Sub '${ResourcePrefix}-feedback-source'
      DeliveryDestinationArn: !GetAtt FeedbackDeliveryDestination.Arn
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  FeedbackDeliveryWithExistingSource:
    Type: AWS::Logs::Delivery
    Condition: ReuseFeedbackSource
    Properties:
      DeliverySourceName: !Ref ExistingFeedbackDeliverySourceName
      DeliveryDestinationArn: !GetAtt FeedbackDeliveryDestination.Arn
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  # ----- Optional S3 copy: field-minimized, into the shared analytics bucket ----
  # RecordFields lists every field the log type offers except the three that
  # carry conversation content (user_message, system_text_message,
  # feedback_details). Field lists per DescribeConfigurationTemplates; mandatory
  # fields (resource_arn, event_timestamp, logType, accountId, feedback_type)
  # are included. A delivery source may carry several S3 deliveries, so this
  # coexists with any console-created delivery of the full feed.

  ChatS3DeliveryDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: !Sub '${ResourcePrefix}-chat-shared-s3'
      DeliveryDestinationType: S3
      DestinationResourceArn: !Sub 'arn:${AWS::Partition}:s3:::${AnalyticsBucketName}/chat-feedback/chat'
      OutputFormat: json
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  FeedbackS3DeliveryDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: !Sub '${ResourcePrefix}-feedback-shared-s3'
      DeliveryDestinationType: S3
      DestinationResourceArn: !Sub 'arn:${AWS::Partition}:s3:::${AnalyticsBucketName}/chat-feedback/feedback'
      OutputFormat: json
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  ChatS3DeliveryWithNewSource:
    Type: AWS::Logs::Delivery
    Condition: CreateChatSource
    DependsOn: ChatDeliverySource
    Properties:
      DeliverySourceName: !Sub '${ResourcePrefix}-chat-source'
      DeliveryDestinationArn: !GetAtt ChatS3DeliveryDestination.Arn
      S3EnableHiveCompatiblePath: true
      RecordFields:
        - timestamp
        - resource_arn
        - resource_id
        - event_timestamp
        - logType
        - accountId
        - user_arn
        - user_type
        - namespace
        - status_code
        - conversation_id
        - system_message_id
        - latency
        - time_to_first_token
        - message_scope
        - user_message_id
        - agent_id
        - flow_id
        - surface_type
        - web_search
        - user_selected_resources
        - action_connectors
        - cited_resource
        - file_attachment
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  ChatS3DeliveryWithExistingSource:
    Type: AWS::Logs::Delivery
    Condition: ReuseChatSource
    Properties:
      DeliverySourceName: !Ref ExistingChatDeliverySourceName
      DeliveryDestinationArn: !GetAtt ChatS3DeliveryDestination.Arn
      S3EnableHiveCompatiblePath: true
      RecordFields:
        - timestamp
        - resource_arn
        - resource_id
        - event_timestamp
        - logType
        - accountId
        - user_arn
        - user_type
        - namespace
        - status_code
        - conversation_id
        - system_message_id
        - latency
        - time_to_first_token
        - message_scope
        - user_message_id
        - agent_id
        - flow_id
        - surface_type
        - web_search
        - user_selected_resources
        - action_connectors
        - cited_resource
        - file_attachment
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  FeedbackS3DeliveryWithNewSource:
    Type: AWS::Logs::Delivery
    Condition: CreateFeedbackSource
    DependsOn: FeedbackDeliverySource
    Properties:
      DeliverySourceName: !Sub '${ResourcePrefix}-feedback-source'
      DeliveryDestinationArn: !GetAtt FeedbackS3DeliveryDestination.Arn
      S3EnableHiveCompatiblePath: true
      RecordFields:
        - timestamp
        - resource_arn
        - resource_id
        - event_timestamp
        - logType
        - accountId
        - user_arn
        - user_type
        - namespace
        - status_code
        - conversation_id
        - research_id
        - system_message_id
        - user_message_id
        - feedback_type
        - feedback_reason
        - rating
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  FeedbackS3DeliveryWithExistingSource:
    Type: AWS::Logs::Delivery
    Condition: ReuseFeedbackSource
    Properties:
      DeliverySourceName: !Ref ExistingFeedbackDeliverySourceName
      DeliveryDestinationArn: !GetAtt FeedbackS3DeliveryDestination.Arn
      S3EnableHiveCompatiblePath: true
      RecordFields:
        - timestamp
        - resource_arn
        - resource_id
        - event_timestamp
        - logType
        - accountId
        - user_arn
        - user_type
        - namespace
        - status_code
        - conversation_id
        - research_id
        - system_message_id
        - user_message_id
        - feedback_type
        - feedback_reason
        - rating
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  AgentLookupFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ResourcePrefix}-agent-name-resolver'
      RetentionInDays: 14
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix
        - Key: ManagedBy
          Value: CloudFormation

  AgentLookupFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: agent-lookup-refresh
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListQuickAgents
                Effect: Allow
                Action: quicksight:ListAgents
                Resource: '*'
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${AgentLookupFunctionLogGroup.Arn}:*'
              - Sid: ExportAgentNamesCsv
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AnalyticsBucketName}/chat-feedback/agent-names/*'
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix
        - Key: ManagedBy
          Value: CloudFormation

  AgentLookupFunction:
    Type: AWS::Lambda::Function
    DependsOn: AgentLookupFunctionLogGroup
    Properties:
      FunctionName: !Sub '${ResourcePrefix}-agent-name-resolver'
      Description: Exports the Quick agent ID-to-name CSV that the Quick dashboard joins on.
      Runtime: python3.14
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 128
      Timeout: 900
      Role: !GetAtt AgentLookupFunctionRole.Arn
      Environment:
        Variables:
          AWS_ACCOUNT_ID: !Ref 'AWS::AccountId'
          EXPORT_BUCKET: !Ref AnalyticsBucketName
          EXPORT_PREFIX: 'chat-feedback/agent-names/'
      Code:
        ZipFile: |
          import boto3
          import csv, io, json, os, urllib.request
          from urllib.parse import urlencode
          from botocore.auth import SigV4Auth
          from botocore.awsrequest import AWSRequest

          session = boto3.Session()
          account_id = os.environ["AWS_ACCOUNT_ID"]
          region = os.environ["AWS_REGION"]
          export_bucket = os.environ["EXPORT_BUCKET"]
          export_prefix = os.environ.get("EXPORT_PREFIX", "chat-feedback/agent-names/")

          def list_agents():
              token = None
              credentials = session.get_credentials().get_frozen_credentials()
              while True:
                  params = {"max-results": 100}
                  if token:
                      params["next-token"] = token
                  url = (f"https://quicksight.{region}.amazonaws.com/accounts/"
                         f"{account_id}/agents?{urlencode(params)}")
                  request = AWSRequest(method="GET", url=url)
                  SigV4Auth(credentials, "quicksight", region).add_auth(request)
                  http = urllib.request.Request(
                      url, headers=dict(request.prepare().headers), method="GET")
                  with urllib.request.urlopen(http, timeout=60) as stream:
                      response = json.load(stream)
                  yield from ((agent["AgentId"], agent["Name"])
                              for agent in response.get("AgentSummaries", []))
                  token = response.get("NextToken")
                  if not token:
                      break

          def refresh_export():
              rows = list(list_agents())
              output = io.StringIO()
              writer = csv.writer(output, lineterminator="\n")
              writer.writerow(["agent_id", "agent_name"])
              writer.writerows(sorted(rows))
              body = output.getvalue()
              # The Quick dashboard joins this CSV (Glue table chat_agent_names)
              # to show agent names instead of IDs.
              key = export_prefix + "agent-names.csv"
              boto3.client("s3").put_object(
                  Bucket=export_bucket, Key=key,
                  Body=body.encode("utf-8"), ContentType="text/csv")
              return {"AgentCount": len(rows),
                      "S3Export": f"s3://{export_bucket}/{key}"}

          def respond(event, context, status, data, physical_id, reason=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or ("See CloudWatch Logs: " + context.log_stream_name),
                  "PhysicalResourceId": physical_id,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data})
              request = urllib.request.Request(
                  event["ResponseURL"], data=body.encode("utf-8"), method="PUT",
                  headers={"content-type": "", "content-length": str(len(body))})
              urllib.request.urlopen(request, timeout=30).read()

          def handler(event, context):
              is_custom = "RequestType" in event
              physical_id = event.get("PhysicalResourceId",
                                      "agent-names:" + export_bucket)
              # Triggers: CloudFormation custom resource (deploy), EventBridge
              # schedule (daily), CloudWatch Logs subscription filter (an agent
              # lifecycle event such as UpdateAgent - i.e. a rename - landed in
              # the AGENT_METADATA_LOGS log group), or a manual invoke.
              trigger = ("custom-resource" if is_custom
                         else "agent-metadata-event" if "awslogs" in event
                         else "schedule-or-manual")
              print(f"Refreshing agent names, trigger={trigger}")
              try:
                  if is_custom and event["RequestType"] == "Delete":
                      # The CSV stays in the shared bucket with the rest of the
                      # module's data; nothing to tear down here.
                      result = {"Deleted": True}
                  else:
                      result = refresh_export()
                  if is_custom:
                      respond(event, context, "SUCCESS", result, physical_id)
                  return result
              except Exception as error:
                  if is_custom:
                      respond(event, context, "FAILED",
                              {"Error": str(error)[:1000]}, physical_id,
                              str(error)[:1000])
                      return
                  raise
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix
        - Key: ManagedBy
          Value: CloudFormation

  AgentLookupInitializer:
    Type: Custom::QuickAgentLookup
    Properties:
      ServiceToken: !GetAtt AgentLookupFunction.Arn
      ExportBucket: !Ref AnalyticsBucketName
      ResolverVersion: '3'

  AgentLookupSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ResourcePrefix}-agent-name-daily'
      Description: Refreshes Quick agent friendly names daily at 06:00 GMT-3.
      ScheduleExpression: cron(0 9 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt AgentLookupFunction.Arn
          Id: AgentLookupFunction
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 2

  AgentLookupSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AgentLookupFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AgentLookupSchedule.Arn

  # ----- Agent lifecycle trigger: rename, create, delete -> refresh names ------
  # Quick emits one AGENT_METADATA_LOGS record per agent operation
  # (CreateAgent, UpdateAgent, DeleteAgent, UpdateAgentPermissions, ...). The
  # feed lands in a small dedicated log group and a subscription filter invokes
  # the resolver, so a renamed agent shows its new name within a minute instead
  # of at the next daily run. RecordFields keeps the record to identifiers and
  # names: the documented sensitive fields (custom_prompt_input,
  # welcome_message, starter_prompts, instructions, magic_builder_query) are
  # not delivered. The daily schedule remains as the safety net.

  AgentMetadataLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: WithAgentMetadata
    Properties:
      LogGroupName: !Sub '${LogGroupName}-agent-metadata'
      RetentionInDays: 30
      KmsKeyId: !If [WithKms, !GetAtt LogsKey.Arn, !Ref 'AWS::NoValue']
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix
        - Key: ManagedBy
          Value: CloudFormation

  AgentMetadataDeliverySource:
    Type: AWS::Logs::DeliverySource
    Condition: WithAgentMetadata
    Properties:
      Name: !Sub '${ResourcePrefix}-agent-metadata-source'
      LogType: AGENT_METADATA_LOGS
      ResourceArn: !Sub 'arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:account/${AWS::AccountId}'
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  AgentMetadataDeliveryDestination:
    Type: AWS::Logs::DeliveryDestination
    Condition: WithAgentMetadata
    Properties:
      Name: !Sub '${ResourcePrefix}-agent-metadata-cwl'
      DeliveryDestinationType: CWL
      DestinationResourceArn: !GetAtt AgentMetadataLogGroup.Arn
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  AgentMetadataDelivery:
    Type: AWS::Logs::Delivery
    Condition: WithAgentMetadata
    DependsOn: AgentMetadataDeliverySource
    Properties:
      DeliverySourceName: !Sub '${ResourcePrefix}-agent-metadata-source'
      DeliveryDestinationArn: !GetAtt AgentMetadataDeliveryDestination.Arn
      RecordFields:
        - timestamp
        - resource_arn
        - resource_id
        - event_timestamp
        - log_type
        - account_id
        - user_arn
        - event_version
        - event_name
        - agent_id
        - request_id
        - agent_arn
        - agent_name
        - agent_status
        - update_action
        - version
      Tags:
        - Key: Purpose
          Value: !Ref ResourcePrefix

  # Invocation is limited to this account's agent-metadata log group through
  # SourceAccount and SourceArn (the exact log group ARN; the ":*" form is not
  # accepted here). Principal is the global CloudWatch Logs service principal
  # as documented for subscription filters, written as a literal string: the
  # regional !Sub form is an intrinsic-function map that policy scanners such
  # as cfn-guard (LAMBDA_FUNCTION_PUBLIC_ACCESS_PROHIBITED) cannot evaluate,
  # which reports this permission as public although it never was.
  AgentMetadataInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: WithAgentMetadata
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AgentLookupFunction
      Principal: logs.amazonaws.com
      SourceAccount: !Ref 'AWS::AccountId'
      SourceArn: !GetAtt AgentMetadataLogGroup.Arn

  AgentMetadataSubscription:
    Type: AWS::Logs::SubscriptionFilter
    Condition: WithAgentMetadata
    DependsOn: AgentMetadataInvokePermission
    Properties:
      LogGroupName: !Ref AgentMetadataLogGroup
      FilterName: !Sub '${ResourcePrefix}-agent-lifecycle'
      FilterPattern: '{ $.event_name = * }'
      DestinationArn: !GetAtt AgentLookupFunction.Arn

Outputs:
  AgentLookupFunctionName:
    Description: Daily Lambda function that refreshes the agent lookup table.
    Value: !Ref AgentLookupFunction

  ChatDeliverySourceName:
    Description: CHAT_LOGS delivery source created or reused by this stack.
    Value: !If [CreateChatSource, !Sub '${ResourcePrefix}-chat-source', !Ref ExistingChatDeliverySourceName]

  FeedbackDeliverySourceName:
    Description: FEEDBACK_LOGS delivery source created or reused by this stack.
    Value: !If [CreateFeedbackSource, !Sub '${ResourcePrefix}-feedback-source', !Ref ExistingFeedbackDeliverySourceName]

  LogGroupName:
    Description: Log group receiving regional CHAT_LOGS and FEEDBACK_LOGS events.
    Value: !Ref InteractionLogGroup

  KmsKeyArn:
    Condition: WithKms
    Description: KMS key encrypting the log group.
    Value: !GetAtt LogsKey.Arn

  TailFeedCommand:
    Description: Command to confirm chat and feedback events are arriving.
    Value: !Sub "aws logs tail '${LogGroupName}' --since 1h --follow --region ${AWS::Region}"

  S3DataLocation:
    Description: >
      Shared analytics bucket prefixes receiving the field-minimized copies
      (chat/ and feedback/ below it) - Glue table locations for the Quick dashboard.
    Value: !Sub 's3://${AnalyticsBucketName}/chat-feedback/'
